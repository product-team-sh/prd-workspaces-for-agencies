  <button class="sess-ico" id="sessPrev" title="Previous topic" aria-label="Previous topic">&#8249;</button>
  <button class="sess-ico" id="sessNext" title="Next topic" aria-label="Next topic">&#8250;</button>
  <button class="sess-ico" id="sessTog" title="Expand" aria-label="Expand the session panel">&#9650;</button>
  <button class="sess-ico" id="sessHide" title="Hide (Escape)" aria-label="Hide the session panel">&#10005;</button>
 </div>
 <div class="sess-body">
  <div class="sess-list" id="sessList" role="list"></div>
  <div class="sess-main" id="sessMain"></div>
 </div>
</div>
<button id="sessReopen" hidden>Validation panel</button>
<script>
/* ── the running order ───────────────────────────────────────────────────────
   One topic per open question in the pack, in the order that builds on itself:
   what the model is, then what it costs, then the two things we have not
   settled. Each carries the claim it is there to test, so a topic that gets a
   shrug is a finding rather than a gap in the script. `go` puts the prototype
   in the exact state that topic needs, which is the whole point: the answer to
   "show me" has to be one click and not a hunt through 48 screens.        */
const TOPICS=[
 {k:"isolate", t:"A client sees only its own workspace",
  claim:"Hard isolation is the thing we cannot do today. A client logging in reaches its own sequences, prospects and replies, and there is no surface on which another client exists.",
  ask:"Is this the thing blocking you from letting clients in, or is it something else?",
  watch:"If they say the blocker is trust in the product rather than visibility, the container model is solving the wrong problem.",
  src:"07 objective, 01 §6a",
  go:()=>{solo=false;ctx="nw";asClient=true;cView="sequences";openProspect=null;view={name:"clients"}}},
 {k:"staff", t:"Staff see only the clients they are on",
  claim:"Assignment is the primitive, not permission. Priya holds three clients, so every cross-client screen she opens is filtered to those three.",
  ask:"Who on your team should be able to see all clients, and who should not?",
  watch:"The interview said access is a mix, by role. If they want per-client toggles rather than assignment, that is a different model.",
  src:"16 §0.1, 19 §2",
  go:()=>{T_become("priya");solo=false;asClient=false;ctx="agency";view={name:"dash"}}},
 {k:"access", t:"What each client can reach, set per client",
  claim:"Not two roles. Seven screens and four actions, switched per client workspace, with presets for the common shapes. A client that only wants the numbers gets one screen and lands on it. The product hardcodes exactly this for two named accounts today because it cannot express it per workspace.",
  ask:"Take your two most different clients. What should each be able to see and do, and where do they differ?",
  watch:"If every client gets the same access, presets are enough and the toggles are waste. If they differ per client, two roles were never going to work and this is the feature.",
  src:"01 §55, user-details.tsx",
  open:"Custom access, any mix outside the five presets, is the case today's product cannot express without naming the account in code: user-details.tsx hardcodes two account ids for exactly this.",
  go:()=>{T_become("owner");solo=false;asClient=false;ctx="agency";view={name:"record",id:"bl"};tab="access"}},
 {k:"rollup", t:"Replies and tasks still roll up",
  claim:"Isolation must not cost the agency its own workflow. Work queues in one list filtered by assignment, with every row naming its client. Assets do not roll up.",
  ask:"You work several clients in a morning. Would you rather one list with a client column, or switch workspace per client?",
  watch:"If they want sequences and prospects rolled up too, the work-versus-asset line we drew is wrong.",
  src:"16 §0.1, 20 T3",
  go:()=>{T_become("owner");solo=false;asClient=false;ctx="agency";agyScope="clients";view={name:"inbox"}}},
 {k:"queue", t:"One queue, ordered by what it costs to ignore",
  claim:"Across every assigned client, ranked by consequence rather than by arrival. A dead mailbox outranks a reply.",
  ask:"What would you check first thing on a Monday, and is it on this list?",
  watch:"Anything they name that is missing is a real gap. Anything here they would not look at is furniture.",
  src:"17, 16 §7",
  go:()=>{solo=false;asClient=false;ctx="agency";view={name:"queue"}}},
 {k:"caps", t:"One pool, a cap per client",
  claim:"Credits stay pooled because that is what you bought, and each client gets a ceiling against it. A client at its ceiling asks you, not us.",
  ask:"Cap each client, reserve a floor for each, or let them draw freely and watch it?",
  watch:"The interview said cap each client. A second agency saying pool-and-watch means the cap is not the default.",
  src:"07 §5, 19 §2",
  open:"Which billing model is still Dhruv's call: pooled only, per-client only, or the hybrid built here (one shared pool, an independent budget per client on request, linked clients on their own plan). Hemanshu called it the biggest decision. Separately, verified against the live product on 8 Sep 2026: Account Plan Usage is one pooled quota for the whole account, with no client dimension. The allocation model here works inside that constraint and does not change it.",
  go:()=>{solo=false;asClient=false;ctx="agency";view={name:"credits"};activeRes="lead_finder"}},
 {k:"ask", t:"A client at its limit asks the agency",
  claim:"The client sees its own allowance and nothing about your plan, your cost or any other client. Running out produces a request to you with an amount and a reason.",
  ask:"Do you want your clients able to ask for more, or should that conversation stay off the platform?",
  watch:"If the request should not exist, the client-facing usage screen loses its reason to exist too.",
  src:"16 Flow E, 09 C3",
  go:()=>{solo=false;ctx="al";asClient=true;cView="usage";openProspect=null}},
 {k:"cost", t:"What each client costs to serve",
  claim:"Mailboxes plus credits, divided by positive replies. No competitor can produce this because none of them meters per client centrally.",
  ask:"Do you know today what a client costs you, and would you price differently if you did?",
  watch:"If they do not price on cost, this is a nice number rather than a reason to switch.",
  src:"17, 14",
  go:()=>{solo=false;asClient=false;ctx="agency";view={name:"dash"};cliTab="all"}},
 {k:"estate", t:"The sending estate per client",
  claim:"A mailbox belongs to exactly one workspace. You buy in the master, assign down, and what you purchased comes back to you when a client leaves so it can go to the next one. An inbox somebody connected because they already owned it goes where they go.",
  ask:"Who buys the mailboxes today, and what happens to them when a client leaves you?",
  watch:"Whether a mailbox keeps its warm-up and reputation through a move is unresolved, and no competitor manages it without losing the history. If they expect it to survive, that expectation is the risk.",
  src:"08 §16b, 20 row 4",
  open:"Whether a mailbox keeps its warm-up and reputation through a move, which no competitor manages without losing the history, and whether a client not on its own plan can connect an inbox at all.",
  go:()=>{solo=false;asClient=false;ctx="agency";view={name:"record",id:"nw"};tab="mailboxes";mailAll=false}},
 {k:"connect", t:"A client who already has Saleshandy",
  claim:"You request a link with their workspace ID. They approve inside their own account. They keep ownership and can revoke without asking you.",
  ask:"How many of your clients already pay us directly, and would they approve this?",
  watch:"The interview said some already do. Whether two prospect tables can coexist is open with Rajat and gates this whole path.",
  src:"16 §5.2, 08 §17.1",
  go:()=>{const c=CLIENTS.find(isPending)||byId.rm;solo=true;ctx=c.id;asClient=false;soloMod="settings";soloSet="workspace"}},
 {k:"launch", t:"Launch day for an account that already exists",
  claim:"Nothing moves without you. Existing clients become workspaces, and the only work asked of you is resolving mailboxes used by more than one client.",
  ask:"If this landed on your account on a Tuesday, what would you need to see before touching it?",
  watch:"The interview added a restriction step here. If launch day feels risky the whole migration needs reframing.",
  src:"16 §2, M1 and M2",
  go:()=>{solo=false;asClient=false;ctx="agency";MIG.deferred=false;MIG.reviewed=false;view={name:"m1"}}},
 {k:"agencyown", t:"The agency's own outreach is separate",
  claim:"Your own campaigns live in their own workspace, peer to a client's, in the same switcher. The master account administers and does nothing else, so no screen has to answer whose work it is before anything else. Your workspace draws on the same pool and carries a cap like any client.",
  ask:"Do you run outbound for your own new business today? From where, and who works the replies?",
  watch:"If they want to build a client campaign without leaving the screen they administer from, the separation costs them more than it saves and the picker comes back.",
  src:"20 row 1",
  go:()=>{solo=false;asClient=false;ctx="agency";agyScope="own";view={name:"seq"}}},
 {k:"scope", t:"Templates: one library, or one set per client",
  claim:"Nineteen features placed by three tests, and this is the one row where the test gives an answer we do not believe. Built as Pattern A: you publish a library, a workspace may write its own, and you can lock what you do not want changed. Switch into a client and open Templates to see the other half.",
  ask:"Templates: one library you publish to every client, or a separate set per client?",
  watch:"The whole scope matrix has never been put to an agency. This is the row I expect to be argued with, and the only one I am recommending rather than reporting.",
  src:"20 §2.1",
  open:"Three candidate rules. Publish and lock, as built: one library, no drift, and a client that writes its own copy is not blocked. A separate set per client: matches every other asset, and means maintaining the same opener in every workspace by hand. One library, nobody overrides: no drift at all, and wrong for a client that writes its own copy.",
  go:()=>{solo=false;asClient=false;ctx="agency";view={name:"tmpl"}}},
 {k:"grace", t:"When the agency's card fails",
  claim:"Clients keep reading, sending pauses, and the paused state names the agency and never the reason. The agency sees the failed payment, the days left, and every client as reading but not sending.",
  ask:"If your card failed on a Friday, what should your clients see on Monday morning?",
  watch:"If they want clients to see nothing at all, even the pause, then the pause has to be silent and that is a different promise to the client.",
  src:"29 §4.1, decided 12 Sep",
  go:()=>{GRACE.on=true;T_become("owner");solo=false;ctx="nw";asClient=true;cView="sequences";openProspect=null;view={name:"clients"}}},
];
const REACT=[["yes","Confirmed"],["no","Contradicted"],["meh","Did not care"],["new","New requirement"]];
const RDOT={yes:"d-yes",no:"d-no",meh:"d-meh",new:"d-new"};

/* switching person goes through the same path the person menu uses, so the rail
   and the dashboard guard both apply. An operator must not be dropped on a
   dashboard they cannot see. */
function T_become(who){me_=who;if(view.name==="dash"&&!canI("dashboard"))view={name:"queue"}}

const SKEY="sess.agency-workspaces.v1";
let sIdx=0, sOpen=false, sData={};
try{sData=JSON.parse(localStorage.getItem(SKEY)||"{}")}catch(e){sData={}}
const sSave=()=>{try{localStorage.setItem(SKEY,JSON.stringify(sData))}catch(e){}};
const sRec=k=>(sData[k]=sData[k]||{r:null,n:""});

function sessRender(){
 const S=el("sess"); if(!S||S.hidden) return;
 const T=TOPICS[sIdx], rec=sRec(T.k);
 const done=TOPICS.filter(x=>sData[x.k]&&(sData[x.k].r||sData[x.k].n)).length;
 el("sessCt").textContent=(sIdx+1)+" / "+TOPICS.length;
 el("sessNow").textContent=T.t;
 el("sessPrev").disabled=sIdx===0;
 el("sessNext").disabled=sIdx===TOPICS.length-1;
 el("sessTog").innerHTML=sOpen?"&#9660;":"&#9650;";
 el("sessTog").title=sOpen?"Collapse":"Expand";
 S.className=sOpen?"open":"collapsed";
 if(!sOpen) return;
 el("sessList").innerHTML=TOPICS.map((x,i)=>{const r=(sData[x.k]||{}).r;
  return `<button class="sess-li" role="listitem" data-si="${i}" aria-current="${i===sIdx}">
   <span class="sess-dot ${r?RDOT[r]:""}"></span>
   <span><b>${x.t}</b><i>${x.src}</i></span>
   <span></span></button>`}).join("");
 el("sessMain").innerHTML=`
  <p class="sess-h">${sIdx+1}. ${T.t}</p>
  <p class="sess-sub">Testing a claim from ${T.src}</p>
  <p class="sess-q">${T.ask}</p>
  <div class="sess-grid">
   <dl class="sess-cell"><dt>What this screen claims</dt><dd>${T.claim}</dd></dl>
   <dl class="sess-cell"><dt>What would change our mind</dt><dd>${T.watch}</dd></dl>
   ${T.open?`<dl class="sess-cell"><dt>Still open</dt><dd>${T.open}</dd></dl>`:""}
  </div>
  <div class="sess-react">${REACT.map(([k,l])=>
    `<button data-r="${k}" aria-pressed="${rec.r===k}">${l}</button>`).join("")}</div>
  <textarea id="sessNote" placeholder="What they actually said. Their words, not the summary.">${rec.n.replace(/</g,"&lt;")}</textarea>
  <div class="sess-foot">
   <button class="shd-button shd-button--tertiary shd-button--sm" id="sessCopy">Copy notes as Markdown</button>
   <button class="shd-button shd-button--tertiary shd-button--sm" id="sessDl">Download</button>
   <button class="shd-button shd-button--tertiary shd-button--sm" id="sessClear">Clear session</button>
   <span class="sub">${done} of ${TOPICS.length} recorded &middot; saved in this browser</span>
  </div>`;
 el("sessList").querySelectorAll("[data-si]").forEach(b=>b.onclick=()=>sessGo(+b.dataset.si));
 el("sessMain").querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{
   const r=b.dataset.r; rec.r=rec.r===r?null:r; sSave(); sessRender()});
 const n=el("sessNote");
 n.oninput=()=>{rec.n=n.value;sSave()};
 n.onblur=()=>sessRender();
 el("sessCopy").onclick=()=>sessExport("copy");
 el("sessDl").onclick=()=>sessExport("file");
 el("sessClear").onclick=()=>{if(confirm("Clear every reaction and note from this session?")){sData={};sSave();sessRender()}};
}

/* a topic navigates the prototype and then re-renders it. The panel is outside
   #page, so render() never touches it. */
function sessGo(i){
 sIdx=Math.max(0,Math.min(TOPICS.length-1,i));
 modal=null;drawer=null;popOpen=false;dq="";newOpen=false;newPick=null;recMenu=false;
 TOPICS[sIdx].go();
 render();
 if(el("modalWrap"))renderModal();
 if(el("drawerWrap"))renderDrawer();
 sessRender();
}

function sessMd(){
 const stamp=new Date().toISOString().slice(0,10);
 const lab={yes:"Confirmed",no:"Contradicted",meh:"Did not care",new:"New requirement"};
 let out="# Validation session, "+stamp+"\n\n"
  +"Walked against the prototype at `prototype/agency-admin.html`.\n\n"
  +"| # | Topic | Reaction | What they said | Source |\n|---|---|---|---|---|\n";
 TOPICS.forEach((t,i)=>{const r=sData[t.k]||{};
  out+="| "+(i+1)+" | "+t.t+" | "+(r.r?"**"+lab[r.r]+"**":"–")+" | "
    +((r.n||"").replace(/\s*\n\s*/g," ").replace(/\|/g,"\\|")||"–")+" | `"+t.src+"` |\n"});
 const changed=TOPICS.filter(t=>["no","new"].indexOf(((sData[t.k]||{}).r))>-1);
 out+="\n## What has to change\n\n"+(changed.length
  ?changed.map(t=>"- **"+t.t+"** ("+lab[sData[t.k].r]+"). "+((sData[t.k].n||"").replace(/\s*\n\s*/g," ")||"No note taken.")
     +" Claim under test: "+t.claim).join("\n")
  :"Nothing was contradicted and no new requirement was raised. Record that as a result, not as a blank.")+"\n";
 return out;
}
function sessExport(how){
 const md=sessMd();
 if(how==="copy"){
  const done=()=>{const b=el("sessCopy");b.textContent="Copied";setTimeout(()=>{b.textContent="Copy notes as Markdown"},1400)};
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(md).then(done,()=>sessFallback(md));
  else sessFallback(md);
  return;
 }
 const a=document.createElement("a");
 a.href=URL.createObjectURL(new Blob([md],{type:"text/markdown"}));
 a.download="validation-session-"+new Date().toISOString().slice(0,10)+".md";
 document.body.appendChild(a);a.click();a.remove();
}
/* clipboard is blocked on file:// in some builds, and a demo is the worst place
   to discover that. Fall back to a selectable textarea. */
function sessFallback(md){
 const w=document.createElement("div");
 w.style.cssText="position:fixed;inset:0;z-index:200;background:rgba(17,24,39,.45);display:flex;align-items:center;justify-content:center;padding:24px";
 w.innerHTML='<div style="background:#fff;border-radius:8px;padding:16px;max-width:720px;width:100%">'
  +'<p style="margin:0 0 8px;font-size:14px;font-weight:600">Select and copy</p>'
  +'<textarea readonly style="width:100%;box-sizing:border-box;height:320px;font-family:ui-monospace,Menlo,monospace;font-size:12px;border:1px solid #e5e7eb;border-radius:6px;padding:10px"></textarea>'
  +'<div style="margin-top:10px;text-align:right"><button style="font:inherit;font-size:13px;padding:6px 12px;border-radius:6px;border:1px solid #e5e7eb;background:#fff;cursor:pointer">Close</button></div></div>';
 document.body.appendChild(w);
 const ta=w.querySelector("textarea");ta.value=md;ta.select();
 w.querySelector("button").onclick=()=>w.remove();
 w.onclick=e=>{if(e.target===w)w.remove()};
}

function sessShow(on){
 const S=el("sess");
 S.hidden=!on;
 el("sessReopen").hidden=on;
 document.body.style.paddingBottom=on?(sOpen?"min(340px,46vh)":"46px"):"0";
 if(on) sessRender();
}
el("sessPrev").onclick=()=>sessGo(sIdx-1);
el("sessNext").onclick=()=>sessGo(sIdx+1);
el("sessTog").onclick=()=>{sOpen=!sOpen;document.body.style.paddingBottom=sOpen?"min(340px,46vh)":"46px";sessRender()};
el("sessHide").onclick=()=>sessShow(false);
el("sessReopen").onclick=()=>sessShow(true);
/* Escape hides the panel, but only once nothing else is claiming Escape: the
   modal and the drawer both use it and they are on top. */
document.addEventListener("keydown",e=>{
 if(e.key==="Escape"&&!modal&&!drawer&&!popOpen&&!el("sess").hidden){sessShow(false)}
 if((e.metaKey||e.ctrlKey)&&e.key==="/"){e.preventDefault();sessShow(el("sess").hidden)}
 if(el("sess").hidden||document.activeElement===el("sessNote")) return;
 if(e.key==="["){e.preventDefault();sessGo(sIdx-1)}
 if(e.key==="]"){e.preventDefault();sessGo(sIdx+1)}
});
/* #present opens the session on topic 1. Without the hash the prototype boots
   exactly as it did, so every existing deep link and the whole harness are
   unaffected.                                                              */
if(/(^|[#&])present\b/.test(location.hash)){sOpen=true;sessShow(true);sessGo(0)}
/* Version C opens on the product a normal user actually lands in, so the
   validation picker stays out of the way until asked for with #present. */
else{sessShow(false)}
</script>

 console.log("%cversion C build "+B,"background:#1D4ED8;color:#fff;padding:2px 6px;border-radius:3px");
 window.BUILD=B;})();
