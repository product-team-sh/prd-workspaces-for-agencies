/* 25 Sep 2026: "Add a member" becomes "Add a person", one screen with two
   paths from a first "who are you adding" step, because the old screen could
   only ever invite someone at the agency itself - a client user had no way
   in here at all (defect D5, 54-people-rework.md). `kind` is null at the
   picker, then "agency" or "client" for the rest of the session. */
const AM_BLANK={email:"",name:"",role:"Member",ws:[],mode:"invite",from:null,
 kind:null,wsId:"",crole:"Client Collaborator"};
let AM=Object.assign({},AM_BLANK);

const amWs=()=>CLIENTS.concat([OWN_WS]);
const amById=id=>amWs().filter(w=>w.id===id)[0];
const amValidEmail=e=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test((e||"").trim());
const amPersonOk=()=>amValidEmail(AM.email)&&AM.name.trim().length>1;
/* Owner and Admin reach every workspace by role alone, so Workspaces is only
   a real question, and only a required one, for a Member. */
const amFilled=()=>AM.role!=="Member"||AM.ws.length>0;
const amWsPicked=()=>!!AM.wsId;
const amCanSend=()=>AM.kind==="client"?(amWsPicked()&&amPersonOk())
 :AM.kind==="agency"?(amPersonOk()&&amFilled()):false;
const amOpen=o=>{AM=Object.assign({},AM_BLANK,{ws:[]},o||{}); view={name:"addmember"}; render()};

/* keystrokes update the model directly and repaint only the bits that must
   stay live (footer, rail, preview), never the whole screen: a full render on
   every keystroke would steal the caret out from under the person typing.
   `amLiveBind` is the one place that trick lives, so every text field in this
   flow gets it the same way. Fixed 25 Sep 2026 (defect D1): the old handler
   updated the model and nothing else, so Send stayed disabled until the next
   click happened to trigger a full render. */
function amLiveBind(input,key){
 if(!input) return;
 input.oninput=()=>{AM[key]=input.value; amPatchLive()};
}
function amPatchLive(){
 const foot=document.querySelector(".am-footrow"), sendBtn=document.querySelector("[data-amsend]");
 const preview=document.querySelector(".am-preview");
 if(sendBtn) sendBtn.disabled=!amCanSend();
 if(foot){const line=foot.querySelector(".sub,.fsum"); if(line) line.outerHTML=amFooterLine()}
 if(preview) preview.innerHTML=amPreviewLine();
 const railWrap=document.querySelector(".am-rail"); if(railWrap) railWrap.outerHTML=amRail();
}

function amSecPerson(){
 return `<div class="panel-b sec" id="amSec1">
  <div class="sec-h"><span class="sec-n${amPersonOk()?" is-done":""}">1</span><span class="sec-t">Person</span>
   <span class="sub">Email, name and their account role</span></div>
  <div class="frow">
   <div class="fld" style="margin:0"><label class="cs" for="amEmail">Work email</label>
    <input type="email" id="amEmail" style="width:100%" value="${AM.email}" placeholder="ana@meridiangrowth.com" autocomplete="off" spellcheck="false">
    <span class="cs" style="margin-top:6px">${AM.mode==="edit"?"Changing this address invites a different person; it does not rename this one."
      :"The invite goes here. They set their own password; "+AGENCY.name+" never holds it."}</span></div>
   <div class="fld" style="margin:0"><label class="cs" for="amName">Full name</label>
    <input type="text" id="amName" style="width:100%" value="${AM.name}" placeholder="Ana Costa" autocomplete="off"></div></div>
  <div style="margin-top:16px"><span class="cs">Account role</span>
   <span class="cs" style="margin:0 0 8px">What they may do to ${AGENCY.name} itself. Owner is transferred, not offered here; see a person's own page.</span>
   ${roleCards(AGENCY_ROLES.filter(r=>r!=="Owner"),AM.role,"data-amrole",false)}
   <button class="linkbtn" data-amcompare style="margin-top:8px">Compare all roles</button></div>
 </div>`;
}

function amSecWhere(){
 if(AM.role!=="Member") return `<div class="panel-b sec" id="amSec2">
  <div class="sec-h"><span class="sec-n is-done">2</span><span class="sec-t">Workspaces</span>
   <span class="sub">Every workspace, always</span></div>
  <p class="sub" style="margin:0">${AM.role} reaches every workspace, including ones you create later. Nothing to pick.</p>
 </div>`;
 return `<div class="panel-b sec" id="amSec2">
  <div class="sec-h"><span class="sec-n${AM.ws.length?" is-done":""}">2</span><span class="sec-t">Workspaces</span>
   <span class="sub">${AM.ws.length?AM.ws.length+" picked":"Which workspaces should they reach"}</span></div>
  <div class="wsbox">${amWs().map(w=>{const on=AM.ws.indexOf(w.id)>-1;
   /* 18 Sep, delight pass: each row says how the workspace is doing, and the
      agency's own workspace carries its colour on the edge so it is never
      mistaken for a client */
   const near=RK.filter(k=>RES[k].rows[w.id]&&["warn","bad"].indexOf(rowState(k,w.id,compute(k)).tone)>-1).length;
   const health=(w.own?"Your own outreach, not a client":w.company)
      +" &middot; "+(w.own?"":staffOf(w).length+" staff &middot; ")+((w.mailboxes||[]).length)+" mailbox"+(((w.mailboxes||[]).length===1)?"":"es")
      +(near?` &middot; <span style="color:var(--amber-700)">${near} near a limit</span>`:"");
   return `<label class="wsrow${w.own?" st-own":""}" style="${w.own?"--c:"+w.colour:""}">
    <input type="checkbox" name="amws" value="${w.id}" ${on?"checked":""}>
    <span class="avatar av-tint" style="--c:${w.colour};width:26px;height:26px;border-radius:6px;font-size:10px">${initials(w.name)}</span>
    <span style="min-width:0;flex:1"><span class="wsn trunc">${w.name}</span>
     <span class="wsc trunc">${health}</span></span></label>`}).join("")}</div>
 </div>`;
}
/* the client path's role cards, reusing CLIENT_ROLE_DEFS's own one-line
   description so this can never say something different from what the
   client's own workspace says about the same role. `ctxVal`, when given,
   makes each card's value "ctx|role" instead of a bare role, so the same
   markup serves both the invite flow (no context needed) and a specific
   client user's own person page (context: clientId|email). */
function clientRoleCards(sel,attr,ctxVal){
 return `<div class="choices" role="radiogroup" aria-label="Client role">${CLIENT_ROLES.map(r=>{
  const d=CLIENT_ROLE_DEFS[r];
  return `<button class="choice" role="radio" aria-checked="${sel===r}" ${attr}="${ctxVal?ctxVal+"|"+r:r}">
   <span class="rdo"></span><span style="min-width:0"><b>${r}</b><i>${d.desc}</i></span></button>`}).join("")}</div>`;
}

 return `<div class="panel-b sec" id="amSec1">
  <div class="sec-h"><span class="sec-n${amWsPicked()?" is-done":""}">1</span><span class="sec-t">Workspace</span>
   <span class="sub">Which client they sign in to</span></div>
  <select id="amWsPick" class="inp" style="width:100%;max-width:420px">
   <option value="">Choose a workspace</option>
   ${CLIENTS.map(c=>`<option value="${c.id}" ${AM.wsId===c.id?"selected":""}>${c.name}</option>`).join("")}
  </select>
 </div>`;
}
function amSecClientRole(){
 return `<div class="panel-b sec" id="amSec2">
  <div class="sec-h"><span class="sec-n is-done">2</span><span class="sec-t">Role</span>
   <span class="sub">${AM.crole}</span></div>
  ${clientRoleCards(AM.crole,"data-amcrole")}
 </div>`;
}
function amSecClientPerson(){
 return `<div class="panel-b sec" id="amSec3">
  <div class="sec-h"><span class="sec-n${amPersonOk()?" is-done":""}">3</span><span class="sec-t">Person</span>
   <span class="sub">Email and name</span></div>
  <div class="frow">
   <div class="fld" style="margin:0"><label class="cs" for="amEmail">Work email</label>
    <input type="email" id="amEmail" style="width:100%" value="${AM.email}" placeholder="ana@northwind.co" autocomplete="off" spellcheck="false">
    <span class="cs" style="margin-top:6px">The invite goes here. They set their own password.</span></div>

/* one row per section, saying what that section currently holds rather than
   what it is called, so the rail is a summary and not a table of contents.
   Two shapes: the agency path (Person, Workspaces) and the client path
   (Workspace, Role, Person), picked by AM.kind. */
function amRail(){
 const rows=AM.kind==="client"?[
   {n:1,t:"Workspace",done:amWsPicked(),s:amWsPicked()?amById(AM.wsId).name:"Which workspace they sign in to"},
   {n:2,t:"Role",done:true,s:AM.crole},
   {n:3,t:"Person",done:amPersonOk(),s:amPersonOk()?AM.name:"Email and name"},
  ]:[
   {n:1,t:"Person",   done:amPersonOk(),
    s:amPersonOk()?AM.name:(AM.email||AM.name?"Needs an email and a name":"Email, name and role")},
   {n:2,t:"Workspaces",done:amFilled(),
    s:AM.role!=="Member"?"Every workspace":AM.ws.length?AM.ws.length+" picked":"None picked yet"},
  ];
 return `<nav class="am-rail" aria-label="Sections">${rows.map(r=>
  `<button class="am-rail-i${r.done?" is-done":""}" data-amjump="${r.n}">
   <span class="am-rail-n">${r.done?"&check;":r.n}</span>
   <span style="min-width:0"><span class="am-rail-t">${r.t}</span>
    <span class="am-rail-s trunc">${r.s}</span></span></button>`).join("")}</nav>`;
}
/* the one-line consequence, on both paths, built fresh from the current
   choices every time - never a toggled string, so it can never say something
   the model does not agree with. */
const AM_CLIENT_TAIL={
 "Client Admin":"can do everything there, including spending against the cap",
 "Client Collaborator":"sees everything there; they can reply and connect mailboxes",
 "Client Viewer":"sees everything there and changes nothing",
};
function amPreviewLine(){
 if(AM.kind==="client"){
  if(!amWsPicked()) return "";
  const subject=(AM.email||"").trim()||"This person", w=amById(AM.wsId);
  return `${subject} signs in as a ${AM.crole} of ${w.name} and ${AM_CLIENT_TAIL[AM.crole]}.`;
 }
 const first=(AM.name||"").trim().split(" ")[0]||"They";
 if(AM.role!=="Member") return `${first} will be told: every workspace, as ${AM.role}.`;
 if(!AM.ws.length) return "";
 return `${first} will be told: you can see ${listAnd(AM.ws.map(id=>amById(id).name))}, as a Member.`;
}
/* the footer's one line: exactly what is missing, or the review summary once
   nothing is. Read by both the initial render and amPatchLive's live patch,
   so the two can never say something different about the same state. */
function amFooterLine(){
 if(AM.kind==="client"){
  if(!amWsPicked()) return `<span class="sub">Pick which workspace they sign in to.</span>`;
  if(!amPersonOk()) return `<span class="sub">Enter their email and name to finish.</span>`;
  return `<span class="fsum"><span class="trunc"><strong>${AM.name}</strong> ${AM.email}</span>
    <span class="sep">&middot;</span><span>${AM.crole}</span>
    <span class="sep">&middot;</span><span class="trunc">${amById(AM.wsId).name}</span></span>`;
 }
 if(!amPersonOk()) return `<span class="sub">Enter a work email and a name to begin.</span>`;
 if(!amFilled()) return `<span class="sub">Pick at least one workspace.</span>`;
 return `<span class="fsum"><span class="trunc"><strong>${AM.name}</strong> ${AM.email}</span>
   <span class="sep">&middot;</span><span>${AM.role}</span>
   <span class="sep">&middot;</span><span class="trunc">${AM.role==="Member"?AM.ws.length+" workspace"+(AM.ws.length===1?"":"s"):"Every workspace"}</span></span>`;
}

/* the two writes. Additive on the workspaces: this is also how "Add to
   workspaces" from a person's own page works (see amPersonAddWsGo), so ticking
   new ones there never drops the ones they already had. Both paths land on
   People, on the tab that now has the new row, with a receipt that undoes the
   whole write - deleting an invited person back out, or popping the client
   user back off the workspace's own list. */
function amSendAgency(){
 const addr=AM.email.trim(), wasFix=!!AM.fixGaps, wsNames=AM.ws.map(id=>amById(id).name), whoName=AM.name.trim();
 let key=Object.keys(PEOPLE).filter(k=>PEOPLE[k].email===addr)[0], isNewPerson=!key, prevSnap=null;
 if(!key){ key=(addr.split("@")[0].replace(/[^a-z0-9]/gi,"").toLowerCase())||("p"+Date.now().toString(36).slice(-5));
  while(PEOPLE[key]) key+="x";
  PEOPLE[key]={name:whoName,initials:initials(whoName),role:AM.role,email:addr,ws:AM.role==="Member"?[]:null};
  LASTSEEN[whoName]="never"; INVITED[whoName]=TODAY_STR;
 } else {
  prevSnap={role:PEOPLE[key].role,ws:Array.isArray(PEOPLE[key].ws)?PEOPLE[key].ws.slice():PEOPLE[key].ws};
  PEOPLE[key].role=AM.role;
  PEOPLE[key].ws=AM.role==="Member"?(Array.isArray(PEOPLE[key].ws)?PEOPLE[key].ws:[]):null;
 }
 if(AM.role==="Member") AM.ws.forEach(id=>{if(PEOPLE[key].ws.indexOf(id)<0) PEOPLE[key].ws.push(id)});
 AM=Object.assign({},AM_BLANK);
 PEOPLE_TAB="agency"; PEOPLE_FLASH="p:"+key;
 if(wasFix) receipt("people",listAnd(wsNames)+(wsNames.length===1?" is":" are")+" now covered by "+whoName+".",null,"fixed the coverage gap");
 else if(isNewPerson) receipt("people",`Invite sent to ${addr}.`,
   ()=>{delete PEOPLE[key];delete LASTSEEN[whoName];delete INVITED[whoName];},`invited ${whoName}`);
 else receipt("people",`${whoName} updated.`,
   ()=>{PEOPLE[key].role=prevSnap.role;PEOPLE[key].ws=prevSnap.ws;},`updated ${whoName}`);
 view={name:"people"}; render();
}
function amSendClient(){
 const addr=AM.email.trim(), whoName=AM.name.trim(), c=amById(AM.wsId), role=AM.crole;
 if(!c) return;
 const row=[addr,role,"Invited"];
 c.users.push(row);
 LASTSEEN[addr]="never";
 AM=Object.assign({},AM_BLANK);
 PEOPLE_TAB="clients"; PEOPLE_FLASH="c:"+c.id+"|"+addr;
 receipt("people",`Invite sent to ${addr} as a ${role} of ${c.name}.`,
   ()=>{const i=c.users.indexOf(row); if(i>-1)c.users.splice(i,1);},`invited ${addr} to ${c.name}`);
 view={name:"people"}; render();
}
function amSend(){
 if(!amCanSend()) return;
 if(AM.kind==="client") return amSendClient();
 return amSendAgency();
}

/* ═══ C3 Usage and limits, the client's own view ══════════════════════════════
   09 §C3. The client never sees the pool, other clients, agency totals or margin.
   Every limit message names the agency rather than Saleshandy, because when an
   agency oversubscribes several clients stop at once and all of them escalate to
   us unless the copy says whose limit it was.                                   */
function cUsage(c){
 const daysLeft=CYCLE.days-CYCLE.day;
 let worstK=null,worstP=-1;
 const rows=RK.map(k=>{const R=RES[k],m=compute(k),r=R.rows[c.id],st=rowState(k,c.id,m);
  /* floor, so only a genuinely exhausted allowance ever shows 100% */
  const p=Math.min(100,Math.floor(st.pct*100));
  if(st.room>0&&p>worstP){worstP=p;worstK=k}
  const pending=REQUESTS.find(x=>x.client===c.id&&x.res===k);
  const state=st.room===0?"At your limit":st.pct>=R.warn?"Close to your limit":"Within limit";
  const tone=st.room===0?"bad":st.pct>=R.warn?"warn":"ok";
  const asking=reqForm&&reqForm.client===c.id&&reqForm.res===k;
  const suggested=Math.max(500,Math.round(r.cap*0.5/500)*500);
  return `<tr>
   <td><span style="font-weight:500">${R.label}</span>
     <span class="cs" style="display:block">${st.room===0
       ?"Paused until "+AGENCY.name+" raises it"
       :st.pct>=R.warn?f(st.room)+" left"+(R.nature==="Storage"?"":" this month")
       :R.nature==="Storage"?"No renewal, this is a ceiling":"Renews on 1 October"}</span></td>
   <td class="ar tnum">${f(r.used)}</td>
   <td class="ar tnum">${f(r.cap)}</td>
   <td>${meter(p,tone,state)}</td>
   <td class="ar colact">${pending
     ?`<span class="sub">Asked ${AGE(pending.when)} &middot; <button class="linkbtn quiet" data-reqwithdraw="${pending.id}">Withdraw</button></span>`
     :asking?`<button class="linkbtn quiet" data-reqclose>Cancel</button>`
     :st.pct>=R.warn||st.room===0
       ?`<button class="linkbtn" data-reqopen="${k}">Request more</button>`
       :'<span class="sub">–</span>'}</td></tr>
  ${asking?`<tr class="confirmrow"><td colspan="5"><div class="inlineconfirm" style="flex-direction:column;align-items:stretch">
    <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end">
     <div><label class="fld" for="reqFormAmt">How much more?</label>
      ${numIn(suggested,R.unit,`id="reqFormAmt" style="width:160px"`)}</div>
     <div style="flex:1;min-width:220px"><label class="fld" for="reqFormWhy">Why?</label>
      <input type="text" id="reqFormWhy" placeholder="A sentence is enough" style="width:100%;height:32px;padding:0 10px;border-radius:var(--radius-input);border:1px solid var(--gray-16);font:inherit"></div>
    </div>
    <p class="sub" id="reqFormSay" style="margin:6px 0 0">${AGENCY.name} will see: "${reqQueueLine(c,k,suggested)}"</p>
    <div class="tools" style="margin-top:6px">
     <button class="shd-button shd-button--primary shd-button--sm" data-reqsend="${k}">Send request</button>
     <button class="shd-button shd-button--tertiary shd-button--sm" data-reqclose>Cancel</button>
    </div></div></td></tr>`:""}`}).join("");
 const summary=worstK&&worstP>=90
   ?`${RES[worstK].label} is at ${worstP}% with ${daysLeft} day${daysLeft===1?"":"s"} left.`
   :`You have used ${Math.round(elapsed()*100)}% of this month with ${daysLeft} day${daysLeft===1?"":"s"} left, on pace.`;
 return `<p class="sub" style="margin:0;font-size:13px">${summary}</p><div class="panel">
  <div class="panel-h"><span class="panel-t">What ${AGENCY.name} has allocated to you</span></div>
  <div class="tscroll"><table class="organism" style="min-width:760px">
   <thead><tr><th>Allowance</th><th class="ar">Used</th><th class="ar">Your limit</th>
    <th>Usage</th><th class="colact"></th></tr></thead>
   <tbody>${rows}</tbody></table></div>
  <div class="panel-b" style="border-top:1px solid var(--gray-200)"><span class="sub">
   These are the volumes ${AGENCY.name} set for your workspace. Asking for more sends a request to
   them, not to Saleshandy.</span></div></div>`;
}
/* limits are edited as a draft and applied together. Typing a number used to
   change the pool on the spot, so a slip of the finger reallocated a client
   before the person had finished reading the row. Inputs are formatted text
   with a unit beside them; the number is parsed on change. */
let DRAFT={};
const dkey=(k,id,fld)=>k+"|"+id+"|"+fld;
const dval=(k,id,fld)=>{const d=DRAFT[dkey(k,id,fld)];return d==null?RES[k].rows[id][fld]:d};
const num=v=>Math.max(0,parseInt(String(v==null?"":v).replace(/[^\d]/g,"")||"0",10));
/* 17 Sep: a dash for "no reservation" sits where the number would, under the inputs above it, not under their unit labels */
const noIn=`<span class="numin"><span class="sub" style="display:inline-block;width:172px;text-align:right;padding-right:11px">–</span></span>`;
const numIn=(v,unit,attrs)=>`<span class="numin"><input type="text" inputmode="numeric" value="${f(v)}" ${attrs}><span class="unit">${unit}</span></span>`;
function draftBar(scope){
 const ch=Object.keys(DRAFT).map(x=>{const [k,id,fld]=x.split("|");return {x,k,id,fld,from:RES[k].rows[id][fld],to:DRAFT[x]}})
  .filter(d=>(scope.k?d.k===scope.k:d.id===scope.id)&&d.from!==d.to);
 if(!ch.length) return "";
 const who=d=>scope.k?(d.id==="own"?OWN_WS.name:byId[d.id].name):RES[d.k].label;
 /* 21 Sep 2026, delight pass round 6: the pool-wide bar names its own effect
    before Apply, in the pool's own unit, reading the drafts the same way
    blReceipt reads an applied change so the two never disagree. */
 let live="";
 if(scope.k){

/* ══ the sending estate ══════════════════════════════════════════════════════
   08 §16b was open: nobody in the field documents where a purchased mailbox
   lands or whether it can be reassigned. Decided 11 Sep 2026, Hitesh:

     The agency buys mailboxes in the master workspace and assigns them down to
     a client workspace. When the client leaves, the mailbox comes back to the
     agency and can be given to the next client. A client may also buy its own
     inside its workspace, and those never transfer to the agency, because the
     agency never paid for them.

   That asymmetry is the whole decision, and it is the reason this screen exists
   rather than a paragraph: an agency's first question is what happens to the
   domains and mailboxes it paid for when a client walks. The answer has to be
   visible before they will move their estate onto us.

   It lives in the master workspace because procurement is administration. It is
   deliberately not in the agency's own outreach workspace, which holds only the
   mailboxes the agency sends its own campaigns from.                        */
/* "agency" = purchased by the agency, so it returns to the pool. "client" =
   connected by whoever already owned the inbox, so it goes where they go. */
const mbSrc=m=>m[3]||"agency";
const estateRows=()=>{
 const out=[];
 myClients().forEach(c=>c.mailboxes.forEach(m=>out.push({m,where:c,kind:"client"})));
 OWN_WS.mailboxes.forEach(m=>out.push({m,where:OWN_WS,kind:"own"}));
 UNASSIGNED.forEach(m=>out.push({m,where:null,kind:"pool"}));
 return out;
};
/* the unassigned pool is account-level, so it is one list and not a per-client
   fixture. Reassignment moves a row between this list and a workspace. */
let UNASSIGNED=[["growth@meridian-send.com","Healthy",100,"agency"],
 ["team@meridian-send.com","Healthy",100,"agency"],
 ["hi@mg-outbound.com","Warming",30,"agency"]];
let estFilter="all", estBuy=false, estTab="mailboxes";
/* Decided 12 Sep 2026: a domain is the agency's, like the mailboxes on it, so
   the estate holds it. Clients see the health of their own mailboxes and never
   a domain list. Warm-up is a state on each mailbox wherever it appears, not a
   screen of its own. Domains are derived from the mailboxes; the IPs are the
   account's Inframail fixture. */
const DOM_RANK={Healthy:0,Warming:1,Warning:2,Disconnected:3};
function domainRows(rows){
 const d={};
 rows.forEach(r=>{const dom=r.m[0].split("@")[1]; const o=d[dom]=d[dom]||{dom,n:0,ws:[],worst:"Healthy",src:mbSrc(r.m)};
   o.n++; const w=r.where?r.where.name:"Unassigned"; if(o.ws.indexOf(w)<0)o.ws.push(w);
   if(DOM_RANK[r.m[1]]>DOM_RANK[o.worst])o.worst=r.m[1]});
 return Object.values(d).sort((a,b)=>b.n-a.n);
}

function doMbMove(addr,to){
 const rows=estateRows(), r=rows.find(x=>x.m[0]===addr);
 if(!r) return;
 const m=r.m;
 if(r.where) r.where.mailboxes=r.where.mailboxes.filter(x=>x[0]!==addr);
 else UNASSIGNED=UNASSIGNED.filter(x=>x[0]!==addr);
 if(to==="") UNASSIGNED.push(m);
 else if(byId[to]) byId[to].mailboxes.push(m);
 /* the headline count is the list length, so it has to move too or the screen
    starts disagreeing with itself again */
 [].concat(CLIENTS,[OWN_WS]).forEach(c=>{c.mbx=c.mailboxes.length});
}

/* ═══ Billing & Subscription, with A7 inside it ═══════════════════════════════
   09 §A7 puts client allocation at Settings -> Billing & Subscription -> Client
   allocation, and the reason is that the pooled Account Plan Usage quota already
   lives there. Putting allocation anywhere else splits the mental model of where
   capacity comes from.                                                         */
let billTab="plan", cliTab="all";
/* 18 Sep, delight pass: which Email Accounts row has its charge explained open */
let BL_WHY=null;
/* 18 Sep, delight pass: the receipt after applying limits; mirrors the queue's */
let BLR=null, blrTimer=null;
/* the default column set is the one that fits 1152px of content area at a
   1440px viewport, measured rather than guessed. Budget, Active Sequences and
   Total Prospects are the three the selector adds back.                    */
let cliCols=["mbx","sent","reply","pos","usage","status"];
let colOpen=false, colDraft=null, colQ="";

/* 18 Sep, Hitesh: "this screen will be upgraded version of what we have
   currently in our live product ... add our functionality on top". So the
   shape is the live Billing & Subscription page as walked on my.saleshandy.com:
   a left column of Plan / Add-ons / Credits / Deliverability, the Platform page
   with Plan Details, Account Plan Usage and Lead Finder credits. The agency adds
   one line under each pooled bar (how much of it the workspace limits add up
   to, and what is still free), one group of its own with Client limits & usage,
   and an Email Accounts page with the billing and history that the live page
   lacks. Prices and dates are illustrative. */
const BILL_TABS=[["plan","Platform","Plan"],["email","Email Accounts","Plan"],["crm","CRM","Add-ons"],["dialer","Dialer","Add-ons"],
 ["ai","AI Credits","Credits"],["verify","Email Verification Credits","Credits"],["radar","Inbox Radar","Deliverability"],
 ["alloc","Client limits & usage","Clients"]];
const billLabel=k=>(BILL_TABS.find(t=>t[0]===k)||BILL_TABS[0])[1];
const PLAN={name:"Scale (Monthly)",start:"19 Aug, 2026",next:"1 Oct, 2026",amount:"$249.00",lastAmount:"$249.00",resets:"1 Oct, 2026"};
/* 21 Sep 2026, delight pass round 6: the next invoice in words, once, so Plan
   Details reads as a sentence rather than a bare dollar figure beside a date
   it does not otherwise connect to. */
const planNextLine=()=>{const amt=PLAN.amount.replace(/\.00$/,""), before=(PLAN.lastAmount||PLAN.amount),
  a=parseFloat(PLAN.amount.replace(/[^0-9.]/g,"")), b=parseFloat(before.replace(/[^0-9.]/g,"")),
  cmp=a===b?"same as last month":a>b?"up from "+before.replace(/\.00$/,"")+" last month":"down from "+before.replace(/\.00$/,"")+" last month";
 return amt+" on "+PLAN.next.split(",")[0]+", "+cmp};
const MBX_PRICE=3.5; /* per bought email account per month, illustrative */
const usd=n=>"$"+n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,",");
/* one pooled quota with its agency line underneath. `alloc` is the sum of the
   workspace limits: what could be drawn if every client hit its cap. */
/* 18 Sep, delight pass: who is consuming each pool, drawn under the pool bar in
   the same colours Home's Plan pacing uses, so Billing answers "which client" on
   the spot instead of sending the reader to another screen. Title attributes
   carry the numbers; no legend, the colours are the clients' own. */
function blWsBar(k){
 const R=RES[k], by=fundedWorkspaces().map(c=>({c,u:cRow(k,c.id).used})).filter(x=>x.u>0).sort((a,b)=>b.u-a.u);
 if(!by.length) return "";
 return `<div class="bl-ws" role="img" aria-label="${R.label} used by workspace: ${by.map(x=>x.c.name+" "+f(x.u)).join(", ")}">
   <span class="sbar bl-wsbar">${by.map(x=>`<i style="width:${(x.u/R.pool*100).toFixed(2)}%;background:${x.c.colour}" title="${x.c.name} · ${f(x.u)} ${R.unit}"></i>`).join("")}</span>

     orient   health strip, KPI row, per-client bars, a compact plan card

function searchAll(q){
 const t=q.trim().toLowerCase(); if(t.length<2) return [];
 const out=[];
 myClients().filter(c=>!isPending(c)).forEach(c=>{
  if(c.name.toLowerCase().indexOf(t)>-1||c.company.toLowerCase().indexOf(t)>-1)
    out.push({c,kind:"Client",label:c.name,sub:c.company,mod:"sequences"});
  (PROSPECTS[c.id]||[]).forEach(p=>{if((p.name+" "+p.co+" "+p.email).toLowerCase().indexOf(t)>-1)
    out.push({c,kind:"Prospect",label:p.name,sub:p.title+", "+p.co,mod:"prospects",pid:p.id})});
  seqNames(c).forEach(n=>{if(n.toLowerCase().indexOf(t)>-1)
    out.push({c,kind:"Sequence",label:n,sub:c.name,mod:"sequences"})});
  c.mailboxes.forEach(m=>{if(m[0].toLowerCase().indexOf(t)>-1)
    out.push({c,kind:"Email account",label:m[0],sub:m[1],mod:"accounts"})});
 });
 return out.slice(0,14);

   +'</div></div></div>';
 }
 const sm=compute("sends"), used=sm.used, pool=sm.R.pool, sd=burnDays("sends");

   it can never disagree with what is a scroll away. A backend-connected

   One renderer for every Outreach rail item in the agency workspace. The rule
   it exists to make visible: what you see here is the agency's own, scoped the
   same way a client workspace is scoped. Never an aggregation across clients,
   because a roll-up here would quietly undo the isolation the rest of the
   model depends on. Modules the workspaces feature does not change are stated
   as scoped rather than redrawn.                                          */
/* the rail speaks in short keys, the client shell in module names. One map, so
   a rail click lands on the same thing in either workspace.               */

   Without it, `parked` treats the Templates tab as an un-redrawn module and the

   question. */
const SCOPE_NOTE={
 leads:["A pool at the account, a cap per workspace",
  "The search tool is identical everywhere and needs no scoping. What is scoped is the credit it spends, which comes out of one pool you bought, and the lead record it produces, which belongs to the workspace that revealed it. Two clients can pay to reveal the same person and we will not dedupe it, because deduping means showing one client's records to another."],
 dialer:["Per workspace, and it has no client dimension today",
  "Phone numbers, calls and recordings carry no client field in the product as it stands, which is why a call cannot be attributed to a client at all right now. Under this model each one belongs to the workspace it was made from."],
 verify:["A pool at the account, a cap per workspace",
  "One pooled quota with a ceiling per client, exactly as Lead Finder. The lists themselves belong to the workspace that uploaded them."],
 radar:["Infrastructure at the account, results at the workspace",
  "The seed estate across Gmail, Yahoo and Outlook is bought and maintained once. A placement test, though, tests a specific domain and mailbox, so its result belongs to that workspace. A client can see its own deliverability without seeing your seed estate or any other client's score."],
};

const RAIL2MOD={seq:"sequences",crm:"prospects",inbox:"inbox",mail:"accounts",tmpl:"tmpl"};
/* the client's own view models five screens, so only the rail items that map

 mail:"accounts",analytics:"analytics",usage:"usage",
 task:"task",dialer:"dialer",verify:"verify",tmpl:"tmpl",radar:"radar",warmup:"warmup",refer:"refer"};

 accounts:"Email accounts",analytics:"Reports",usage:"Usage",
 task:"Tasks",dialer:"Dialer",verify:"Email Verifier",tmpl:"Templates",radar:"Inbox Radar",
 warmup:"Email Warm-up",refer:"Refer a Friend"};

 accounts:"email accounts",analytics:"results",usage:"usage"};

/* ═══ agency Unified Inbox ═══════════════════════════════════════════════════

const ubxUnread=r=>!r.replied&&!r.read;

const ubxThreads=()=>{const q=UBX.q.trim().toLowerCase();
 return UBX_ALL.filter(r=>UBX.client==="all"||r.client===UBX.client)
  .filter(r=>UBX.tab==="all"||(UBX.tab==="unread"&&ubxUnread(r)))

const ubxI={search:'<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',

 inboxes:'<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>',
 seq:'<svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>',

 up:'<svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v12M15 5.9 14 10h5.8a2 2 0 0 1 1.9 2.6l-2.3 7A2 2 0 0 1 17.5 21H7V10l4.5-7a2.5 2.5 0 0 1 3.5 2.9z"/></svg>',
 bubbles:'<svg viewBox="0 0 64 64" width="72" height="72" fill="none" aria-hidden="true"><rect x="8" y="14" width="34" height="24" rx="6" fill="#e5e7eb"/><rect x="24" y="28" width="32" height="22" rx="6" fill="#cbd5e1"/><circle cx="34" cy="39" r="2" fill="#fff"/><circle cx="40" cy="39" r="2" fill="#fff"/><circle cx="46" cy="39" r="2" fill="#fff"/><path d="M14 38v8l8-8" fill="#e5e7eb"/></svg>'};
function ubxCard(r){
 const c=ubxClient(r), un=ubxUnread(r), pos=r.positive;
 return `<button class="ubx-th${un?" is-unread":""}" data-ubxopen="${r.id}" aria-current="${UBX.open===r.id}" aria-label="${r.from}, ${c.name}">

    ${r.replied?'<span class="ubx-chip ok">Replied</span>':pos?`<span class="ubx-chip ok">${ubxI.up}Interested</span>`:'<span class="ubx-chip">Not interested</span>'}</span></span></button>`;
}
function ubxListHTML(){
 const th=ubxThreads();
 if(UBX.tab==="scheduled"||UBX.tab==="draft") return `<div class="ubx-none"><p class="empty-t" style="font-size:14px">${UBX.tab==="scheduled"?"Nothing scheduled":"No drafts"}</p>
   <p class="sub" style="margin:6px 0 0">${UBX.tab==="scheduled"?"Replies you schedule from any client's thread wait here.":"A reply you start and leave waits here, filed under its client."}</p></div>`;
 if(!th.length) return `<div class="ubx-none"><p class="empty-t" style="font-size:14px">No threads</p><p class="sub" style="margin:6px 0 0">${UBX.q?"Nothing matches \\u201c"+UBX.q+"\\u201d.":"Nothing waiting in this view."}</p></div>`;
 /* one group per client, busiest first, the agency's own last. Not by unread:
    reading a thread must not reorder the list under the cursor. */
 const ids=[...new Set(th.map(r=>r.client))].sort((a,b)=>(a==="own")-(b==="own")||th.filter(r=>r.client===b).length-th.filter(r=>r.client===a).length||ubxClient({client:a}).name.localeCompare(ubxClient({client:b}).name));
 /* one client picked: its column row already names it, so no group header */
 if(UBX.client!=="all") return th.map(ubxCard).join("");
 return ids.map(id=>{const c=ubxClient({client:id});
  const rows=th.filter(r=>r.client===id).sort((a,b)=>(b.positive?1:0)-(a.positive?1:0));
  const un=rows.filter(ubxUnread).length, ic=rows.filter(r=>r.positive).length;
  /* coordinator feedback, round 6: "N threads" plus unread plus interested
     ran long enough that a longer client name pushed the meta to a second
     line while a shorter one did not, so groups looked inconsistent for no
     reason. The row already shows its own threads; once there is an unread
     or interested count to report, that replaces the plain thread count
     rather than piling on top of it, so the line stays one line. */
  const metaBits=[]; if(un) metaBits.push(`<b style="color:var(--blue-11)">${un} unread</b>`); if(ic) metaBits.push(`${ic} interested`);

   +rows.map(ubxCard).join("")}).join("");

function anTh(col){
 const [key,label,num]=col;
 if(!num) return `<th>${label}</th>`;
 const active=anSortState().col===key;
 return `<th class="ar"><button class="linkbtn" data-ansort="${key}" style="display:inline-flex"><span class="sortable"${active?' style="color:var(--blue-11)"':""}>${label}${sortI}</span></button></th>`;
}
const anTd=(row,col)=>col[2]?`<td class="ar tnum">${f(row[col[0]])}</td>`:`<td>${row[col[0]]}</td>`;
/* the Team tab's rows are per PERSON, and a workspace with two staff on it
   (Owner and Admin both reach everywhere) would otherwise be summed twice -
   once per row that touches it. Its totals are computed straight off the
   workspace set instead (one figure per workspace, never per person), which
   is what "blended" has to mean once more than one person can see the same
   workspace. Workspaces is a per-person count on this tab, not a quantity
   that sums, so its total cell reads "-" rather than a number nobody asked
   for; the label already carries the real N. */
function anTeamTotals(wss){
 return {
  prospects:wss.reduce((t,c)=>t+(c.prospects||0),0),
  contacted:wss.reduce((t,c)=>t+(c.sent||0),0),
  replied:wss.reduce((t,c)=>t+Math.round((c.sent||0)*(c.reply||0)/100),0),
  positive:wss.reduce((t,c)=>t+positives(c),0),
 };
}
function anTotalsRow(cols,rows,N,overrideSums,peopleCount){
 const labels=cols.filter(c=>!c[2]), nums=cols.filter(c=>c[2]);
 const sums=overrideSums||Object.fromEntries(nums.map(c=>[c[0],rows.reduce((t,r)=>t+(r[c[0]]||0),0)]));
 const label=peopleCount==null?`Blended across ${N} workspace${N===1?"":"s"}`
   :`Blended across ${N} workspace${N===1?"":"s"}, ${peopleCount} ${peopleCount===1?"person":"people"}`;
 return `<tr class="an-totals"><td colspan="${labels.length}"><strong>${label}</strong></td>`
  +nums.map(c=>{const v=sums[c[0]]; return `<td class="ar tnum"><strong>${v==null?"–":f(v)}</strong></td>`}).join("")+`</tr>`;
}

  +'</div>'
  +(done>=SETUP_STEPS.length?'<p class="sub" style="margin:14px 0 0;max-width:62ch">Running outreach for someone else? '
    +'Give each client their own workspace: their own sequences, prospects and mailboxes, separate from yours and from each other.</p>':'')
  +'</div></div>';
}

/* ═══ Home, the agency's landing screen ═══════════════════════════════════════
   Rail item 1, and where an agency account lands at login instead of Sequences.
   Zone order is deliberate: what needs a decision, then whether the agency is
   pacing right, then the clients ranked. Two rules hold it together.

   1. Zone 1 carries only what an owner can resolve and an operator cannot, plus
      operator work that has aged past its consequence. Without that rule this
      becomes a second inbox competing with the queue in All clients.
   2. Nothing here is a blended rate across clients. One reply rate across five
      unrelated ICPs is arithmetic, not information, and that is the shape that
      was promised in Mar 2024 and never shipped.                              */

const CYCLE={day:9,days:30,month:"September 2026"};        /* today is 9 Sep 2026 */
const elapsed=()=>CYCLE.day/CYCLE.days;
const PACE_DAYS=3;   /* under this many days of runway, pacing stops being a card */
/* ═══ the agency's card fails ═════════════════════════════════════════════════
   Decided 12 Sep 2026, after the Aug 2025 incident in which an agency's failed
   payment locked its clients out: during the agency's grace period a client
   workspace stays readable, sending pauses, and the client's paused state
   names the agency and never the reason. Reachable with #grace. */
const GRACE={on:false,failedOn:"7 Sep",daysLeft:5};
const canViewAs=c=>true;
const viewAsBtn=(c,cls)=>`<button class="${cls}" data-asclient="${c.id}">View as client</button>`;
const grace=()=>GRACE.on;
const graceBanner=()=>grace()?`<div class="msg m-bad grace" style="margin-bottom:20px">${warnI}<span><strong>Payment failed on ${GRACE.failedOn}.</strong>
  ${GRACE.daysLeft} days to update the card before the account pauses. Your clients keep reading their workspaces; nothing is sending.
  ${canI("billing")?'<button class="linkbtn" data-gobill>Update payment</button>':"An owner updates the card."}</span></div>`:"";
const graceNote=c=>grace()?`<div class="msg m-warn grace" style="margin-bottom:16px">${warnI}<span>Sending is paused by ${AGENCY.name}.
  You can see everything as usual; your sequences resume when they restart them.</span></div>`:"";
/* headroom in days at the burn rate observed so far this cycle */
const burnDays=k=>{const m=compute(k),perDay=m.used/CYCLE.day;
  return perDay>0?m.free/perDay:Infinity};
const runsOut=()=>RK.filter(k=>RES[k].nature!=="Storage")
  .map(k=>({k,d:burnDays(k)})).sort((a,b)=>a.d-b.d)[0];
const onDay=d=>{const n=CYCLE.day+Math.floor(d);
  return n>CYCLE.days?"after the cycle resets":n+" Sep"};
const ageDays=t=>{const m=/(\d+)\s*day/.exec(t||"");if(m)return +m[1];
  return /yesterday/.test(t||"")?1:0};
const myCaps=k=>myClients().reduce((t,c)=>t+((RES[k].rows[c.id]||{cap:0}).cap),0);
const medianCPP=()=>{const v=myClients().map(costPer).filter(x=>x!=null).sort((a,b)=>a-b);
  if(!v.length)return null;const h=v.length>>1;
  return v.length%2?v[h]:(v[h-1]+v[h])/2};

/* what an owner has to decide, ordered by what it costs to leave alone */
function dashItems(){
 const out=[];
 RK.forEach(k=>{const m=compute(k);
  fundedWorkspaces().forEach(c=>{const st=rowState(k,c.id,m);
   if(st.room===0&&!REQUESTS.some(r=>r.client===c.id&&r.res===k))
    out.push({score:90,sev:"critical",client:c.id,raise:k+"|"+c.id,act:"Raise limit",age:"today",
      what:c.name+" is at its "+RES[k].label.toLowerCase()+" limit and has stopped",
      why:f(m.free)+" "+RES[k].unit+" sit unallocated in the pool. Only you can raise this."})})});
 REQUESTS.filter(r=>myClientsForLimits().some(c=>c.id===r.client)).forEach(r=>{const m=compute(r.res);
  out.push({score:80,sev:"decision",client:r.client,req:r.id,act:"Approve",age:r.when,
    what:byId[r.client].name+" asked for "+f(r.amount)+" more "+RES[r.res].label.replace(/^Monthly |^Active /,"").toLowerCase(),
    why:r.note+" Approving leaves "+f(Math.max(0,m.free-r.amount))+" in the pool."})});
 /* operator work escalates here once it has aged. A disconnected mailbox is not
    the owner's job until nobody has done it for two days, at which point it is. */
 INFRA().filter(a=>a.client==="__x"||ageDays(a.age)>=2).forEach(a=>{
  const cross=a.client==="__x", c=cross?null:byId[a.client];
  out.push({score:cross?35:a.sev==="critical"?85:a.kind==="Bounce rate rising"?75:50,sev:a.sev,age:a.age,act:a.act,
    client:c?c.id:null, collision:cross,
    what:cross?a.kind:a.kind+" on "+c.name+", unresolved for "+a.age,
    why:a.kind==="Bounce rate rising"
        ?a.detail+". Every client sending from this domain pool is exposed, not only this one."
      :a.kind==="Email account disconnected"
        ?a.detail+". Volume the client is paying for is not going out."
      :a.detail+"."})});
 /* a link request nobody has approved is stalled onboarding, and only the agency
    can chase it. The client cannot approve something they were never told about. */
 myClients().filter(isPending).forEach(c=>out.push({score:70,sev:"decision",client:c.id,act:"Open",
   age:c.link.requested, what:c.name+" has not approved the workspace link yet",
   why:"Requested "+AGE(c.link.requested)+" from "+c.link.owner+". Nothing moves until they accept, and they may not have seen it."}));
 /* a client going quiet, which is what churn looks like before the email arrives */
 myClients().forEach(c=>{if(c.prev&&c.reply&&c.reply<c.prev*0.75)
  out.push({score:65,sev:"warning",client:c.id,act:"Open",age:"this cycle",
    what:c.name+" reply rate fell from "+c.prev.toFixed(1)+"% to "+c.reply.toFixed(1)+"%",
    why:"Down "+Math.round((1-c.reply/c.prev)*100)+"% this cycle. Nothing in the product will tell them, and nothing will tell you again."})});
 return out.sort((a,b)=>b.score-a.score);
}

/* the reason a client is pinned to the top of zone 3, or null */
/* 21 Sep 2026, delight pass: "At limit" is a moment, not a permanent state, so
   the chip says when it happened. Seeded from the request that asked about
   the same resource, when one exists, since that is the same event; a fresh
   limit with no matching request is dated to today. Session-lived, like
   DECIDED, so a page reload starts the clock over. */
const AT_LIMIT_SINCE={};
function atLimitSince(c,k){
 if(!AT_LIMIT_SINCE[c.id]){const r=REQUESTS.find(x=>x.client===c.id&&x.res===k);
   AT_LIMIT_SINCE[c.id]=r?r.when:"today"}
 return AT_LIMIT_SINCE[c.id]}
function attention(c){
 /* a disabled client outranks everything else that could be said about it.
    Nothing it does matters until it is re-enabled, and the row has to say so
    or the agency thinks sending stopped when it did not. */
 if(c.disabled) return{rank:-1,pin:true,chip:"Disabled",tone:"c-bad",
   why:"Sending is stopped and nothing goes out. Re-enable to start again. Nothing has been lost."};
 const m=medianCPP(), cp=costPer(c);
 const lim=funded(c)?RK.map(k=>({k,st:rowState(k,c.id,compute(k))})).filter(x=>x.st.room===0):[];
 if(lim.length) return{rank:0,pin:true,chip:"At limit since "+atLimitSince(c,lim[0].k),tone:"c-bad",
   why:RES[lim[0].k].label+" is exhausted. Sending and sourcing stop until you raise it."};
 /* a quarter down and at least a point down. Without the floor a move from
    1.2 to 0.8 flags, and at forty clients a third of the book is "Falling". */
 if(c.prev&&c.reply&&c.reply<c.prev*0.75&&c.prev-c.reply>=1) return{rank:1,pin:true,chip:"Falling",tone:"c-warn",
   why:"Reply rate down from "+c.prev.toFixed(1)+"% last cycle. Worth a call before they ask for one."};
 if(cp!=null&&m&&cp>m*2) return canI("billing")
   ?{rank:2,pin:true,chip:"Costly",tone:"c-warn",
     why:"Costs "+(cp/m).toFixed(1)+"x the median per positive reply. Priced right, or served wrong?"}
   :{rank:2,pin:true,chip:"Low yield",tone:"c-warn",
     why:f(positives(c))+" positive replies from "+f(c.sent)+" sent."};
 /* a brand new client is a lifecycle state, not a decision, so it carries a chip
    but does not jump the queue above a client that is actually running */
 if(c.sent===0) return{rank:9,pin:false,chip:"Not started",tone:"c-mute",
   why:(4-doneN(c))+" of 4 setup steps remain, so nothing has been sent for them yet."};
 return null;
}

/* ═══ A0 Home, the agency's landing screen ═══════════════════════════════════
   Card grid, not stacked tables. Layout follows the references Hitesh supplied:
   a KPI row with the delta chip top-right and an explicit "Compare N (last
   month)" line, a chart card with a legend and a highlighted point, a table card
   with counted tab pills, and a right rail of priority items with "See all".

   Styling stays inside the Saleshandy design system: Blue 700, Inter, 4px radius,
   12px/600 #4B5563 headers, 32px controls. The richness comes from layout and
   charts, not from inventing a rounder, softer visual language.

   The one rule that did not change: no blended rate across unrelated clients.
   Counts, money, pacing and per-client comparisons are all legitimate as tiles
   and charts, so adopting the card form costs nothing. There is still no single
   reply rate on this screen.                                                    */

/* last cycle, for the comparison line on each tile */
let LAST={clients:4, sent:98400, touches:133400, replies:6900};
const DASH_ROWS=8;   /* the dashboard ranks; the full list lives in Clients */
/* cumulative daily sends, days 1..9 of the cycle, summing to the 124,600 in RES */
const DAILY=[4200,6800,9500,12800,15600,17200,18400,19100,21000];

const myUsed=kk=>myClients().reduce((t,c)=>t+((RES[kk].rows[c.id]||{used:0}).used),0);
const abbr=n=>n>=1000?(n/1000).toFixed(n%1000&&n<10000?1:0).replace(/\.0$/,"")+"k":String(n);
/* ── outreach: volume across every channel, not just email ─────────────────
   A step in the product can be Email, LinkedIn (manual or automation), Call,
   WhatsApp or Task, so a column or a tile named after one channel undercounts a
   LinkedIn-led or call-led client and reads as if the agency did nothing.
   Email is c.sent rather than the sends pool, so the per-client column and the
   tile add up to the same number. A linked client on its own plan consumes no
   pool but its outreach is still real, and the pool is the plan chart's job. */
const chanOf=c=>CHAN[c.id]||{li:0,call:0,wa:0};
const outreachOf=c=>{const x=chanOf(c);return c.sent+x.li+x.call+x.wa};
const chanRow=c=>{const x=chanOf(c);
 return [[c.sent,"email"],[x.li,"LinkedIn"],[x.call,"call"],[x.wa,"WhatsApp"]].filter(y=>y[0]>0)};
const chanTitle=c=>chanRow(c).map(y=>f(y[0])+" "+y[1]).join(", ")||"Nothing sent yet";
const repOf=c=>Math.round(c.sent*c.reply/100);
const touches=()=>{
 const t=myClients().reduce((a,c)=>{const x=chanOf(c);
   return {email:a.email+c.sent,li:a.li+x.li,call:a.call+x.call,wa:a.wa+x.wa}},
   {email:0,li:0,call:0,wa:0});
 t.total=t.email+t.li+t.call+t.wa; return t};
const touchSplit=t=>[[t.email,"email"],[t.li,"LinkedIn"],[t.call,"call"],[t.wa,"WhatsApp"]]
  .filter(x=>x[0]>0).map(x=>abbr(x[0])+" "+x[1]).join(" · ") || "Nothing sent yet";
const CHAN_COL={email:"var(--blue-11)",LinkedIn:"#0F766E",call:"var(--orange-14)",WhatsApp:"var(--green-16)"};
const touchBar=t=>{const p=[[t.email,"email"],[t.li,"LinkedIn"],[t.call,"call"],[t.wa,"WhatsApp"]].filter(x=>x[0]>0);
 if(!p.length) return "Nothing sent yet";
 const tot=p.reduce((a,b)=>a+b[0],0)||1;
 return '<span class="sbar">'+p.map(x=>'<i style="width:'+(x[0]/tot*100).toFixed(1)
    +'%;background:'+CHAN_COL[x[1]]+'" title="'+x[1]+' '+f(x[0])+'"></i>').join("")+'</span>'
  +'<span class="lgd">'+p.map(x=>'<span><i style="background:'+CHAN_COL[x[1]]+'"></i>'+x[1]+'</span>').join("")+'</span>'};
const pctDelta=(now,then)=>then?((now-then)/then*100):null;
function deltaChip(d,invert,abs){
 if(d===null||!isFinite(d)) return "";
 const up=d>=0, good=invert?!up:up;
 const col=good?"var(--green-700)":"var(--red-600)";
 const bg=good?"var(--green-50)":"var(--red-50)";
 const arrow=up?"M6 3.5 9.5 8h-7z":"M6 8.5 2.5 4h7z";
 const txt=abs!==undefined?(up?"+":"")+abs:(up?"+":"")+d.toFixed(d>=10||d<=-10?0:1)+"%";
 return '<span class="dchip" style="color:'+col+';background:'+bg+'">'
  +'<svg viewBox="0 0 12 12" aria-hidden="true"><path fill="currentColor" d="'+arrow+'"/></svg>'
  +txt+'</span>'}

/* No icon. An icon here was decoration competing with the delta chip for the
   same corner, and it left the card ragged. The subheading instead gets its own
   band: a rule, a tint, the full card width. It is the half of the card that
   carries the comparison and the channel mix, so it stops being a third grey
   line under the number. The band is pushed to the bottom so that cards of
   different content height still line their footers up across the row. */
/* the grouped Home card: one container, three identical tiles, and the channel
   mix as a strip across the base rather than inside the Outreach tile. Putting
   the breakdown in a tile made that tile heavier than its neighbours, which is
   the whole reason the row read as three unrelated components. The tiles keep a
   "was N" line so the baseline survives the loss of the per-card bar. */
function kpiTile(label,icon,value,delta,base,invert,abs){
 return '<div class="ktile">'
  +'<div class="ktile-h"><span class="ktico">'+icon+'</span><span class="ktl">'+label+'</span></div>'
  +'<div class="ktile-v"><span class="ktv">'+value+'</span>'+(delta===null?"":deltaChip(delta,invert,abs))+'</div>'
  +'<div class="ktile-b">'+base+'</div></div>'}
function kpiGroup(title,tiles,footLabel,foot){
 return '<div class="card kgrp">'
  +'<div class="kgrp-h"><span class="kgrp-t">'+title+'</span></div>'
  +'<div class="kgrp-b"><div class="ktiles">'+tiles+'</div></div>'
  +(foot?'<div class="kgrp-f"><span class="kgrp-fl">'+footLabel+'</span>'+foot+'</div>':"")
  +'</div>'}

function kpi(label,value,delta,compare,invert,abs){
 return '<div class="card kpi">'
  +'<div class="kpi-t"><span class="kpi-l">'+label+'</span>'+(delta===null?"":deltaChip(delta,invert,abs))+'</div>'
  +'<div class="kpi-v">'+value+'</div>'
  +'<div class="kpi-c">'+compare+'</div></div>'}

/* ── cumulative sends against the straight-line plan budget ─────────────────── */
function planChart(compact,H0){
 const R=RES.sends, pool=R.pool, W=640, H=H0||(compact?150:196), L=46, T=22, B=34, Rr=14;
 const px=d=>L+(d-1)/(CYCLE.days-1)*(W-L-Rr);
 const py=v=>H-B-(v/pool)*(H-T-B);
 let run=0; const pts=DAILY.map((v,i)=>{run+=v;return[px(i+1),py(run),run,i+1]});
 const last=pts[pts.length-1];
 const line=pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
 const area="M"+px(1).toFixed(1)+","+py(0).toFixed(1)+" L"+line.replace(/ /g," L")
   +" L"+last[0].toFixed(1)+","+py(0).toFixed(1)+" Z";
 const grid=[0,1/3,2/3,1].map(fr=>{const y=py(pool*fr);
   return '<line x1="'+L+'" x2="'+(W-Rr)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="var(--line-soft)"/>'
    +'<text x="'+(L-8)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end" class="ax">'+(fr?abbr(pool*fr):"0")+'</text>'}).join("");
 const xlab=[1,8,15,22,30].map(d=>'<text x="'+px(d).toFixed(1)+'" y="'+(H-12)+'" text-anchor="middle" class="ax">'+d+' Sep</text>').join("");
 /* callout on the last real day, the reference puts the value in a chip on the line */
 const cw=64, cx=Math.min(W-Rr-cw, last[0]-cw/2), cy=last[1]-30;
 return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMinYMid meet" class="chart" role="img" aria-label="Cumulative emails sent against plan pace">'
  +'<defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">'
   +'<stop offset="0" stop-color="#1D4ED8" stop-opacity=".18"/>'
   +'<stop offset="1" stop-color="#1D4ED8" stop-opacity="0"/></linearGradient></defs>'
  +grid+xlab
  +'<path d="'+area+'" fill="url(#ag)"/>'
  +'<line x1="'+px(1)+'" y1="'+py(pool/CYCLE.days)+'" x2="'+px(CYCLE.days)+'" y2="'+py(pool)+'" '
   +'stroke="var(--gray-400)" stroke-width="1.5" stroke-dasharray="5 4"/>'
  +'<polyline points="'+line+'" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linejoin="round"/>'
  +'<line x1="'+last[0].toFixed(1)+'" y1="'+T+'" x2="'+last[0].toFixed(1)+'" y2="'+py(0)+'" stroke="var(--gray-300)" stroke-dasharray="3 3"/>'
  +'<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="4.5" fill="#1D4ED8" stroke="#fff" stroke-width="2"/>'
  +'<rect x="'+cx.toFixed(1)+'" y="'+cy.toFixed(1)+'" width="'+cw+'" height="20" rx="3" fill="var(--gray-800)"/>'
  +'<text x="'+(cx+cw/2).toFixed(1)+'" y="'+(cy+14).toFixed(1)+'" text-anchor="middle" class="cal">'+f(last[2])+'</text>'
  +'</svg>'}

/* ── radial gauge, the "Repeat Customer Rate" pattern from the reference ────── */
function gauge(pct,big,sub){
 const W=210,H=126,cx=W/2,cy=H-14,r=76,N=44;
 const on=Math.round(N*Math.min(1,pct/100));
 let t="";
 for(let i=0;i<N;i++){
  const a=Math.PI-(i/(N-1))*Math.PI, x1=cx+Math.cos(a)*(r-13), y1=cy-Math.sin(a)*(r-13);
  const x2=cx+Math.cos(a)*r, y2=cy-Math.sin(a)*r;
  const c=i<on?(pct>=90?"#DC2626":pct>=75?"#D97706":"#1D4ED8"):"var(--gray-200)";
  t+='<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)
   +'" stroke="'+c+'" stroke-width="3" stroke-linecap="round"/>'}
 return '<svg viewBox="0 0 '+W+' '+H+'" class="gauge" role="img" aria-label="'+big+' '+sub+'">'+t
  +'<text x="'+cx+'" y="'+(cy-16)+'" text-anchor="middle" class="gv">'+big+'</text>'
  +'<text x="'+cx+'" y="'+(cy+2)+'" text-anchor="middle" class="gs">'+sub+'</text></svg>'}

/* ── labelled coloured bars, the nested "Customers" card pattern ───────────── */
function segbars(rows){
 return '<div class="segs">'+rows.map(r=>'<div class="seg">'

   +'<span class="seg-l">'+r.l+'</span><span class="seg-v tnum">'+r.v+'</span></div>'
  +'<div class="seg-b"><span style="width:'+Math.min(100,r.p).toFixed(0)+'%;background:'+r.c+'"></span></div>'
  +'</div>').join("")+'</div>'}

/* ── horizontal comparison, per client. Never a blend ──────────────────────── */
function byClient(){
 const rows=[...myClients()].sort((a,b)=>positives(b)-positives(a));

 return rows.map(c=>{const v=positives(c);
  return '<div class="hb"><span class="hb-l">'+c.name+'</span>'
   +'<span class="hb-t"><span style="width:'+(v/max*100).toFixed(0)+'%;background:'+c.colour+'"></span></span>'
   +'<span class="hb-v tnum">'+(v?f(v):"0")+'</span></div>'}).join("")}

/* ── the right rail: priority items with a progress ring and See all ───────── */
function ring(done,total,tone){
 const r=9,c=2*Math.PI*r,p=total?done/total:0;
 return '<svg viewBox="0 0 24 24" class="ring" aria-hidden="true">'

  +' stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+(c*(1-p)).toFixed(1)+'" transform="rotate(-90 12 12)"/></svg>'}

}

function drawerHTML(){

 const b1=`<span class="nc-eyebrow">This creates</span>${ncPreviewHTML()}

 const whoL=(nc.company||nc.name||"this client").trim();
 const limRow=k=>{const R=RES[k],m=compute(k),

/* 18 Sep, delight pass: a new client's default limit is a share that leaves
   room, never the whole free pool: floor(free / max(2, clients + 1)), rounded
   down to 500, at least 500. With no clients the newcomer gets half. One
   function, so the row, the sentence and create() can not disagree. */
const ncDefaultCap=k=>{const m=compute(k);
 return Math.max(500,Math.floor(m.free/Math.max(2,CLIENTS.length+1)/500)*500)};
/* 18 Sep, delight pass: the Limits step says in one sentence what the numbers
   mean for this client and for everyone else, and rewrites as they are typed.
   Reads the inputs when they are on screen, so it never lags the field. */
function ncLimSentence(){
 const who=(nc.company||nc.name||"this client").trim(), box=el("ncCapsBox");
 const capOf=k=>{const i=box&&box.querySelector('[data-cap="'+k+'"]');
   if(i) return num(i.value);
   if(nc.caps&&nc.caps[k]!=null) return nc.caps[k];
   const m=compute(k); return ncDefaultCap(k)};
 const sm=compute("sends"), cap=capOf("sends"), over=cap>sm.free;
 if(!nc.bif){
  return over
   ?`<b>${who}</b> can send up to <b class="tnum">${f(cap)}</b> emails this cycle, <span style="color:var(--orange-12)">more than the ${f(sm.free)} free today</span>, so they would hit the pool before the cap and nothing would stay free for another client.`
   :`<b>${who}</b> can send up to <b class="tnum">${f(cap)}</b> emails this cycle, leaving <b class="tnum">${f(sm.free-cap)}</b> of the ${f(sm.free)} free today for everyone else.`;
 }
 const held=[["lead_finder","Lead Finder"],["verification","verification"],["ai","AI"]].map(([k,l])=>{const m=compute(k),c=capOf(k);return {l,left:m.free-c,free:m.free,c}});
 const short=held.filter(h=>h.left<0);
 if(short.length) return `Emails stay a cap: <b>${who}</b> can send up to <b class="tnum">${f(cap)}</b>. <span style="color:var(--orange-12)">The ${short.map(h=>h.l).join(" and ")} hold${short.length>1?"s exceed":" exceeds"} what is free today (${short.map(h=>f(h.c)+" against "+f(h.free)).join(", ")}).</span>`;
 return `Emails stay a cap: <b>${who}</b> can send up to <b class="tnum">${f(cap)}</b>. The credits are held for them; <b class="tnum">${f(held[0].left)}</b> Lead Finder, <b class="tnum">${f(held[1].left)}</b> verification and <b class="tnum">${f(held[2].left)}</b> AI credits stay in the shared pool for everyone else.`;
}
/* 23 Sep 2026: what used to say what the toggles meant now says what the role

}

    will get" sentence, so the whole drawer repaints rather than one paragraph. */
 {const r=el("ncrole");if(r)r.onchange=()=>{cap();renderDrawer()}}

    repainted, so the field keeps focus and the caret */
 {const a=el("ncn");if(a)a.oninput=()=>{nc.name=a.value;paintPrev()}}
 /* the swatch cycles CLIENT_PAL on click; bound here for the first paint,

 /* the email field keeps focus and its caret; nc.email is captured on input
    rather than waiting for cap() to run on the next step. */
 /* the email typed here is also who ncAccessSentence names as the subject;
    only that one paragraph repaints, so the field keeps its caret */
 {const e=el("nce");if(e)e.oninput=()=>{nc.email=e.value;const p=el("ncAccSay");if(p)p.innerHTML=ncAccessSentence()}}
 /* the reserve switch changes what the column means, so the step repaints */
 {const r=el("ncBifRow");if(r)r.querySelector(".sw").onclick=()=>{cap();nc.bif=!nc.bif;renderDrawer()}}
 /* the sentence follows every keystroke; only it repaints, so the field keeps its caret */
 L.querySelectorAll("[data-cap]").forEach(i=>i.oninput=()=>{const p=el("ncLimSay");if(p)p.innerHTML=ncLimSentence()});
 el("scrim").onclick=()=>{drawer=null;nc=NC_INIT();renderDrawer()};
 el("drX").onclick=()=>{drawer=null;nc=NC_INIT();renderDrawer()};
 /* Skip always finishes now, on any step. 16 §4: "Create is live from step 1."
    Next is the only way to keep refining; Skip is the one-click way out at any point,
    and whatever was not visited gets the same default the drawer would have shown. */
 const n=el("drNext");if(n)n.onclick=()=>{cap();drawer.step++;if(drawer.step===2)nc.reachedStep3=true;renderDrawer()};
 const bk=el("drBack");if(bk)bk.onclick=()=>{cap();drawer.step--;renderDrawer()};

function create(){

    the same colour as the account it belongs to, which is the one pair that has
    to be told apart at a glance. */
 const pal=CLIENT_PAL;
 /* whatever step 2 actually held, whether the user visited it or not. A
    skipped step still gets the same default the drawer itself showed, not a
    flat placeholder, because "16 §4: a half-configured workspace is a visible
    state, not a trap" only holds if the numbers it shows are real. Owner and
    Admin reach every new workspace automatically (their ws is null), so
    there is no staff step here any more: an agency person is added to this
    workspace from the record's own Members tab, once it exists. */
 const c={id,name,company:nc.company||name,email:nc.email||"–",colour:nc.colour||pal[CLIENTS.length%pal.length],
  seq:0,mbx:0,prospects:0,sent:0,reply:0,pos:0,created:"09 Sep, 2026",
  users:nc.email?[[nc.email,nc.role]]:[],mailboxes:[],limitsReviewed:nc.reachedStep3};
 CLIENTS.push(c);byId[id]=c;
 if(nc.email) LASTSEEN[nc.email]="never";
 RK.forEach(k=>{const m=compute(k);
  const cap=(nc.caps&&nc.caps[k]!=null)?nc.caps[k]:ncDefaultCap(k);
  RES[k].rows[id]={res:nc.bif?cap:0,cap,used:0}});
 nc=NC_INIT();
 drawer=null;renderDrawer();
 /* Version C: the first client is the moment the account becomes a workspace
    model, so it always went to Home to watch it happen rather than to the
    record of the client just made. 21 Sep 2026, delight pass round 5: every
    client after the first now gets the same landing, not the record page,
    because a client cannot open its own record and never could - it opens
    its workspace. The handover beat is what makes "we just left the wizard
    for something new" true a second time and every time after. */
 startHandover(c);
}




/* an operator can read what the account decided about a client they work on;
   only changing it is the owner's or admin's. A denied panel where a table
   should be reads as broken, not as scoped. Controls are disabled in place. */
function readOnly(html,what){
 const note=`<div class="msg m-info" style="margin-bottom:16px">${infoI}<span><strong>Read only.</strong> ${ME().name} is ${/^[aeiou]/i.test(ME().role)?"an":"a"} ${ME().role.toLowerCase()} on this client and cannot ${what}. An owner or admin can.</span></div>`;

  .replace(/<button class="sw"(?![^>]*\bdisabled\b)/g,'<button class="sw" disabled')
  .replace(/<(input|select) (?![^>]*\bdisabled\b)/g,'<$1 disabled ')
  /* rMembers already omits every edit control when canI("members") is false,

  .replace(/<button class="linkbtn"(?![^>]*\bdisabled\b)([^>]*\bdata-staffremove\b)/g,'<button class="linkbtn" disabled$1')
  .replace(/<button class="shd-button([^"]*)"(?![^>]*\bdisabled\b)/g,'<button class="shd-button$1" disabled');
}

const WARMUP_TONE={Warming:"info",Paused:"warn","Not started":"mute"};

const warmupKey=(cid,email)=>cid+"|"+email;

 }

/* Reports for the client: four numbers and fourteen days. Daily sends are
   derived from the workspace's cycle total the same way the mailbox counts are,
   so the chart agrees with the tiles and the tiles agree with the client list.
   Meetings are a fixture ratio on positive replies; the product records them as
   an outcome, this prototype does not carry per-thread outcomes. */
const MEETING_RATE=0.42;
const meetings=c=>Math.round(positives(c)*MEETING_RATE);
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function dailySeries(c,n){
 const perDay=c.sent/Math.max(1,CYCLE.day), out=[];
 for(let i=0;i<n;i++){
  const d=new Date(2026,8,CYCLE.day-(n-1-i)), dow=d.getDay();
  const h=((c.id.charCodeAt(0)*31+c.id.charCodeAt(1)*17+i*13)%23)/23;   /* deterministic jitter */
  const wk=(dow===0||dow===6)?0.12:1;
  const sent=Math.round(perDay*wk*(0.8+0.4*h));
  const rep=Math.round(sent*c.reply/100*(0.7+0.6*((h*7)%1)));
  out.push({d,sent,rep});
 }
 return out;
}
function reportChart(c){
 /* 17 Sep 2026, round 2: a 640-wide viewBox scaled to a 1300px panel made this
    chart 480px tall. Drawn wide it keeps its shape at about 200px. */
 const S=dailySeries(c,14), W=1300,H=190,L=46,T=14,B=28,Rr=46;
 const maxS=Math.max(1,...S.map(x=>x.sent)), maxR=Math.max(1,...S.map(x=>x.rep));
 const iw=(W-L-Rr)/S.length, bw=Math.min(22,iw*.55);
 const py=v=>T+(H-T-B)*(1-v/maxS), pr=v=>T+(H-T-B)*(1-v/maxR), px=i=>L+iw*i+iw/2;
 const grid=[0,.5,1].map(fr=>{const y=py(maxS*fr);
   return '<line x1="'+L+'" x2="'+(W-Rr)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="var(--line-soft)"/>'
    +'<text x="'+(L-8)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end" class="ax">'+(fr?abbr(Math.round(maxS*fr)):"0")+'</text>'
    +'<text x="'+(W-Rr+8)+'" y="'+(y+4).toFixed(1)+'" text-anchor="start" class="ax">'+(fr?Math.round(maxR*fr):"0")+'</text>'}).join("");
 const bars=S.map((x,i)=>'<rect class="bar-sent" x="'+(px(i)-bw/2).toFixed(1)+'" y="'+py(x.sent).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+(py(0)-py(x.sent)).toFixed(1)+'" rx="2" fill="var(--blue-11)" fill-opacity=".85"><title>'+x.d.getDate()+' '+MON[x.d.getMonth()]+': '+f(x.sent)+' sent</title></rect>').join("");
 const pts=S.map((x,i)=>px(i).toFixed(1)+","+pr(x.rep).toFixed(1)).join(" ");
 const dots=S.map((x,i)=>'<circle class="dot-rep" cx="'+px(i).toFixed(1)+'" cy="'+pr(x.rep).toFixed(1)+'" r="3" fill="var(--green-14)" stroke="#fff" stroke-width="1.5"><title>'+x.d.getDate()+' '+MON[x.d.getMonth()]+': '+x.rep+' replies</title></circle>').join("");
 const xlab=S.map((x,i)=>i%3===1?'<text x="'+px(i).toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle" class="ax">'+x.d.getDate()+' '+MON[x.d.getMonth()]+'</text>':"").join("");
 return '<svg viewBox="0 0 '+W+' '+H+'" class="chart" role="img" aria-label="Emails sent and replies per day, last 14 days">'
  +grid+xlab+bars+'<polyline points="'+pts+'" fill="none" stroke="var(--green-14)" stroke-width="2" stroke-linejoin="round"/>'+dots+'</svg>';
}
const chartLegend=()=>`<span class="c-a" style="display:flex;gap:14px;font-size:12px;color:var(--gray-12)">
     <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--blue-11);vertical-align:-1px;margin-right:6px"></span>Sent</span>

 const mbx=(c.mailboxes.find(m=>m[1]==="Healthy")||c.mailboxes[0]||["their mailbox"])[0];
 const seqName=(c.sequences&&c.sequences[0]&&c.sequences[0].name)||"their sequence";
 const list=REPLIES.filter(x=>!x.replied&&x.id!==r.id&&myClientsFor("inbox").some(k=>k.id===x.client));
 const next=list[0];
 const first=r.from.split(/[ ,]/)[0];
 return `<aside class="thread" role="dialog" aria-label="Reply to ${r.from}">
  <div class="thread-h"><div class="cell-main">${av(c,28)}<span style="min-width:0">
    <span class="semibold-3" style="display:block">${r.from}</span>

   <button class="ubtn" data-threadclose aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="thread-b">
   <div class="tmsg tmsg-out"><span class="cs">${AGENCY.name} for ${c.name} &middot; ${seqName}, step 2 &middot; 3 days ago</span>

   <div class="tmsg tmsg-in"><span class="cs">${r.from} &middot; ${AGE(r.age)}</span><p>${r.snippet}.</p>
    ${r.positive?'<span class="chip c-ok">Interested</span>':'<span class="chip c-mute">Reply</span>'}</div>
   ${r.replied?`<div class="tmsg tmsg-out is-sent"><span class="cs">You, for ${c.name} &middot; just now</span><p>${r.replied}</p></div>`:""}
  </div>
  <div class="thread-f">
   ${r.replied
     ?`<div class="msg m-ok" style="margin:0 0 12px">${infoI}<span>Sent from <strong>${mbx}</strong> and stored in <strong>${c.name}</strong>'s workspace. You never left this list.</span></div>`
     :`<textarea id="threadTxt" aria-label="Your reply" placeholder="Reply as ${c.name}, from ${mbx}">Thanks ${first}, </textarea>`}
   <div class="tools" style="justify-content:space-between;flex-wrap:wrap;gap:10px">

/* ═══ scale: the forty-client state ═══════════════════════════════════════════
   30 §1.4: "show scale, or state the ceiling". Seven clients is a demo; the
   agencies this is for run twenty to sixty. `scaleTo(40)` appends synthetic
   clients built the same way as the fixtures (mailboxes derived from sends,
   sequences summing to the headline totals, a limit row per resource), so
   every list, table, popover and roll-up can be rendered at the size it will
   actually be used at. Reachable with #scale=40. Nothing else changes. */
const SCALE={n:0};
const SCALE_NAMES=["Ashgrove Dental","Beacon Freight","Cobalt Works","Dunmore Capital","Elmstead Clinics","Fairhaven Legal",
 "Granite Peak Software","Halcyon Robotics","Ironbridge Steel","Juniper Analytics","Kestrel Aviation","Larkspur Media",
 "Marlow Property","Nimbus Cloud","Oakridge Schools","Pennant Insurance","Quarry Lane Foods","Rosewood Care",
 "Saltmarsh Energy","Tamar Logistics","Umber Studios","Verity Payments","Westbrook Motors","Xenon Labs","Yarrow Health",
 "Zephyr Travel","Alder Consulting","Brackenfield Farms","Corwen Textiles","Dovetail Furniture","Ember Security",
 "Fenwick Books","Glasswater Marine","Hollins Recruitment","Isley Architects","Jarrow Tools","Kelso Optics"];
function scaleTo(n){
 const r=rng("scale");
 const pal=["#B45309","#0F766E","#C2410C","#6D28D9","#0E7490","#9333EA","#4B5563","#BE185D","#1D4ED8","#047857","#B91C1C","#7C3AED"];
 let i=0;
 while(CLIENTS.length<n&&i<SCALE_NAMES.length){
  const name=SCALE_NAMES[i++], id="s"+String(i).padStart(2,"0");
  if(byId[id]) continue;
  const slug=name.toLowerCase().replace(/[^a-z]+/g,"-").replace(/^-|-$/g,"");
  const sent=Math.round((1500+r()*14000)/100)*100, seq=1+Math.floor(r()*6);
  /* six fixed roles, 23 Sep 2026: weighted toward Client Collaborator, the way
     Limited Access used to be the common case, with Client Admin the other
     common one and Client Viewer the rarer reports-only case. */
  const role=r()<.15?"Client Viewer":r()<.55?"Client Collaborator":"Client Admin";
  const c={id,name,company:name+" Ltd",email:"hello@"+slug+".com",colour:pal[i%pal.length],
   seq,mbx:Math.max(2,Math.round(sent/CYCLE.day/85)),prospects:Math.round(sent*0.2/10)*10,sent,
   reply:0,prev:0,pos:+(0.5+r()*3).toFixed(1),
   created:(1+Math.floor(r()*28))+" Aug, 2026",limitsReviewed:r()<.8,
   users:[["hello@"+slug+".com",role]],mailboxes:[],synthetic:true};
  /* last cycle's rate moves with this cycle's, as it does in life; independent
     draws made half the book "Falling" and the flag meaningless */
  c.reply=+(2+r()*7).toFixed(1); c.prev=+(c.reply*(0.7+0.8*r())).toFixed(1);
  SEND_DOMAINS[id]=[slug+".com",slug+"-go.com",slug+"-reach.com"]; SEQ_SETS[id]=[];
  RK.forEach(k=>{const cap=k==="sends"?Math.round(sent*1.2/500)*500
    :k==="prospects"?Math.round(c.prospects*1.3/500)*500:500*(1+Math.floor(r()*4));
    RES[k].rows[id]={res:0,cap,used:Math.min(cap,Math.round(cap*(0.2+r()*0.75)))}});
  growMailboxes(c); growSequences(c);
  CLIENTS.push(c); byId[id]=c;
  /* Priya is an Admin: ws is already null, reaching this workspace like every
     other one automatically. Sam is a Member and needs adding explicitly. */
  if(r()<.25&&Array.isArray(PEOPLE.sam.ws)&&PEOPLE.sam.ws.indexOf(id)<0){PEOPLE.sam.ws.push(id)}
 }
 LAST.clients=Math.max(LAST.clients,CLIENTS.length-2);
 SCALE.n=CLIENTS.length;
}

/* Deep links, so any screen can be opened and checked without clicking a path
   to it: #clients, #queue, #dash, #credits, #settings, #invite, #solo-plain
   for an ordinary account with no agency relationship, and #client=<id> for
   a client record. Unknown hashes are ignored.                             */
if(location.hash==="#solo-plain"){const c=byId.solo;
  if(c){solo=true;ctx=c.id;asClient=false;soloMod="seq"}}
if(location.hash==="#migration"){MIG.deferred=false;MIG.reviewed=false;view={name:"m1"}}
{const h=decodeURIComponent(location.hash.replace(/^#/,""));
 const [k,v]=h.split("=");
 if(k==="scale"){scaleTo(+v||40);view={name:"dash"}}
 if(k==="grace"){GRACE.on=true;view={name:"dash"}}
 const flat=Object.assign({clients:1,queue:1,dash:1,credits:1,settings:1,invite:1},
   Object.fromEntries(Object.keys(MASTER_MOD).map(x=>[x,1])));
 if(flat[k]&&(k!=="dash"||canI("dashboard"))) view={name:k};
 /* fix 25 Sep review #13/#21: #settings is a flat route (line above), so it
    left ctx untouched and rendered vSettings() with ctx still "agency" - the
    one deep link that could land on the admin panel's own Settings, which
    D13 ended ("no Settings on the admin panel; every setting lives in a
    workspace, including the agency's own"). Routed into the agency's own
    workspace like #seq/#crm below, so #settings opens the real, correctly
    scoped screen instead of a state the rail itself no longer links to. */
 if(k==="settings"){ctx="own";asClient=false}
 /* #seq, #crm, #leads and the rest used to mean "the agency's own X" inside the
    master workspace. They still mean that; the workspace is just a real one now. */
 if(AGY_MOD[k]&&!MASTER_MOD[k]&&k!=="analytics"){ctx="own";asClient=false;inMod=RAIL2MOD[k]||k;view={name:"clients"}}
 /* the agency-wide screens: #analytics is the cross-workspace report, #api is
    the agency's own API & Integrations section. Neither is a workspace module. */
 if(k==="analytics"){ctx="agency";asClient=false;view={name:"analytics"}}
 if(k==="api"){ctx="agency";asClient=false;view={name:"apiint"}}
 /* People, a person (agency key, or a client user's "c:<clientId>|<email>"),
    and a cold Add a person: defect D4, none of the three worked from a hash. */
 if(k==="people"){view={name:"people"}; PEOPLE_TAB=v==="clients"?"clients":"agency"}
 if(k==="person"&&v) view={name:"person",id:v};
 if(k==="addmember"){AM=Object.assign({},AM_BLANK); view={name:"addmember"}}
 if(k==="client"&&byId[v]) view={name:"record",id:v};
 /* the client's own side, and the create modal, are otherwise several clicks
    in. Coordinator review round 1, 24 Sep: a cold #asclient link lands on the
    first screen the role actually grants, not on the fixed Workspace item -
    Client Admin and Collaborator (Sequences first in CLIENT_MODULES) land on
    Sequences, Client Viewer (only Reports and Usage) lands on Reports. */
 if(k==="asclient"&&byId[v]){ctx=v;asClient=true;
  const cc=byId[v], role=actingRole(cc), mods=roleSet(role).mods;
  const first=CLIENT_MODULES.find(m=>mods.indexOf(m[0])>-1);
  cView=first?first[0]:"settings"}
 if(k==="addclient"){view={name:"clients"};setTimeout(openAddClient,0)}}
render();
</script>

<div id="sess" class="collapsed" hidden>
 <div class="sess-bar">
