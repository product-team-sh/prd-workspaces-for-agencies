.nc-limrow{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.3fr) 176px;gap:16px;align-items:center;padding:11px 14px;border-top:1px solid var(--gray-16)}
.nc-limrow:first-child{border-top:0}
.nc-limhd{padding:8px 14px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--gray-11);background:var(--gray-19);border-radius:var(--radius-control) var(--radius-control) 0 0}
.nc-limlab b{display:block;font-size:14px;font-weight:500;color:var(--gray-17);line-height:20px}
.nc-limlab i{display:block;font-style:normal;font-size:12px;line-height:16px;color:var(--gray-15)}
.nc-pool{display:block;min-width:0}
.nc-poolbar{display:flex;height:6px;border-radius:3px;background:var(--gray-16);overflow:hidden}
.nc-poolbar span:first-child{background:var(--green-16)}
.nc-poolbar span:last-child{background:var(--blue-24)}
.nc-pool i{display:block;font-style:normal;font-size:11.5px;line-height:16px;color:var(--gray-15);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nc-pool i b{font-weight:600;color:var(--gray-17)}
/* 18 Sep, Hitesh: the header sat over the unit words while the inputs start at
   the column edge. Header and inputs both align left now. */
.nc-limin{display:flex;justify-content:flex-start}
.nc-bif{display:flex;gap:12px;align-items:flex-start;margin-top:14px;padding:12px 14px;border:1px solid var(--gray-13);border-radius:var(--radius-control);background:var(--gray-1)}
.nc-bif .sw{flex:none;margin-top:3px}
.nc-bif.is-on{border-color:var(--blue-11);background:var(--blue-17)}
/* the arrow that enters a workspace from a table row */
/* 18 Sep QA: flex children shrink by default (global min-width:0), which made
   "Edit access" and "Remove" overlap and "Manage" clip at 1180. */
/* 18 Sep QA: this was named .rowacts, which already exists above as the
   icon-button row with 34px buttons; the collision squeezed "Edit access" and
   "Manage" to 34px and made them overlap. Own name now. */
.tblacts{display:inline-flex;align-items:center;gap:10px;white-space:nowrap}
.tblacts>*{flex:none}
/* agency Unified Inbox, the live inbox's list-and-pane with the client as the organising line */
/* point 13: the inbox fills the page like the live one. The page becomes a
   column when it holds the inbox, and the card takes what the toolbar leaves. */
.page:has(.ubx){display:flex;flex-direction:column;overflow:hidden}
.page:has(.ubx) .toolbar{flex:none}
.page:has(.ubx) .wrap{flex:1;min-height:0;padding-bottom:24px}
.ubx{display:flex;flex-direction:column;flex:1;min-height:480px;overflow:hidden}
.ubx-clients{border-right:1px solid var(--gray-13);display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--gray-19)}
.ubx-clh{padding:12px 14px 6px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--gray-11);display:flex;gap:6px;align-items:baseline}
.ubx-csearch{padding:6px 12px 8px;border-bottom:1px solid var(--gray-16)}
.ubx-csearch input{font-size:13px}

   The switcher has nothing to switch to before a first client exists, so it

/* ═══ A8 Add a member, one screen ═════════════════════════════════════════════
   Ported 16 Sep 2026 from add-member-flow.html, which replaced the four-step
   wizard at Hitesh's direction. Person, workspaces and access are three
   sections of one form; there is no review step because nothing is hidden and
   the footer carries the whole grant. Only the furniture this screen needs is
   below: the presets, the card grid, the switches and the chips are the ones
   A4 Access already ships, unchanged, which is the point of the merge.       */
/* width:100% is load-bearing. .wrap is a column flexbox, and auto side margins
   on a flex item switch off cross-axis stretch, so without it the panel sizes
   to its own content and visibly changes width between Agency user and Client
   user, whose sections are different lengths. Found in review 16 Sep. */
.am-wrap{width:100%;max-width:1248px;margin:0 auto;
 display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;align-items:start}
/* the rail is not a wizard. Nothing here is gated behind it and every section
   is on the page already; it says where you are, what each section currently
   holds, and jumps to one. It lives in the gutter the centred panel was
   leaving empty, which is the whole reason it exists. */
.am-wrap.solo{grid-template-columns:minmax(0,1fr);max-width:1180px} /* 17 Sep 2026: no longer used by the Access tab, which was the one full-width tab rendered 1180px centred */
.am-rail{position:sticky;top:12px;display:flex;flex-direction:column;gap:2px}
.am-rail-i{display:flex;gap:10px;padding:10px 12px;border-radius:var(--radius-control);
 background:none;border:0;font:inherit;text-align:left;width:100%;cursor:pointer;color:var(--gray-15)}
.am-rail-i:hover{background:var(--gray-16)}
.am-rail-i.is-now{background:var(--blue-17)}
.am-rail-n{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
 font-size:11px;font-weight:600;background:var(--gray-13);color:var(--gray-15)}
.am-rail-i.is-now .am-rail-n{background:var(--blue-11);color:#fff}
.am-rail-i.is-done .am-rail-n{background:var(--green-11);color:var(--green-12)}
.am-rail-t{font-size:13px;font-weight:600;line-height:18px;color:var(--gray-12);display:block}
.am-rail-i.is-now .am-rail-t{color:var(--blue-20)}
.am-rail-s{font-size:12px;line-height:17px;color:var(--gray-15);display:block}
.sec{border-top:1px solid var(--gray-13)}
.sec:first-of-type{border-top:0}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.sec-n{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
 font-size:11px;font-weight:600;background:var(--gray-16);color:var(--gray-15)}
.sec-n.is-done{background:var(--green-11);color:var(--green-12)}
.sec-t{font-size:15px;line-height:22px;font-weight:600;color:var(--gray-17)}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.resting{border:1px dashed var(--gray-23);border-radius:var(--radius-control);
 padding:22px;text-align:center;font-size:13px;color:var(--gray-15);background:var(--gray-19)}
/* a consequential pick is a card with its consequence written on it, never a
   select the reader has to already understand. Used for the user type and,
   since 16 Sep, for the account role, which nobody could previously decode. */
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.choice{text-align:left;background:var(--gray-1);border:1px solid var(--gray-13);

 display:flex;gap:12px;align-items:flex-start;transition:border-color .15s,box-shadow .15s}

 border:1.5px solid var(--gray-23);background:var(--gray-1)}

.choice b{display:block;font-size:14px;font-weight:600;line-height:22px;color:var(--gray-17)}

/* ══ Version C: the transformation ═══════════════════════════════════════════
   Adding a first client converts the account to the workspace model. In the real
   product that is a round trip: the backend converts, then the new Home fetches.
   So this is not decoration over a known duration, it is the loading state for
   work of unknown length, and it has to stay honest while it waits.

   The first build did this with a skeleton card plus two coach marks afterwards.
   That failed on its own terms: a card flicking into a 28px avatar in 420ms
   reads as a glitch, and a tooltip pinned against the rail teaches nothing. This
   version makes the wait itself the explanation. The screen draws the model, one
   idea at a time, and there is no separate guide because the sequence is the
   guide.                                                                      */
.xs{position:fixed;inset:0;z-index:5000;background:var(--gray-1);
  display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
.xs-stage{width:100%;max-width:760px;display:flex;flex-direction:column;align-items:center;gap:28px}
/* the two workspace cards */
.xs-row{display:flex;align-items:stretch;justify-content:center;gap:0;width:100%;position:relative}
.xs-ws{flex:0 0 300px;max-width:300px;background:#fff;border:1px solid var(--gray-13);border-radius:10px;
  padding:16px;box-shadow:0 1px 2px rgba(31,41,55,.05);box-sizing:border-box;
  transition:flex-basis .6s cubic-bezier(.34,1.15,.5,1),max-width .6s cubic-bezier(.34,1.15,.5,1),
             opacity .45s ease,padding .6s ease,transform .6s cubic-bezier(.34,1.15,.5,1)}
.xs-ws .xs-nm{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;color:var(--gray-17);margin-bottom:12px}
.xs-ws .xs-av{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:600;color:#fff;flex:none}
.xs-i{display:flex;align-items:center;justify-content:space-between;font-size:13px;line-height:26px;color:var(--gray-11);
  opacity:0;transform:translateY(5px);transition:opacity .38s ease,transform .38s ease}
.xs-i b{font-weight:600;color:var(--gray-17);font-variant-numeric:tabular-nums}
.xs-on .xs-i{opacity:1;transform:none}
.xs-on .xs-i:nth-child(2){transition-delay:.05s}
.xs-on .xs-i:nth-child(3){transition-delay:.11s}
.xs-on .xs-i:nth-child(4){transition-delay:.17s}
.xs-on .xs-i:nth-child(5){transition-delay:.23s}
/* the second workspace arrives from the right */
/* nothing there at all, not merely invisible, so the first card is genuinely
   centred before the second exists and genuinely moves aside when it arrives */
.xs-new{opacity:0;flex-basis:0;max-width:0;padding-left:0;padding-right:0;border-width:0;overflow:hidden}
.xs-new.in{opacity:1;flex-basis:300px;max-width:300px;padding-left:16px;padding-right:16px;border-width:1px}
/* the divider, and what it means */
.xs-div{flex:0 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  opacity:0;overflow:hidden;transition:opacity .4s ease,flex-basis .6s cubic-bezier(.34,1.15,.5,1)}
.xs-div.in{opacity:1;flex:0 0 78px}
.xs-div .xs-line{width:1px;flex:1;background:linear-gradient(var(--gray-13),var(--gray-13));min-height:26px}
.xs-div .xs-lock{width:30px;height:30px;border-radius:50%;background:var(--gray-2);border:1px solid var(--gray-13);
  display:grid;place-items:center;flex:none}
/* the account bar that appears above both */
.xs-top{width:100%;max-width:678px;background:#fff;border:1px solid var(--gray-13);border-radius:10px;padding:12px 16px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  opacity:0;transform:translateY(-8px);transition:opacity .45s ease,transform .45s cubic-bezier(.34,1.2,.5,1)}
.xs-top.in{opacity:1;transform:none}
.xs-top .xs-chip{font-size:12px;font-weight:500;color:var(--blue-11);background:var(--blue-19,#eff6ff);
  border-radius:20px;padding:3px 10px}
/* the caption, one idea at a time */
.xs-cap{min-height:52px;text-align:center;max-width:600px}
.xs-cap h3{font-size:18px;line-height:26px;font-weight:600;color:var(--gray-17);margin:0 0 4px}
.xs-cap p{font-size:14px;line-height:21px;color:var(--gray-11);margin:0}
.xs-cap .xs-t{animation:xsCap .42s cubic-bezier(.4,0,.2,1) both}
@keyframes xsCap{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
/* progress: which idea we are on, and that work is still happening */
.xs-foot{display:flex;flex-direction:column;align-items:center;gap:24px;min-height:34px}
.xs-pips{display:flex;gap:6px}
.xs-pip{width:22px;height:3px;border-radius:2px;background:var(--gray-13);transition:background .3s ease}
.xs-pip.on{background:var(--blue-11)}
.xs-steps{padding:0}
.xs-wait{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--gray-11)}
.xs-spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--gray-13);border-top-color:var(--blue-11);
  animation:xsSpin .7s linear infinite}
@keyframes xsSpin{to{transform:rotate(360deg)}}
@media (max-width:760px){
  .xs-row{flex-direction:column;align-items:center;gap:0}
  .xs-ws{flex:0 0 auto;width:100%;max-width:320px}
  .xs-new{max-width:0;height:0;padding-top:0;padding-bottom:0}
  .xs-new.in{max-width:320px;height:auto;padding-top:16px;padding-bottom:16px}
  .xs-div{flex:0 0 0;width:100%;flex-direction:row;height:0}
  .xs-div.in{flex:0 0 auto;height:52px}
  .xs-div .xs-line{width:auto;height:1px;flex:1;min-height:0}
}
/* Reduced motion removes movement, never the explanation. The first build sent
   this case straight past the whole sequence, so a machine with the OS setting
   on saw no transformation at all and then a tooltip out of nowhere.         */
@media (prefers-reduced-motion:reduce){
  .xs-ws,.xs-i,.xs-new,.xs-div,.xs-top,.xs-cap .xs-t{transition:none;animation:none}
  .xs-new{opacity:1;transform:none}
  .xs-spin{animation:none}
}
}
</style>

const SEQ_STATE=["Active","Active","Active","Paused","Draft"];
function growSequences(c){
 const names=SEQ_SETS[c.id]||[]; c.sequences=[];
 if(!c.seq) return;
 const r=rng("seq:"+c.id);
 /* the per-sequence figures have to sum back to the client's headline totals,
    or the client record and the sequence list contradict each other on the one
    number the client cares about most.                                      */
 const w=[]; for(let i=0;i<c.seq;i++) w.push(.4+r());
 const tot=w.reduce((a,b)=>a+b,0);
 let sentLeft=c.sent, prosLeft=c.prospects;
 for(let i=0;i<c.seq;i++){
  const name=names[i]||("Campaign "+(i+1));
  const state=i<Math.ceil(c.seq*.55)?"Active":SEQ_STATE[3+(i%2)];
  const last=i===c.seq-1;
  const share=w[i]/tot;
  const sent=state==="Draft"?0:last?sentLeft:Math.round(c.sent*share);
  const pros=last?prosLeft:Math.round(c.prospects*share);
  sentLeft-=sent; prosLeft-=pros;
  const reply=state==="Draft"?0:+(c.reply*(.6+r()*.8)).toFixed(1);
  /* a draft has a list loaded and nobody emailed yet, which is exactly why a
     draft sitting on 900 prospects is worth a conversation. */
  const contacted=state==="Draft"?0:Math.round(Math.max(0,pros)*(.72+r()*.26));
  c.sequences.push({name,state,prospects:Math.max(0,pros),contacted,sent:Math.max(0,sent),reply,
   owner:(staffOf(c)[i%Math.max(1,staffOf(c).length)]||{name:"the agency"}).name});
 }
 /* rounding has to land somewhere. Put it on the largest active sequence so no
    row ends up negative and the column still totals the headline.          */
 const drift=c.sent-c.sequences.reduce((t,x)=>t+x.sent,0);
 if(drift){const t=c.sequences.filter(x=>x.state!=="Draft").sort((a,b)=>b.sent-a.sent)[0];if(t)t.sent+=drift}
 const pdrift=c.prospects-c.sequences.reduce((t,x)=>t+x.prospects,0);
 if(pdrift){const t=c.sequences.slice().sort((a,b)=>b.prospects-a.prospects)[0];
  if(t){t.prospects+=pdrift; t.contacted=Math.min(t.contacted,t.prospects)}}
}

const myClientsForLimits=()=>canI("limits")?myClients():[];

CLIENTS.forEach(c=>{

 c.access={mods:p.mods.slice(),verbs:p.verbs.slice()};

byId.bl.access={mods:["analytics"],verbs:[]};
byId.al.access={mods:["sequences","inbox","prospects","leads","analytics","usage"],verbs:["reply","export","reveal"]};
/* the editor. A preset is the whole interaction for most agencies, and the
   toggles exist because the two hardcoded cases prove presets alone will not
   cover everyone. Every toggle states its consequence in the client's terms,
   not ours: "sends email from their own mailbox" rather than "reply

/* Decided 14 Sep 2026, Hitesh: the Access screen is cards with a live preview.
   Left, one card per screen in a grid under its group, the switch in the card
   header and the screen's actions as checkboxes inside it. Right, sticky, what
   the client will actually see: their rail, where they land, what they can and
   cannot do, and the invite sentence, all derived from the same access set. The

}
function accessPreview(c){

/* toggling one screen for one staff member in one workspace. Written as a

   whole merge removed came about in the first place.

   Stored as the preset name when it matches one and as the set when it does
   not, which is the shape accessIn and presetNameIn both accept. */
function toggleStaffMod(subj,cid,k){
 if(!canI("members")) return;
 const P=PEOPLE[subj]; if(!P) return;

 const mods=cur.mods.slice(), at=mods.indexOf(k);
 if(at>-1) mods.splice(at,1); else mods.push(k);
 /* the same rule the client side has always had: a member who reaches nothing
    is worse than no member, so the last screen cannot be switched off. Remove
    them from the workspace instead, which is what the Remove control is for. */
 if(!mods.length) return;
 const set={mods:mods,verbs:[]}, n=presetOf(set,STAFF_PRESETS);

}
/* One editor for one object: a subject's permission in one workspace. subject
   undefined means the client itself (ACCESS_PRESETS, D5a: one set, everyone
   from that client gets it). subject as a PEOPLE key means that staff member,
   in this workspace only (STAFF_PRESETS). This merge, and the reasoning behind
   it, is 40-people-access-flow-diagnosis.md §3.1, at Hitesh's direction 15 Sep:
   "access screen and people screen should be the same." Staff access is
   preset-only, not per-card custom: no agency asked for graded staff access at
   all until now, so per-module staff customisation stays unscoped rather than
   invented; see that file §3.6. */
function accessPanel(c,subject,embed){
 if(!subject&&isLinked(c)) return `<div class="panel">
   <div class="panel-h"><span class="panel-t">What ${c.name} can reach</span>
    <span class="chip c-vio">Their workspace, their rules</span></div>
   <div class="panel-b"><span class="sub">${c.name} is on its own plan, so it decides its own
    access and you cannot set it. What you can reach in their workspace is on their Workspace
    screen, and they can revoke it without asking you.</span></div></div>`;
 const p=subject&&PEOPLE[subject];
 const presetTable=subject?STAFF_PRESETS:ACCESS_PRESETS;
 const cur=subject?(presetNameIn(p,c.id)||"Custom"):presetOf(c.access||{mods:[],verbs:[]});
 const a=subject?(asSet(presetIn(p,c.id))||{mods:[],verbs:[]}):(c.access||{mods:[],verbs:[]});
 const presets=`<div class="preset-row" role="radiogroup" aria-label="Access preset">${Object.keys(presetTable).map(n=>{const pr=presetTable[n];
   return `<button data-apreset="${c.id}|${n}${subject?"|"+subject:""}" class="preset-card" role="radio" aria-checked="${cur===n}" aria-pressed="${cur===n}" title="${pr.why}">
     <b>${n}</b><i>${pr.mods.length} screen${pr.mods.length===1?"":"s"}${subject?"":" &middot; "+(pr.verbs.length?pr.verbs.length+" action"+(pr.verbs.length===1?"":"s"):"no actions")}</i></button>`}).join("")}
   ${cur==="Custom"?`<div class="preset-card is-custom" aria-current="true"><b>Custom</b><i>Not one of the presets. Stays Custom until the cards match one</i></div>`:""}</div>
   <p class="sub" style="margin:10px 0 0">${cur==="Custom"?"Pick a preset to reset every card, or keep adjusting below.":presetTable[cur].why+"."}</p>`;
 const card=(m,g)=>{const on=a.mods.indexOf(m.k)>-1,last=!subject&&accessLast(c,m.k);
   return `<div class="acccard${on?"":" is-off"}">
    <div class="acccard-h"><span style="min-width:0"><em class="acccard-g">${g}</em><b>${m.label}</b><i>${last?"Their only screen. To stop their access entirely, disable the client instead":m.why}</i></span>
     <button class="sw" role="switch" aria-checked="${on}" ${last?"disabled":""} data-amod="${c.id}|${m.k}${subject?"|"+subject:""}" aria-label="${m.label} for ${subject?p.name+" in "+c.name:c.name}"></button></div>
    ${(!subject&&m.acts.length)?`<div class="accchks">${m.acts.map(v=>{const von=on&&a.verbs.indexOf(v[0])>-1;
      return `<label class="accchk${on?"":" is-off"}"><input type="checkbox" ${von?"checked":""} ${on?"":"disabled"} data-averb="${c.id}|${v[0]}" aria-label="${v[1]} for ${c.name}">
        <span style="min-width:0"><b>${v[1]}</b><i>${on?v[2]:"Needs the "+m.label+" screen switched on first"}</i></span></label>`}).join("")}</div>`:""}
   </div>`};
 /* one grid, in group order, the group named on each card: audience-filtered,
    so a client sees 7 and a staff member sees 11, from the one table. */
 const groups=`<div class="accgrid">${ACCESS_GROUPS(subject?"staff":"client").map(g=>g.mods.map(m=>card(m,g.name)).join("")).join("")}</div>`;
 const totalMods=subject?ALL_STAFF_MODS.length:CLIENT_MODULES.filter(m=>m[4]!=="staff").length;

 /* embed drops the panel chrome so A4's section 1 can hold this editor inside
    the one panel that screen is. The controls, the presets and the preview are
    the same ones; only the frame differs, because two frames around one editor
    is how a screen ends up looking like two features. */
 if(embed) return `<div class="acc2"><div class="acc-main">
   <div class="accbar"><span class="sub">${a.mods.length} of ${totalMods} screens${subject?"":" &middot; "+a.verbs.length+" of "+CLIENT_VERBS.length+" actions"}</span>
    <span class="chip c-${cur==="Custom"?"warn":"info"}">${cur}</span></div>
   ${presets}
   <div style="margin-top:16px">${groups}</div>
   ${emptyMsg}</div>${accessPreview(c)}</div>`;
 const body=`<div class="panel">
   <div class="panel-h"><span class="panel-t">${subject?"What "+p.name+" can reach in "+c.name:"Default access for new "+c.name+" users"}</span>
    <span class="sub">${a.mods.length} of ${totalMods} screens${subject?"":" &middot; "+a.verbs.length+" of "+CLIENT_VERBS.length+" actions"}</span>
    <span class="c-a"><span class="chip c-${cur==="Custom"?"warn":"info"}">${cur}</span></span></div>
   <div class="panel-b">${presets}</div>
   <div class="panel-b" style="border-top:1px solid var(--gray-13)">${groups}</div>
   ${empty?`<div class="panel-b" style="border-top:1px solid var(--gray-13)">${emptyMsg.replace('margin:14px 0 0','margin:0')}</div>`:""}
  </div>`;
 /* the two-column grid exists to hold the preview beside the cards; with no
    subject there is no preview, and .acc2's own grid-template-columns still
    reserves that second column's width even with nothing in it, which is
    what crushed this into a sliver of a drawer the first time it rendered. */
 if(subject) return body;
 return `<div class="acc2"><div class="acc-main">${body}</div>${accessPreview(c)}</div>`;

/* ═══ A4 Access: access management for one client ═════════════════════════════
   Rebuilt 16 Sep 2026 to the shape A8 uses, at Hitesh's direction. It was two
   stacked panels, a card grid and a members table, which read as two features
   on one tab. It is one thing: everything about who can do what in this
   workspace. So it is one panel of numbered sections with the same rail, and
   the sections are the three questions an agency actually has here.

   Section 1 is the default a new client user starts from (D5d), not a grant to
   anyone. Sections 2 and 3 are the people who hold real grants, split by
   internal and external because that is the split that decides what you may
   do to them: you set a colleague's access, and you set a client user's, but
   only a colleague has an account role behind it.                            */
/* the agency domain, taken from the one address the fixture actually states
   rather than guessed from the agency's name, which would break the day

const AGY_DOMAIN=(OWN_WS.email||"@meridiangrowth.com").split("@")[1];
/* fixture staff predate PEOPLE carrying an address; anyone A8 invites has a
   real one. Derived rather than left blank, because an access table whose
   email column is a row of dashes is a column that should not be there. */
const staffEmail=P=>P.email||(P.name.toLowerCase().replace(/[^a-z ]/g,"").split(" ").join(".")+"@"+AGY_DOMAIN);

/* 18 Sep, delight pass: Edit access opens under the row, with the preset
   cards and screen chips the wizard's Access step uses, and the row's Access
   cell follows each click. Add member keeps its own screen: it asks who. */
const rcUser=()=>{const c=RC_EDIT&&byId[RC_EDIT.cid]; return c&&(c.users||[]).find(x=>x[0]===RC_EDIT.key)};
const rcUserSet=(c,u)=>{if(!u[2]){const a=userAccessOf(c,u);u[2]={mods:a.mods.slice(),verbs:(a.verbs||[]).slice()}} return u[2]};
function rcInline(c,kind,key,name){
 const staff=kind==="staff", t=staff?STAFF_PRESETS:ACCESS_PRESETS;
 const a=staff?(asSet(presetIn(PEOPLE[key],c.id))||{mods:[],verbs:[]}):userAccessOf(c,(c.users||[]).find(x=>x[0]===key));
 const mods=modsFor(staff?"staff":"client"), cur=presetOf(a,t);
 const cards=Object.keys(t).map(n=>{const pr=t[n];
  return `<button type="button" class="preset-card" role="radio" aria-checked="${cur===n}" data-rcpre="${n}" title="${pr.why}">
   <b>${n}</b><i>${pr.mods.length} screen${pr.mods.length===1?"":"s"}${staff?"":" &middot; "+((pr.verbs||[]).length?pr.verbs.length+" action"+(pr.verbs.length===1?"":"s"):"no actions")}</i></button>`}).join("")
  +(cur==="Custom"?`<div class="preset-card is-custom" aria-current="true"><b>Custom</b><i>Not one of the presets</i></div>`:"");
 const chips=mods.map(m=>{const on=a.mods.indexOf(m[0])>-1;
  return `<button type="button" class="nc-chip" aria-pressed="${on}" data-rcmod="${m[0]}" title="${m[2]}">${on?tickI:""}${m[1]}</button>`}).join("");
 const verbs=staff?"":`<div><span class="cs"><span>Actions</span><span>${a.verbs.length} of ${CLIENT_VERBS.length}</span></span><div class="nc-verbs">${CLIENT_VERBS.map(v=>{
  const scr=a.mods.indexOf(v[3])>-1, on=scr&&a.verbs.indexOf(v[0])>-1, lbl=(mods.find(m=>m[0]===v[3])||[0,v[3]])[1];
  return `<label class="accchk${scr?"":" is-off"}"><input type="checkbox" ${on?"checked":""} ${scr?"":"disabled"} data-rcverb="${v[0]}" aria-label="${v[1]}">
   <span style="min-width:0"><b>${v[1]}</b><i>${scr?v[2]:"Needs the "+lbl+" screen switched on first"}</i></span></label>`}).join("")}</div></div>`;
 /* 21 Sep 2026, coordinator feedback round 3: the last-screen confirmation
    sits right under the Screens row it is about, above Actions, not stranded

 const lastChk=(!staff&&RC_LASTCHK&&RC_LASTCHK.cid===c.id&&RC_LASTCHK.key===key)
   ?(ml=>`<div><div class="inlineconfirm" role="alert"><span><strong>${name.charAt(0).toUpperCase()+name.slice(1)}</strong> is signed in now and would lose ${ml}.</span>

    <button class="shd-button shd-button--secondary shd-button--sm" data-rclastgo>Remove</button></span></div></div>`)((mods.find(m=>m[0]===RC_LASTCHK.mod)||[0,RC_LASTCHK.mod])[1])
   :"";
 return `<tr class="rc-editrow"><td colspan="7"><div class="rc-edit">
  <div class="rc-edit-h"><span class="sub">What <b style="color:var(--gray-17)">${name}</b> reaches in ${c.name}</span>
   <span class="chip c-${cur==="Custom"?"warn":"info"}">${cur}</span>
   <button class="linkbtn" data-rcdone style="margin-left:auto;font-weight:600">Done</button></div>
  <div class="preset-row nc-presets" role="radiogroup" aria-label="Access preset">${cards}</div>
  <div class="nc-screens"><div><span class="cs"><span>Screens</span><span>${a.mods.length} of ${mods.length}</span></span><div class="nc-chips">${chips}</div></div>${lastChk}${verbs}</div>

 </div></td></tr>`;

function memberParts(c){

   open:isOpen(s2.key), after:isOpen(s2.key)?rcInline(c,"staff",s2.key,s2.name):"",
   remove:`<button class="linkbtn" data-staffremove="${s2.key}|${c.id}" style="color:var(--red-600)">Remove</button>`});

 /* D5d: a client user's grant is their own. Someone invited before D5d has

   edit:`<button class="linkbtn" data-rcedit="user|${key}|${c.id}" aria-expanded="${isOpen(key)}">${isOpen(key)?"Editing":"Edit access"}</button>`,
   open:isOpen(key), after:isOpen(key)?rcInline(c,"user",key,label):"",

 const owners=Object.keys(PEOPLE).filter(k=>isOwnerP(PEOPLE[k]));

/* ═══ A4 Access: the people who can reach this client ═════════════════════════
   Rebuilt twice on 16 Sep. It was a card grid stacked on a members table, then
   three numbered sections, and it is now what it should always have been: the
   list of everyone who can get into this workspace and what each of them can
   do, one row per person.

   The card grid left because it was the loudest thing on a screen about
   people, and it grants nobody anything: it is the default the next invitee
   starts from (D5d). It is a line in the header and a drawer when it is
   actually being changed, which is rarely, because most agencies set it once.

   One table and not two, internal above external, because the question here is
   "who can get in" and splitting it by employer answers a different one. Which
   employer someone is from is a property of the row, so it sits in the row. */
function rAccess(c){
 const M=memberParts(c), linked=isLinked(c), cur=presetOf(c.access||{mods:[],verbs:[]});
 const head=`<thead><tr><th>Person</th><th>Email address</th><th>Role</th><th>Access here</th>
   <th>Password</th><th>Last active</th><th class="colact"></th></tr></thead>`;
 const grp=t=>`<tr class="grouprow"><td colspan="7">${t}</td></tr>`;

 /* CN3 (P0): a linked workspace is the client's own. The agency cannot set its
    default and cannot add or remove its users, so neither the header line nor

 if(linked) return `<div><div class="panel">

   ${receiptBar("access:"+c.id)}
   <div class="tscroll"><table class="organism" style="min-width:920px">${head}
    <tbody>${M.staff}</tbody></table></div>
   <div class="panel-b" style="border-top:1px solid var(--gray-13)"><span class="sub">
    ${c.name} is on its own plan, so its own users and its own access are theirs to manage, not yours,
    and they can revoke your access without asking. Removing someone here ends their access to
    ${c.name} and touches nothing of the client's.</span></div></div></div>`;

 return `<div><div class="panel">
   <div class="panel-h"><span class="panel-t">Access for ${c.name}</span>

   ${receiptBar("access:"+c.id)}
   <div class="tscroll"><table class="organism" style="min-width:920px">${head}
    <tbody>

     ${grp(c.name)}${M.users||`<tr><td colspan="7"><span class="sub">Nobody from ${c.name} can sign in yet. Add member invites their first login.</span></td></tr>`}

/* ═══ A8 Add a member ═════════════════════════════════════════════════════════
   One screen replacing the three entry points that used to ask this question:
     People -> "Invite someone"     (name, email, role; no workspace, no access)
     Person -> "Add to workspaces"  (existing people only; no email)
     Client -> "Add member"         (agency branch could not invite; client
                                     branch had no access step)
   Each asked part of it, two wrote stores nothing enforced, and none could do
   the whole job. 40-people-access-flow-diagnosis.md §3.2 called for
   who -> where -> what; Hitesh's direction on 16 Sep made it one screen rather
   than four steps, so the whole grant is readable before it is sent and there
   is no review step for anything to hide behind. The entry point only decides
   what is pre-filled.                                                        */
const AM_BLANK={email:"",name:"",kind:"agency",role:"Member",ws:[],wsIdx:0,access:{},uniform:true,mode:"invite",from:null};
let AM=Object.assign({},AM_BLANK);

const amWs=()=>CLIENTS.concat([OWN_WS]);
const amById=id=>amWs().filter(w=>w.id===id)[0];
const amMany=()=>AM.ws.length>1;
const amUni=()=>AM.uniform&&amMany();
const amCurWs=()=>amById(AM.ws[amUni()?0:AM.wsIdx]);
const amCur=()=>AM.access[AM.ws[amUni()?0:AM.wsIdx]]||{mods:[],verbs:[]};
/* in uniform mode every write lands on every picked workspace, so the store
   still holds one record per membership and nothing downstream has to know the
   difference. "Same in all" is a way of filling them in, not a third model. */
const amWrite=a=>{(amUni()?AM.ws:[AM.ws[AM.wsIdx]]).forEach(id=>{
  AM.access[id]={mods:a.mods.slice(),verbs:(a.verbs||[]).slice()}})};
const amSpread=()=>{const a=amCur();AM.ws.forEach(id=>{AM.access[id]={mods:a.mods.slice(),verbs:a.verbs.slice()}})};
const amAllSame=()=>AM.ws.every(id=>{const a=AM.access[id]||{mods:[],verbs:[]},b=AM.access[AM.ws[0]]||{mods:[],verbs:[]};
  return a.mods.slice().sort().join()===b.mods.slice().sort().join()&&a.verbs.slice().sort().join()===b.verbs.slice().sort().join()});
/* carry-forward is what stops several workspaces being several configurations:
   the previous one seeds the next. A client user has no previous workspace, so
   it seeds from that client's own default, which is the whole of D5d. */
function amSeed(idx){
 const id=AM.ws[idx]; if(AM.access[id]) return;
 if(idx>0&&AM.access[AM.ws[idx-1]]){const prev=AM.access[AM.ws[idx-1]];
  AM.access[id]={mods:prev.mods.slice(),verbs:prev.verbs.slice()}; return}
 if(AM.kind==="client"){const c=amById(id), pre=(c&&c.access)?c.access:ACCESS_PRESETS["Reply and run"];
  AM.access[id]={mods:pre.mods.slice(),verbs:(pre.verbs||[]).slice()}; return}
 AM.access[id]={mods:STAFF_PRESETS["Everything"].mods.slice(),verbs:[]};
}
const amValidEmail=e=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test((e||"").trim());
const amPersonOk=()=>amValidEmail(AM.email)&&AM.name.trim().length>1;
const amFilled=()=>AM.ws.length>0&&AM.ws.every(id=>(AM.access[id]||{mods:[]}).mods.length>0);
const amCanSend=()=>amPersonOk()&&amFilled();
/* a caller may hand over the access it wants shown, as the edit entry does;
   amSeed only fills what is missing, so passing it in is enough. */
const amOpen=o=>{AM=Object.assign({},AM_BLANK,{ws:[],access:{}},o||{});
 AM.ws.forEach((x,k)=>amSeed(k)); if(amUni())amSpread(); view={name:"addmember"}; render()};

function amSecAccess(){
 const agency=AM.kind==="agency", t=agency?STAFF_PRESETS:ACCESS_PRESETS;
 if(!AM.ws.length) return `<div class="panel-b sec" id="amSec3">
  <div class="sec-h"><span class="sec-n">3</span><span class="sec-t">Access</span>
   <span class="sub">What they can reach in each workspace</span></div>
  <div class="st-say" id="stSay">${amSay()}</div>
  <div class="resting">Pick a workspace above and its ${agency?ALL_STAFF_MODS.length:modsFor("client").length} screens appear here.</div></div>`;

 const U=amUni(), w=amCurWs(), a=amCur(), cur=presetOf(a,t), who=AM.name||AM.email||"they";
 const total=agency?ALL_STAFF_MODS.length:modsFor("client").length;
 const names=AM.ws.map(id=>amById(id).name);
 const defs=[...new Set(AM.ws.map(id=>{const c=amById(id);return c.access?presetOf(c.access):null}).filter(Boolean))];

 const mode=amMany()?`<div class="tools" role="radiogroup" aria-label="How access is set across workspaces" style="margin-left:auto">

 const tabs=(amMany()&&!U)?`<div class="wstabs" role="tablist" aria-label="Workspace">${AM.ws.map((id,i)=>{

    <span style="min-width:0"><b class="trunc">${x.name}</b><i class="trunc">${xa.mods.length?presetOf(xa,t):"Nothing set"}</i></span></button>`}).join("")}</div>`:"";

 const presets=`<div class="preset-row" role="radiogroup" aria-label="Access preset">${Object.keys(t).map(n=>{const p=t[n];
   return `<button data-ampreset="${n}" class="preset-card" role="radio" aria-checked="${cur===n}" aria-pressed="${cur===n}" title="${p.why}">

 const card=(m,g)=>{const on=a.mods.indexOf(m.k)>-1;
  return `<div class="acccard${on?"":" is-off"}">
   <div class="acccard-h"><span style="min-width:0"><em class="acccard-g">${g}</em><b>${m.label}</b><i>${m.why}</i></span>

   ${m.acts.length?`<div class="accchks">${m.acts.map(v=>{const von=on&&a.verbs.indexOf(v[0])>-1;
     return `<label class="accchk${on?"":" is-off"}"><input type="checkbox" ${von?"checked":""} ${on?"":"disabled"} data-amverb="${v[0]}" aria-label="${v[1]}">
      <span style="min-width:0"><b>${v[1]}</b><i>${on?v[2]:"Needs the "+m.label+" screen switched on first"}</i></span></label>`}).join("")}</div>`:""}
  </div>`};
 const grid=`<div class="accgrid">${ACCESS_GROUPS(agency?"staff":"client").map(g=>g.mods.map(m=>card(m,g.name)).join("")).join("")}</div>`;

 return `<div class="panel-b sec" id="amSec3">
  <div class="sec-h"><span class="sec-n${amFilled()?" is-done":""}">3</span><span class="sec-t">Access</span>
   <span class="sub">What ${who} can reach in ${U?"all "+AM.ws.length+" workspaces":w.name}</span>${mode}</div>

  ${tabs}
  ${mixed?`<div class="msg m-warn" style="margin:0 0 14px">${warnI}<span><strong>These clients do not share a default.</strong>
   ${names.join(", ").replace(/\.$/,"")} are set to ${defs.join(", ")} for new client users. One set here overrides all of them for ${who}, and leaves each client's own default alone.</span></div>`:""}
  ${(!agency&&U&&defs.length===1)?`<div class="msg m-info" style="margin:0 0 14px">${infoI}<span><strong>Started from the ${defs[0]} default.</strong>
   Anything changed here applies to ${who} alone; each client's own default is untouched and still seeds the next person you invite.</span></div>`:""}
  <div class="accbar"><span class="sub">${a.mods.length} of ${total} screens${agency?"":" &middot; "+a.verbs.length+" of "+CLIENT_VERBS.length+" actions"}</span>
   <span class="chip c-${cur==="Custom"?"warn":"info"}">${cur}</span></div>
  ${presets}
  <div style="margin-top:16px">${grid}</div>
  ${!a.mods.length?`<div class="msg m-bad" style="margin:14px 0 0">${warnI}<span><strong>Nothing is switched on in ${w.name}.</strong>
   ${who} would be a member with no screen to open, which is worse than having no login at all. Switch on at least one, or untick this workspace above.</span></div>`:""}
 </div>`;
}

/* the one write. A membership is one record of person, workspace and permission
   set, which is what 40-people-access-flow-diagnosis.md §3.4 asks for: before
   this, two of the three ways of staffing a client wrote a store nothing
   enforced, so the work silently did not happen. There is one place now. */
function amSend(){
 if(!amCanSend()) return;
 if(AM.kind==="agency"){
  let key=Object.keys(PEOPLE).filter(k=>PEOPLE[k].email===AM.email.trim())[0];
  if(!key){ key=(AM.email.trim().split("@")[0].replace(/[^a-z0-9]/gi,"").toLowerCase())||("p"+Date.now().toString(36).slice(-5));
   while(PEOPLE[key]) key+="x";
   PEOPLE[key]={name:AM.name.trim(),initials:initials(AM.name.trim()),role:AM.role,email:AM.email.trim(),ws:{}};
   LASTSEEN[AM.name.trim()]="never";
  } else { PEOPLE[key].role=AM.role }
  PEOPLE[key].ws=PEOPLE[key].ws||{};
  /* stored as the preset name when it matches one and as the set when it does
     not. accessIn and presetNameIn accept both, and writing the name where it
     fits keeps the fixture and every existing screen reading as before. */
  AM.ws.forEach(id=>{const a=AM.access[id], n=presetOf(a,STAFF_PRESETS);
   PEOPLE[key].ws[id]=(n==="Custom")?{mods:a.mods.slice(),verbs:[]}:n});
  /* the destination is the confirmation: this file has no toast layer, and
     landing on the person's own page shows the membership that was written
     rather than asserting it happened. */
  AM=Object.assign({},AM_BLANK); view={name:"person",id:key}; render(); return;
 }
 const addr=AM.email.trim();
 AM.ws.forEach(id=>{const c=byId[id]; if(!c) return;
  c.users=c.users||[];
  const a=AM.access[id], row=c.users.filter(u=>u[0]===addr)[0];
  if(row){ row[2]={mods:a.mods.slice(),verbs:a.verbs.slice()} }
  else { c.users.push([addr,"Client",{mods:a.mods.slice(),verbs:a.verbs.slice()}]); LASTSEEN[addr]="never" }});
 const first=AM.ws[0];
 AM=Object.assign({},AM_BLANK); view={name:"record",id:first}; tab="access"; render();
}

/* ═══ C3 Usage and limits, the client's own view ══════════════════════════════
   09 §C3. The client never sees the pool, other clients, agency totals or margin.
   Every limit message names the agency rather than Saleshandy, because when an
   agency oversubscribes several clients stop at once and all of them escalate to
   us unless the copy says whose limit it was.                                   */
function cUsage(c){
 /* a linked workspace is on the client's own plan, so there is no agency
    allocation to report and no "ask the agency" route. Showing them the agency's
    allocation table here would be a straight untruth. */
 if(!funded(c)) return `<div class="panel">
   <div class="panel-h"><span class="panel-t">You are on your own Saleshandy plan</span>
     <span class="chip c-vio">Linked workspace</span></div>
   <div class="panel-b">
    <p style="font-size:14px;line-height:21px;margin:0 0 12px">${AGENCY.name} runs campaigns in this
    workspace, but they do not fund it and cannot set limits on it. Your volumes come from your own
    plan, and your invoice comes from Saleshandy directly.</p>
    <p class="sub" style="margin:0">If you are running short, upgrade your own plan.
    ${AGENCY.name} cannot raise it for you, and asking them will not help.</p>
   </div></div>`;
 const daysLeft=CYCLE.days-CYCLE.day;
 let worstK=null,worstP=-1;
 const rows=RK.map(k=>{const R=RES[k],m=compute(k),r=R.rows[c.id],st=rowState(k,c.id,m);
  /* floor, so only a genuinely exhausted allowance ever shows 100% */
  const p=Math.min(100,Math.floor(st.pct*100));
  if(st.room>0&&p>worstP){worstP=p;worstK=k}
  const pending=REQUESTS.find(x=>x.client===c.id&&x.res===k);
  const state=st.room===0?"At your limit":st.pct>=R.warn?"Close to your limit":"Within limit";
  const tone=st.room===0?"bad":st.pct>=R.warn?"warn":"ok";

/* ── go: search across every workspace the person is a member of ──────────── */
function searchAll(q){
 const t=q.trim().toLowerCase(); if(t.length<2) return [];
 const out=[];
 myClients().filter(c=>!isPending(c)).forEach(c=>{
  if(c.name.toLowerCase().indexOf(t)>-1||c.company.toLowerCase().indexOf(t)>-1)
    out.push({c,kind:"Client",label:c.name,sub:c.company,mod:"sequences"});
  (PROSPECTS[c.id]||[]).forEach(p=>{if((p.name+" "+p.co+" "+p.email).toLowerCase().indexOf(t)>-1)
    out.push({c,kind:"Prospect",label:p.name,sub:p.title+", "+p.co,mod:"prospects",pid:p.id})});
  seqNames(c).forEach(n=>{if(n.toLowerCase().indexOf(t)>-1)
    out.push({c,kind:"Sequence",label:n,sub:c.name,mod:"sequences"})});
  c.mailboxes.forEach(m=>{if(m[0].toLowerCase().indexOf(t)>-1)
    out.push({c,kind:"Email account",label:m[0],sub:m[1],mod:"accounts"})});
 });
 return out.slice(0,14);
}

/* ── orient: the plan card, compact, credits folded in ────────────────────── */
/* a single-workspace plan, so the pacing card on a normal user's Home agrees
   with the KPI row above it. The agency pool is 150,000 across clients; quoting
   that number to someone who has sent 2,148 from one workspace is the kind of
   contradiction that makes a whole screen untrustworthy. */
const NORMAL_PLAN={sends:5000,lead_finder:1000,verification:2000,ai:500};
const NORMAL_USED={lead_finder:610,verification:840,ai:455};
/* `norm` drops Allocate: there is nothing to allocate across until a second
   workspace exists. Add capacity stays, because running out is still possible. */
function planCard(norm){
 if(norm){
  const used=AGENCY_OWN.contacted, pool=NORMAL_PLAN.sends;
  const rate=used/Math.max(1,CYCLE.day), left=(pool-used)/Math.max(1,rate);
  const early=CYCLE.days-CYCLE.day-Math.floor(left);
  const creds=["lead_finder","verification","ai"].map((k,i)=>{
   const u=NORMAL_USED[k], p=NORMAL_PLAN[k], r=u/Math.max(1,CYCLE.day), d=(p-u)/Math.max(1,r);
   return {l:RES[k].label.replace(" Credits",""),c:["#1D4ED8","#059669","#D97706"][i],
     v:(d>=CYCLE.days-CYCLE.day?"lasts the cycle":Math.max(0,Math.round(d))+" days left"),p:u/p*100}});
  return '<div class="card"><div class="c-h"><span class="c-t">Plan pacing</span>'
   +'<span class="c-a"><span class="sub">'+CYCLE.month+'</span></span></div><div class="c-b">'
   +'<div class="big"><span class="big-v" style="font-size:24px;line-height:32px">'+f(used)+'</span>'
   +'<span class="big-s">of '+f(pool)+' emails, '+Math.round(elapsed()*100)+'% of the cycle gone</span></div>'
   +(left<CYCLE.days-CYCLE.day
     ?'<p class="pace bad">At this burn the plan is exhausted around <b>'+onDay(left)+'</b>, '+early+' days early.</p>'
     :'<p class="pace">On pace to finish the cycle inside the plan.</p>')
   +segbars(creds)
   +'<div class="tools" style="margin-top:12px">'
    +dqTip('<button class="shd-button shd-button--secondary shd-button--sm" data-gobill>Add capacity</button>',ADD_CAP_TIP)
   +'</div></div></div>';
 }
 const sm=compute("sends"), used=sm.used, pool=sm.R.pool, sd=burnDays("sends");
 const early=CYCLE.days-CYCLE.day-Math.floor(sd);
 const creds=RK.filter(k=>RES[k].nature==="Consumable").map((k,i)=>{const m=compute(k),d=burnDays(k);
  return {l:RES[k].label.replace(" Credits",""),c:["#1D4ED8","#059669","#D97706"][i],
   v:(d===Infinity?"no burn":d<1?"under a day":Math.round(d)+" days left"),p:m.used/RES[k].pool*100}});
 /* 18 Sep, Hitesh: "represent clients as in that card". The cycle's emails,
    split by the workspace that sent them, largest first, in each one's colour. */
 const byWs=fundedWorkspaces().map(c=>({c,u:cRow("sends",c.id).used})).filter(x=>x.u>0).sort((a,b)=>b.u-a.u);
 const wsTot=byWs.reduce((a,x)=>a+x.u,0)||1, top=byWs.slice(0,3), rest=byWs.slice(3);
 const wsBar=byWs.length?'<div class="pace-ws"><span class="sbar" style="height:8px">'

/* ═══ Home, the agency's landing screen ═══════════════════════════════════════
   Rail item 1, and where an agency account lands at login instead of Sequences.
   Zone order is deliberate: what needs a decision, then whether the agency is
   pacing right, then the clients ranked. Two rules hold it together.

   1. Zone 1 carries only what an owner can resolve and an operator cannot, plus
      operator work that has aged past its consequence. Without that rule this
      becomes a second inbox competing with the queue in All clients.
   2. Nothing here is a blended rate across clients. One reply rate across five
      unrelated ICPs is arithmetic, not information, and that is the shape that
      was promised in Mar 2024 and never shipped.                              */

const CYCLE={day:9,days:30,month:"September 2026"};        /* today is 9 Sep 2026 */
const elapsed=()=>CYCLE.day/CYCLE.days;
const PACE_DAYS=3;   /* under this many days of runway, pacing stops being a card */
/* ═══ the agency's card fails ═════════════════════════════════════════════════
   Decided 12 Sep 2026, after the Aug 2025 incident in which an agency's failed
   payment locked its clients out: during the agency's grace period a created
   client workspace stays readable, sending pauses, and the client's paused
   state names the agency and never the reason. Linked clients are on their own
   plan and are untouched. Reachable with #grace. */
const GRACE={on:false,failedOn:"7 Sep",daysLeft:5};
/* decided 12 Sep 2026: on a linked workspace the agency may open it as the
   client sees it only if the client granted that, at approval or later from
   their Workspace screen. Off by default. A created workspace is the agency's. */
const canViewAs=c=>!isLinked(c)||!!(c.link&&c.link.viewAs);
const viewAsBtn=(c,cls)=>canViewAs(c)
 ?`<button class="${cls}" data-asclient="${c.id}">View as client</button>`
 :`<button class="${cls}" disabled title="${c.name} has not granted this. They can, from the Workspace screen in their account.">View as client</button>`;
const grace=()=>GRACE.on;
const graceBanner=()=>grace()?`<div class="msg m-bad grace" style="margin-bottom:20px">${warnI}<span><strong>Payment failed on ${GRACE.failedOn}.</strong>
  ${GRACE.daysLeft} days to update the card before the account pauses. Your clients keep reading their workspaces; nothing is sending.
  ${canI("billing")?'<button class="linkbtn" data-gobill>Update payment</button>':"An owner updates the card."}</span></div>`:"";
const graceNote=c=>grace()&&!isLinked(c)?`<div class="msg m-warn grace" style="margin-bottom:16px">${warnI}<span>Sending is paused by ${AGENCY.name}.
  You can see everything as usual; your sequences resume when they restart them.</span></div>`:"";
/* headroom in days at the burn rate observed so far this cycle */
const burnDays=k=>{const m=compute(k),perDay=m.used/CYCLE.day;
  return perDay>0?m.free/perDay:Infinity};
const runsOut=()=>RK.filter(k=>RES[k].nature!=="Storage")
  .map(k=>({k,d:burnDays(k)})).sort((a,b)=>a.d-b.d)[0];
const onDay=d=>{const n=CYCLE.day+Math.floor(d);
  return n>CYCLE.days?"after the cycle resets":n+" Sep"};
const ageDays=t=>{const m=/(\d+)\s*day/.exec(t||"");if(m)return +m[1];
  return /yesterday/.test(t||"")?1:0};
const myCaps=k=>myClients().reduce((t,c)=>t+((RES[k].rows[c.id]||{cap:0}).cap),0);
const medianCPP=()=>{const v=myClients().map(costPer).filter(x=>x!=null).sort((a,b)=>a-b);
  if(!v.length)return null;const h=v.length>>1;
  return v.length%2?v[h]:(v[h-1]+v[h])/2};

/* what an owner has to decide, ordered by what it costs to leave alone */
function dashItems(){
 const out=[];
 RK.forEach(k=>{const m=compute(k);
  fundedWorkspaces().forEach(c=>{const st=rowState(k,c.id,m);
   if(st.room===0&&!REQUESTS.some(r=>r.client===c.id&&r.res===k))
    out.push({score:90,sev:"critical",client:c.id,raise:k+"|"+c.id,act:"Raise limit",age:"today",
      what:c.name+" is at its "+RES[k].label.toLowerCase()+" limit and has stopped",
      why:f(m.free)+" "+RES[k].unit+" sit unallocated in the pool. Only you can raise this."})})});
 REQUESTS.filter(r=>myClientsForLimits().some(c=>c.id===r.client)).forEach(r=>{const m=compute(r.res);
  out.push({score:80,sev:"decision",client:r.client,req:r.id,act:"Approve",age:r.when,
    what:byId[r.client].name+" asked for "+f(r.amount)+" more "+RES[r.res].label.replace(/^Monthly |^Active /,"").toLowerCase(),
    why:r.note+" Approving leaves "+f(Math.max(0,m.free-r.amount))+" in the pool."})});
 /* operator work escalates here once it has aged. A disconnected mailbox is not
    the owner's job until nobody has done it for two days, at which point it is. */
 INFRA().filter(a=>a.client==="__x"||ageDays(a.age)>=2).forEach(a=>{
  const cross=a.client==="__x", c=cross?null:byId[a.client];
  out.push({score:cross?35:a.sev==="critical"?85:a.kind==="Bounce rate rising"?75:50,sev:a.sev,age:a.age,act:a.act,
    client:c?c.id:null, collision:cross,
    what:cross?a.kind:a.kind+" on "+c.name+", unresolved for "+a.age,
    why:a.kind==="Bounce rate rising"
        ?a.detail+". Every client sending from this domain pool is exposed, not only this one."
      :a.kind==="Email account disconnected"
        ?a.detail+". Volume the client is paying for is not going out."
      :a.detail+"."})});
 /* a link request nobody has approved is stalled onboarding, and only the agency
    can chase it. The client cannot approve something they were never told about. */
 myClients().filter(isPending).forEach(c=>out.push({score:70,sev:"decision",client:c.id,act:"Open",
   age:c.link.requested, what:c.name+" has not approved the workspace link yet",
   why:"Requested "+AGE(c.link.requested)+" from "+c.link.owner+". Nothing moves until they accept, and they may not have seen it."}));
 /* a client going quiet, which is what churn looks like before the email arrives */
 myClients().forEach(c=>{if(c.prev&&c.reply&&c.reply<c.prev*0.75)
  out.push({score:65,sev:"warning",client:c.id,act:"Open",age:"this cycle",
    what:c.name+" reply rate fell from "+c.prev.toFixed(1)+"% to "+c.reply.toFixed(1)+"%",
    why:"Down "+Math.round((1-c.reply/c.prev)*100)+"% this cycle. Nothing in the product will tell them, and nothing will tell you again."})});
 return out.sort((a,b)=>b.score-a.score);
}

/* the reason a client is pinned to the top of zone 3, or null */
/* 21 Sep 2026, delight pass: "At limit" is a moment, not a permanent state, so
   the chip says when it happened. Seeded from the request that asked about
   the same resource, when one exists, since that is the same event; a fresh
   limit with no matching request is dated to today. Session-lived, like
   DECIDED, so a page reload starts the clock over. */
const AT_LIMIT_SINCE={};
function atLimitSince(c,k){
 if(!AT_LIMIT_SINCE[c.id]){const r=REQUESTS.find(x=>x.client===c.id&&x.res===k);
   AT_LIMIT_SINCE[c.id]=r?r.when:"today"}
 return AT_LIMIT_SINCE[c.id]}
function attention(c){
 /* a disabled client outranks everything else that could be said about it.
    Nothing it does matters until it is re-enabled, and the row has to say so
    or the agency thinks sending stopped when it did not. */
 if(c.disabled) return{rank:-1,pin:true,chip:"Disabled",tone:"c-bad",
   why:"Sending is stopped and nothing goes out. Re-enable to start again. Nothing has been lost."};
 const m=medianCPP(), cp=costPer(c);
 const lim=funded(c)?RK.map(k=>({k,st:rowState(k,c.id,compute(k))})).filter(x=>x.st.room===0):[];
 if(lim.length) return{rank:0,pin:true,chip:"At limit since "+atLimitSince(c,lim[0].k),tone:"c-bad",
   why:RES[lim[0].k].label+" is exhausted. Sending and sourcing stop until you raise it."};
 /* a quarter down and at least a point down. Without the floor a move from
    1.2 to 0.8 flags, and at forty clients a third of the book is "Falling". */
 if(c.prev&&c.reply&&c.reply<c.prev*0.75&&c.prev-c.reply>=1) return{rank:1,pin:true,chip:"Falling",tone:"c-warn",
   why:"Reply rate down from "+c.prev.toFixed(1)+"% last cycle. Worth a call before they ask for one."};
 if(cp!=null&&m&&cp>m*2) return canI("billing")
   ?{rank:2,pin:true,chip:"Costly",tone:"c-warn",
     why:"Costs "+(cp/m).toFixed(1)+"x the median per positive reply. Priced right, or served wrong?"}
   :{rank:2,pin:true,chip:"Low yield",tone:"c-warn",
     why:f(positives(c))+" positive replies from "+f(c.sent)+" sent."};
 /* a brand new client is a lifecycle state, not a decision, so it carries a chip
    but does not jump the queue above a client that is actually running */
 if(c.sent===0) return{rank:9,pin:false,chip:"Not started",tone:"c-mute",
   why:(4-doneN(c))+" of 4 setup steps remain, so nothing has been sent for them yet."};
 return null;
}

/* ═══ A0 Home, the agency's landing screen ═══════════════════════════════════
   Card grid, not stacked tables. Layout follows the references Hitesh supplied:
   a KPI row with the delta chip top-right and an explicit "Compare N (last
   month)" line, a chart card with a legend and a highlighted point, a table card
   with counted tab pills, and a right rail of priority items with "See all".

   Styling stays inside the Saleshandy design system: Blue 700, Inter, 4px radius,
   12px/600 #4B5563 headers, 32px controls. The richness comes from layout and
   charts, not from inventing a rounder, softer visual language.

   The one rule that did not change: no blended rate across unrelated clients.
   Counts, money, pacing and per-client comparisons are all legitimate as tiles
   and charts, so adopting the card form costs nothing. There is still no single
   reply rate on this screen.                                                    */

/* last cycle, for the comparison line on each tile */
let LAST={clients:4, sent:98400, touches:133400, replies:6900};
const DASH_ROWS=8;   /* the dashboard ranks; the full list lives in Clients */
/* cumulative daily sends, days 1..9 of the cycle, summing to the 124,600 in RES */
const DAILY=[4200,6800,9500,12800,15600,17200,18400,19100,21000];

const myUsed=kk=>myClients().reduce((t,c)=>t+((RES[kk].rows[c.id]||{used:0}).used),0);
const abbr=n=>n>=1000?(n/1000).toFixed(n%1000&&n<10000?1:0).replace(/\.0$/,"")+"k":String(n);
/* ── outreach: volume across every channel, not just email ─────────────────
   A step in the product can be Email, LinkedIn (manual or automation), Call,
   WhatsApp or Task, so a column or a tile named after one channel undercounts a
   LinkedIn-led or call-led client and reads as if the agency did nothing.
   Email is c.sent rather than the sends pool, so the per-client column and the
   tile add up to the same number. A linked client on its own plan consumes no
   pool but its outreach is still real, and the pool is the plan chart's job. */
const chanOf=c=>CHAN[c.id]||{li:0,call:0,wa:0};
const outreachOf=c=>{const x=chanOf(c);return c.sent+x.li+x.call+x.wa};
const chanRow=c=>{const x=chanOf(c);
 return [[c.sent,"email"],[x.li,"LinkedIn"],[x.call,"call"],[x.wa,"WhatsApp"]].filter(y=>y[0]>0)};
const chanTitle=c=>chanRow(c).map(y=>f(y[0])+" "+y[1]).join(", ")||"Nothing sent yet";
const repOf=c=>Math.round(c.sent*c.reply/100);
const touches=()=>{
 const t=myClients().reduce((a,c)=>{const x=chanOf(c);
   return {email:a.email+c.sent,li:a.li+x.li,call:a.call+x.call,wa:a.wa+x.wa}},
   {email:0,li:0,call:0,wa:0});
 t.total=t.email+t.li+t.call+t.wa; return t};
const touchSplit=t=>[[t.email,"email"],[t.li,"LinkedIn"],[t.call,"call"],[t.wa,"WhatsApp"]]
  .filter(x=>x[0]>0).map(x=>abbr(x[0])+" "+x[1]).join(" · ") || "Nothing sent yet";
const CHAN_COL={email:"var(--blue-11)",LinkedIn:"#0F766E",call:"var(--orange-14)",WhatsApp:"var(--green-16)"};
const touchBar=t=>{const p=[[t.email,"email"],[t.li,"LinkedIn"],[t.call,"call"],[t.wa,"WhatsApp"]].filter(x=>x[0]>0);
 if(!p.length) return "Nothing sent yet";
 const tot=p.reduce((a,b)=>a+b[0],0)||1;
 return '<span class="sbar">'+p.map(x=>'<i style="width:'+(x[0]/tot*100).toFixed(1)
    +'%;background:'+CHAN_COL[x[1]]+'" title="'+x[1]+' '+f(x[0])+'"></i>').join("")+'</span>'
  +'<span class="lgd">'+p.map(x=>'<span><i style="background:'+CHAN_COL[x[1]]+'"></i>'+x[1]+'</span>').join("")+'</span>'};
const pctDelta=(now,then)=>then?((now-then)/then*100):null;
function deltaChip(d,invert,abs){
 if(d===null||!isFinite(d)) return "";
 const up=d>=0, good=invert?!up:up;
 const col=good?"var(--green-700)":"var(--red-600)";
 const bg=good?"var(--green-50)":"var(--red-50)";
 const arrow=up?"M6 3.5 9.5 8h-7z":"M6 8.5 2.5 4h7z";
 const txt=abs!==undefined?(up?"+":"")+abs:(up?"+":"")+d.toFixed(d>=10||d<=-10?0:1)+"%";
 return '<span class="dchip" style="color:'+col+';background:'+bg+'">'
  +'<svg viewBox="0 0 12 12" aria-hidden="true"><path fill="currentColor" d="'+arrow+'"/></svg>'
  +txt+'</span>'}

/* No icon. An icon here was decoration competing with the delta chip for the
   same corner, and it left the card ragged. The subheading instead gets its own
   band: a rule, a tint, the full card width. It is the half of the card that
   carries the comparison and the channel mix, so it stops being a third grey
   line under the number. The band is pushed to the bottom so that cards of
   different content height still line their footers up across the row. */
/* the grouped Home card: one container, three identical tiles, and the channel
   mix as a strip across the base rather than inside the Outreach tile. Putting
   the breakdown in a tile made that tile heavier than its neighbours, which is
   the whole reason the row read as three unrelated components. The tiles keep a
   "was N" line so the baseline survives the loss of the per-card bar. */
function kpiTile(label,icon,value,delta,base,invert,abs){
 return '<div class="ktile">'
  +'<div class="ktile-h"><span class="ktico">'+icon+'</span><span class="ktl">'+label+'</span></div>'
  +'<div class="ktile-v"><span class="ktv">'+value+'</span>'+(delta===null?"":deltaChip(delta,invert,abs))+'</div>'
  +'<div class="ktile-b">'+base+'</div></div>'}
function kpiGroup(title,tiles,footLabel,foot){
 return '<div class="card kgrp">'
  +'<div class="kgrp-h"><span class="kgrp-t">'+title+'</span></div>'
  +'<div class="kgrp-b"><div class="ktiles">'+tiles+'</div></div>'
  +(foot?'<div class="kgrp-f"><span class="kgrp-fl">'+footLabel+'</span>'+foot+'</div>':"")
  +'</div>'}

function kpi(label,value,delta,compare,invert,abs){
 return '<div class="card kpi">'
  +'<div class="kpi-t"><span class="kpi-l">'+label+'</span>'+(delta===null?"":deltaChip(delta,invert,abs))+'</div>'
  +'<div class="kpi-v">'+value+'</div>'
  +'<div class="kpi-c">'+compare+'</div></div>'}

/* ── cumulative sends against the straight-line plan budget ─────────────────── */
function planChart(compact,H0){
 const R=RES.sends, pool=R.pool, W=640, H=H0||(compact?150:196), L=46, T=22, B=34, Rr=14;
 const px=d=>L+(d-1)/(CYCLE.days-1)*(W-L-Rr);
 const py=v=>H-B-(v/pool)*(H-T-B);
 let run=0; const pts=DAILY.map((v,i)=>{run+=v;return[px(i+1),py(run),run,i+1]});
 const last=pts[pts.length-1];
 const line=pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
 const area="M"+px(1).toFixed(1)+","+py(0).toFixed(1)+" L"+line.replace(/ /g," L")
   +" L"+last[0].toFixed(1)+","+py(0).toFixed(1)+" Z";
 const grid=[0,1/3,2/3,1].map(fr=>{const y=py(pool*fr);
   return '<line x1="'+L+'" x2="'+(W-Rr)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="var(--line-soft)"/>'
    +'<text x="'+(L-8)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end" class="ax">'+(fr?abbr(pool*fr):"0")+'</text>'}).join("");
 const xlab=[1,8,15,22,30].map(d=>'<text x="'+px(d).toFixed(1)+'" y="'+(H-12)+'" text-anchor="middle" class="ax">'+d+' Sep</text>').join("");
 /* callout on the last real day, the reference puts the value in a chip on the line */
 const cw=64, cx=Math.min(W-Rr-cw, last[0]-cw/2), cy=last[1]-30;
 return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMinYMid meet" class="chart" role="img" aria-label="Cumulative emails sent against plan pace">'
  +'<defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">'
   +'<stop offset="0" stop-color="#1D4ED8" stop-opacity=".18"/>'
   +'<stop offset="1" stop-color="#1D4ED8" stop-opacity="0"/></linearGradient></defs>'
  +grid+xlab
  +'<path d="'+area+'" fill="url(#ag)"/>'
  +'<line x1="'+px(1)+'" y1="'+py(pool/CYCLE.days)+'" x2="'+px(CYCLE.days)+'" y2="'+py(pool)+'" '
   +'stroke="var(--gray-400)" stroke-width="1.5" stroke-dasharray="5 4"/>'
  +'<polyline points="'+line+'" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linejoin="round"/>'
  +'<line x1="'+last[0].toFixed(1)+'" y1="'+T+'" x2="'+last[0].toFixed(1)+'" y2="'+py(0)+'" stroke="var(--gray-300)" stroke-dasharray="3 3"/>'
  +'<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="4.5" fill="#1D4ED8" stroke="#fff" stroke-width="2"/>'
  +'<rect x="'+cx.toFixed(1)+'" y="'+cy.toFixed(1)+'" width="'+cw+'" height="20" rx="3" fill="var(--gray-800)"/>'
  +'<text x="'+(cx+cw/2).toFixed(1)+'" y="'+(cy+14).toFixed(1)+'" text-anchor="middle" class="cal">'+f(last[2])+'</text>'
  +'</svg>'}

/* ── radial gauge, the "Repeat Customer Rate" pattern from the reference ────── */
function gauge(pct,big,sub){
 const W=210,H=126,cx=W/2,cy=H-14,r=76,N=44;
 const on=Math.round(N*Math.min(1,pct/100));
 let t="";
 for(let i=0;i<N;i++){
  const a=Math.PI-(i/(N-1))*Math.PI, x1=cx+Math.cos(a)*(r-13), y1=cy-Math.sin(a)*(r-13);
  const x2=cx+Math.cos(a)*r, y2=cy-Math.sin(a)*r;
  const c=i<on?(pct>=90?"#DC2626":pct>=75?"#D97706":"#1D4ED8"):"var(--gray-200)";
  t+='<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)
   +'" stroke="'+c+'" stroke-width="3" stroke-linecap="round"/>'}
 return '<svg viewBox="0 0 '+W+' '+H+'" class="gauge" role="img" aria-label="'+big+' '+sub+'">'+t
  +'<text x="'+cx+'" y="'+(cy-16)+'" text-anchor="middle" class="gv">'+big+'</text>'
  +'<text x="'+cx+'" y="'+(cy+2)+'" text-anchor="middle" class="gs">'+sub+'</text></svg>'}

/* ── labelled coloured bars, the nested "Customers" card pattern ───────────── */
function segbars(rows){
 return '<div class="segs">'+rows.map(r=>'<div class="seg">'
  +'<div class="seg-t"><span class="dot" style="background:'+r.c+'"></span>'
   +'<span class="seg-l">'+r.l+'</span><span class="seg-v tnum">'+r.v+'</span></div>'
  +'<div class="seg-b"><span style="width:'+Math.min(100,r.p).toFixed(0)+'%;background:'+r.c+'"></span></div>'
  +'</div>').join("")+'</div>'}

/* ── horizontal comparison, per client. Never a blend ──────────────────────── */
function byClient(){
 const rows=[...myClients()].sort((a,b)=>positives(b)-positives(a));
 const max=Math.max(1,...rows.map(positives));
 return rows.map(c=>{const v=positives(c);
  return '<div class="hb"><span class="hb-l">'+c.name+'</span>'
   +'<span class="hb-t"><span style="width:'+(v/max*100).toFixed(0)+'%;background:'+c.colour+'"></span></span>'
   +'<span class="hb-v tnum">'+(v?f(v):"0")+'</span></div>'}).join("")}

/* ── the right rail: priority items with a progress ring and See all ───────── */
function ring(done,total,tone){
 const r=9,c=2*Math.PI*r,p=total?done/total:0;
 return '<svg viewBox="0 0 24 24" class="ring" aria-hidden="true">'
  +'<circle cx="12" cy="12" r="'+r+'" fill="none" stroke="var(--gray-200)" stroke-width="2.5"/>'
  +'<circle cx="12" cy="12" r="'+r+'" fill="none" stroke="'+tone+'" stroke-width="2.5" stroke-linecap="round"'
  +' stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+(c*(1-p)).toFixed(1)+'" transform="rotate(-90 12 12)"/></svg>'}

 ["hook","Webhook","company","W","Per workspace, and the payload gains a workspace id. A webhook that fires for every client's events cannot be handed to one client."],
 ["api","API Key","company","W only",

 ["ctd","Custom Tracking Domain","company","A pool &rarr; W",

 ["wl","Whitelabel","agency","A",

 ["bill","Billing &amp; Subscription","agency","A + W alloc",

   switcher answers "whose data am I in", and "everyone's at once" is not an

 const names=listAnd(myClients().map(c=>c.name));
 const sub=isOwnerP(ME())?"":"Your "+Q.length+" item"+(Q.length===1?"":"s")+" across "+names+(/[.!?]$/.test(names)?"":".");
 return `<div class="toolbar">

/* ═══ A2, connect path: link an existing client workspace ════════════════════
   07 §5 "Linked": created by the client, funded by the client's own plan, owned
   by the client, access granted by the client approving the agency's request, and
   revocable by the client at any time. This was out of scope in 09 §6; Hitesh
   put it back in on 9 Sep 2026.

   The mechanic is two-party consent, which is the pattern Instantly ships and
   which 15 §5 verified: the agency sends a request naming a Workspace ID, the
   target workspace's owner accepts, and only then does it join. The agency can
   never claim a workspace unilaterally, and that asymmetry is the whole reason
   this mode is safe to offer.

   Creating a client is 3 steps. Connecting one is 1, and that is the point:
   onboarding becomes Connect rather than Rebuild.                              */

function connectBody(){
 const stays=[

  ["You do not fund it","They keep their own plan and their own invoice. It draws nothing from your pool and has no limits you can set"],

}

function linkRequest(){

 const c={id,name:(nc.name||wsid).trim(),company:(nc.name||wsid).trim(),email:nc.email||"owner@"+id+".example",
  colour:pal[CLIENTS.length%pal.length],mode:"linked",
  link:{state:"pending",requestedBy:"Alex Meridian",wsid,requested:"just now",owner:nc.email||"the workspace owner"},
  seq:0,mbx:0,prospects:0,sent:0,reply:0,prev:0,pos:0,created:"09 Sep, 2026",permission:"No Access",
  users:[],mailboxes:[]};
 CLIENTS.push(c); byId[id]=c;
 nc=NC_INIT();
 drawer=null; renderDrawer(); view={name:"clients"}; ctx="agency"; render();

/* Reports for the client: four numbers and fourteen days. Daily sends are
   derived from the workspace's cycle total the same way the mailbox counts are,
   so the chart agrees with the tiles and the tiles agree with the client list.
   Meetings are a fixture ratio on positive replies; the product records them as
   an outcome, this prototype does not carry per-thread outcomes. */
const MEETING_RATE=0.42;
const meetings=c=>Math.round(positives(c)*MEETING_RATE);
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function dailySeries(c,n){
 const perDay=c.sent/Math.max(1,CYCLE.day), out=[];
 for(let i=0;i<n;i++){
  const d=new Date(2026,8,CYCLE.day-(n-1-i)), dow=d.getDay();
  const h=((c.id.charCodeAt(0)*31+c.id.charCodeAt(1)*17+i*13)%23)/23;   /* deterministic jitter */
  const wk=(dow===0||dow===6)?0.12:1;
  const sent=Math.round(perDay*wk*(0.8+0.4*h));
  const rep=Math.round(sent*c.reply/100*(0.7+0.6*((h*7)%1)));
  out.push({d,sent,rep});
 }
 return out;
}
function reportChart(c){
 /* 17 Sep 2026, round 2: a 640-wide viewBox scaled to a 1300px panel made this
    chart 480px tall. Drawn wide it keeps its shape at about 200px. */

 const iw=(W-L-Rr)/S.length, bw=Math.min(22,iw*.55);
 const py=v=>T+(H-T-B)*(1-v/maxS), pr=v=>T+(H-T-B)*(1-v/maxR), px=i=>L+iw*i+iw/2;
 const grid=[0,.5,1].map(fr=>{const y=py(maxS*fr);
   return '<line x1="'+L+'" x2="'+(W-Rr)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="var(--line-soft)"/>'

     const why=(L.querySelector("#reqWhy").value||"").trim();
     if(!amt||!why){L.querySelector("#reqErr").hidden=false;return}
     if(!REQUESTS.some(r=>r.client===id&&r.res===modal.res))
       REQUESTS.push({id:"r"+Date.now().toString(36).slice(-4),client:id,res:modal.res,
         amount:amt,note:why,when:"just now"});
     modal=null;renderModal();render();return;
   }
   /* revoke is the mirror of unlink, initiated by the client. Same data
      outcome, and the agency simply loses the workspace.                    */
   if(modal.kind==="rollback"){modal=null;renderModal();render();return}
   if(modal.kind==="c0report"){const j=CLIENTS.findIndex(x=>x.id===id);
     if(j>-1)CLIENTS.splice(j,1); delete byId[id];
     ctx="agency"; solo=false; view={name:"clients"};
     modal=null;renderModal();render();return}
   if(modal.kind==="revoke"){const i=CLIENTS.findIndex(x=>x.id===id);if(i>-1)CLIENTS.splice(i,1);
     REQUESTS=REQUESTS.filter(r=>r.client!==id);
     delete byId[id].mode; byId[id].revoked=true;
     receipt(solo?"solo:settings":"client:"+id,`${AGENCY.name} no longer has access. Nothing else changed.`,null);
     modal=null;renderModal();render();return;
   }
   if(modal.kind==="delete"){const i=CLIENTS.findIndex(x=>x.id===id);if(i>-1)CLIENTS.splice(i,1);
     delete byId[id];
     RK.forEach(k=>delete RES[k].rows[id]);
     REQUESTS=REQUESTS.filter(r=>r.client!==id);
     view={name:"clients"};}
   /* unlinking removes the agency's access. It destroys nothing, because none of
      it was the agency's to destroy. */
   else if(modal.kind==="unlink"){const i=CLIENTS.findIndex(x=>x.id===id);if(i>-1)CLIENTS.splice(i,1);
     delete byId[id]; view={name:"clients"};}
   else {byId[id].disabled=true;}
   modal=null;renderModal();render();
 };

function resetToNormal(){

if(location.hash==="#setup"){resetToNormal();setupDone=false;ctx="own";inMod="sequences";view={name:"clients"}}

 setTimeout(()=>{startXform()},60)}
/* where the sequence leaves you: inside the new client's empty workspace */

 setTimeout(()=>{nc=NC_INIT();nc.name="Northwind Logistics";nc.company="Northwind Logistics Ltd";
   nc.email="ops@northwind.co";create()},60)}

const PAGE={}; let cliQ="", estQ="", estHealth="all";

const pager=(id,total,size,what)=>{const g=pageOf(id,total,size); if(total<=size) return "";
 return `<div class="pager"><span class="sub">Showing ${f(g.from+1)} to ${f(g.to)} of ${f(total)} ${what}</span>
  <span class="tools"><button class="shd-button shd-button--tertiary shd-button--sm" data-page="${id}|${g.p-1}" ${g.p<=1?"disabled":""}>Previous</button>

/* re-rendering on every keystroke would drop the caret, so put it back */
const bindSearch=(id,set)=>{const i=el(id);if(!i)return;i.oninput=()=>{set(i.value);render();const j=el(id);if(j){j.focus();j.setSelectionRange(j.value.length,j.value.length)}}};

/* ═══ the thread panel: reply from the roll-up without leaving it ════════════ */
function threadHTML(){
 if(!openThread) return "";
 const r=REPLIES.find(x=>x.id===openThread); if(!r) return "";
 const c=byId[r.client]; if(!c) return "";
 const mbx=(c.mailboxes.find(m=>m[1]==="Healthy")||c.mailboxes[0]||["their mailbox"])[0];
 const seqName=(c.sequences&&c.sequences[0]&&c.sequences[0].name)||"their sequence";
 const list=REPLIES.filter(x=>!x.replied&&x.id!==r.id&&myClientsFor("inbox").some(k=>k.id===x.client));
 const next=list[0];
 const first=r.from.split(/[ ,]/)[0];
 return `<aside class="thread" role="dialog" aria-label="Reply to ${r.from}">
  <div class="thread-h"><div class="cell-main">${av(c,28)}<span style="min-width:0">
    <span class="semibold-3" style="display:block">${r.from}</span>
    <span class="cs">${c.name} &middot; replying from ${mbx}</span></span></div>
   <button class="ubtn" data-threadclose aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="thread-b">
   <div class="tmsg tmsg-out"><span class="cs">${AGENCY.name} for ${c.name} &middot; ${seqName}, step 2 &middot; 3 days ago</span>
    <p>Hi ${first}, following up on my note last week. Worth fifteen minutes to see whether this fits how ${c.name.split(" ")[0]}'s buyers work?</p></div>
   <div class="tmsg tmsg-in"><span class="cs">${r.from} &middot; ${AGE(r.age)}</span><p>${r.snippet}.</p>
    ${r.positive?'<span class="chip c-ok">Interested</span>':'<span class="chip c-mute">Reply</span>'}</div>
   ${r.replied?`<div class="tmsg tmsg-out is-sent"><span class="cs">You, for ${c.name} &middot; just now</span><p>${r.replied}</p></div>`:""}
  </div>
  <div class="thread-f">
   ${r.replied
     ?`<div class="msg m-ok" style="margin:0 0 12px">${infoI}<span>Sent from <strong>${mbx}</strong> and stored in <strong>${c.name}</strong>'s workspace. You never left this list.</span></div>`
     :`<textarea id="threadTxt" aria-label="Your reply" placeholder="Reply as ${c.name}, from ${mbx}">Thanks ${first}, </textarea>`}
   <div class="tools" style="justify-content:space-between;flex-wrap:wrap;gap:10px">
    <span class="sub">${r.replied?"":`Lands in <strong>${c.name}</strong>'s workspace. You stay here.`}</span>
    <span class="tools">
     ${r.replied?"":`<button class="shd-button shd-button--primary" data-threadsend="${r.id}">Send reply</button>`}
     ${next?`<button class="shd-button shd-button--tertiary" data-threadnext="${next.id}">Next reply</button>`:""}
     <button class="linkbtn" data-threadopen="${r.id}">Open in ${c.name}</button></span></div>
  </div></aside>`;
}
function renderThread(){
 const T=el("thread"); if(!T) return;
 T.innerHTML=threadHTML();
 T.querySelectorAll("[data-threadclose]").forEach(b=>b.onclick=()=>{openThread=null;renderThread()});
 T.querySelectorAll("[data-threadsend]").forEach(b=>b.onclick=()=>{const r=REPLIES.find(x=>x.id===b.dataset.threadsend);
   const t=el("threadTxt"); r.replied=(t&&t.value.trim())||"Thanks, will follow up."; r.repliedIn=r.client; render()});
 T.querySelectorAll("[data-threadnext]").forEach(b=>b.onclick=()=>{openThread=b.dataset.threadnext;renderThread()});
 T.querySelectorAll("[data-threadopen]").forEach(b=>b.onclick=()=>{const r=REPLIES.find(x=>x.id===b.dataset.threadopen);
   openThread=null;ctx=r.client;asClient=false;inMod="inbox";openProspect=null;render()});

/* ═══ scale: the forty-client state ═══════════════════════════════════════════
   30 §1.4: "show scale, or state the ceiling". Seven clients is a demo; the
   agencies this is for run twenty to sixty. `scaleTo(40)` appends synthetic
   clients built the same way as the fixtures (mailboxes derived from sends,
   sequences summing to the headline totals, a limit row per resource), so
   every list, table, popover and roll-up can be rendered at the size it will
   actually be used at. Reachable with #scale=40. Nothing else changes. */
const SCALE={n:0};
const SCALE_NAMES=["Ashgrove Dental","Beacon Freight","Cobalt Works","Dunmore Capital","Elmstead Clinics","Fairhaven Legal",
 "Granite Peak Software","Halcyon Robotics","Ironbridge Steel","Juniper Analytics","Kestrel Aviation","Larkspur Media",
 "Marlow Property","Nimbus Cloud","Oakridge Schools","Pennant Insurance","Quarry Lane Foods","Rosewood Care",
 "Saltmarsh Energy","Tamar Logistics","Umber Studios","Verity Payments","Westbrook Motors","Xenon Labs","Yarrow Health",
 "Zephyr Travel","Alder Consulting","Brackenfield Farms","Corwen Textiles","Dovetail Furniture","Ember Security",
 "Fenwick Books","Glasswater Marine","Hollins Recruitment","Isley Architects","Jarrow Tools","Kelso Optics"];
function scaleTo(n){
 const r=rng("scale");
 const pal=["#B45309","#0F766E","#C2410C","#6D28D9","#0E7490","#9333EA","#4B5563","#BE185D","#1D4ED8","#047857","#B91C1C","#7C3AED"];
 let i=0;
 while(CLIENTS.length<n&&i<SCALE_NAMES.length){
  const name=SCALE_NAMES[i++], id="s"+String(i).padStart(2,"0");
  if(byId[id]) continue;
  const slug=name.toLowerCase().replace(/[^a-z]+/g,"-").replace(/^-|-$/g,"");
  const sent=Math.round((1500+r()*14000)/100)*100, seq=1+Math.floor(r()*6);
  const c={id,name,company:name+" Ltd",email:"hello@"+slug+".com",colour:pal[i%pal.length],
   seq,mbx:Math.max(2,Math.round(sent/CYCLE.day/85)),prospects:Math.round(sent*0.2/10)*10,sent,
   reply:0,prev:0,pos:+(0.5+r()*3).toFixed(1),
   created:(1+Math.floor(r()*28))+" Aug, 2026",limitsReviewed:r()<.8,
   permission:r()<.3?"Limited Access":"Full Access",users:[["hello@"+slug+".com","Full Access"]],mailboxes:[],synthetic:true};
  /* last cycle's rate moves with this cycle's, as it does in life; independent
     draws made half the book "Falling" and the flag meaningless */
  c.reply=+(2+r()*7).toFixed(1); c.prev=+(c.reply*(0.7+0.8*r())).toFixed(1);
  SEND_DOMAINS[id]=[slug+".com",slug+"-go.com",slug+"-reach.com"]; SEQ_SETS[id]=[];
  RK.forEach(k=>{const cap=k==="sends"?Math.round(sent*1.2/500)*500
    :k==="prospects"?Math.round(c.prospects*1.3/500)*500:500*(1+Math.floor(r()*4));
    RES[k].rows[id]={res:0,cap,used:Math.min(cap,Math.round(cap*(0.2+r()*0.75)))}});
  growMailboxes(c); growSequences(c);
  const pre=ACCESS_PRESETS[c.permission==="Limited Access"?"Read everything":"Reply and run"];
  c.access={mods:pre.mods.slice(),verbs:pre.verbs.slice()};
  CLIENTS.push(c); byId[id]=c;
  if(r()<.5){PEOPLE.priya.ws[id]="Everything"}
  if(r()<.25){PEOPLE.sam.ws[id]="Reporting"}
 }
 LAST.clients=Math.max(LAST.clients,CLIENTS.length-2);
 SCALE.n=CLIENTS.length;
}

/* Deep links, so any screen can be opened and checked without clicking a path
   to it: #clients, #queue, #dash, #credits, #settings, #invite, and
   #client=<id> for a client record. Unknown hashes are ignored.            */
/* the client's own account, with the agency's request waiting. Redmere Studio

if(location.hash==="#solo"){const c=CLIENTS.find(isPending)||byId.rm;

{const h=decodeURIComponent(location.hash.replace(/^#/,""));
 const [k,v]=h.split("=");
 if(k==="scale"){scaleTo(+v||40);view={name:"dash"}}

   Object.fromEntries(Object.keys(MASTER_MOD).map(x=>[x,1])));
 if(flat[k]&&(k!=="dash"||canI("dashboard"))) view={name:k};
 /* #seq, #crm, #leads and the rest used to mean "the agency's own X" inside the
    master workspace. They still mean that; the workspace is just a real one now. */
 if(AGY_MOD[k]&&!MASTER_MOD[k]){ctx="own";asClient=false;inMod=RAIL2MOD[k]||k;view={name:"clients"}}
 if(k==="client"&&byId[v]) view={name:"record",id:v};
 /* the client's own side, and the create modal, are otherwise several clicks
    in. #asclient=hv is a linked client, so it shows Revoke; #asclient=al is
    at a limit, so it shows Request more.                                   */
 if(k==="asclient"&&byId[v]){ctx=v;asClient=true;cView="workspace"}
 if(k==="addclient"){view={name:"clients"};setTimeout(openAddClient,0)}}
render();
