/* ═══ A8 Add a member, one screen ═════════════════════════════════════════════
   Ported 16 Sep 2026 from add-member-flow.html, which replaced the four-step
   wizard at Hitesh's direction. Person, workspaces and access are three
   sections of one form; there is no review step because nothing is hidden and
   the footer carries the whole grant. Only the furniture this screen needs is
   below: the presets, the card grid, the switches and the chips are the ones
   A4 Access already ships, unchanged, which is the point of the merge.       */
/* width:100% is load-bearing. .wrap is a column flexbox, and auto side margins
   on a flex item switch off cross-axis stretch, so without it the panel sizes
   to its own content and visibly changes width between Agency user and Client
   user, whose sections are different lengths. Found in review 16 Sep. */
.am-wrap{width:100%;max-width:1248px;margin:0 auto;
 display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;align-items:start}
/* the rail is not a wizard. Nothing here is gated behind it and every section
   is on the page already; it says where you are, what each section currently
   holds, and jumps to one. It lives in the gutter the centred panel was
   leaving empty, which is the whole reason it exists. */
.am-wrap.solo{grid-template-columns:minmax(0,1fr);max-width:1180px} /* 17 Sep 2026: no longer used by the Access tab, which was the one full-width tab rendered 1180px centred */
.am-rail{position:sticky;top:12px;display:flex;flex-direction:column;gap:2px}
.am-rail-i{display:flex;gap:10px;padding:10px 12px;border-radius:var(--radius-control);
 background:none;border:0;font:inherit;text-align:left;width:100%;cursor:pointer;color:var(--gray-15)}
.am-rail-i:hover{background:var(--gray-16)}
.am-rail-i.is-now{background:var(--blue-17)}
.am-rail-n{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
 font-size:11px;font-weight:600;background:var(--gray-13);color:var(--gray-15)}
.am-rail-i.is-now .am-rail-n{background:var(--blue-11);color:#fff}
.am-rail-i.is-done .am-rail-n{background:var(--green-11);color:var(--green-12)}
.am-rail-t{font-size:13px;font-weight:600;line-height:18px;color:var(--gray-12);display:block}
.am-rail-i.is-now .am-rail-t{color:var(--blue-20)}
.am-rail-s{font-size:12px;line-height:17px;color:var(--gray-15);display:block}
.sec{border-top:1px solid var(--gray-13)}
.sec:first-of-type{border-top:0}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.sec-n{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;
 font-size:11px;font-weight:600;background:var(--gray-16);color:var(--gray-15)}
.sec-n.is-done{background:var(--green-11);color:var(--green-12)}
.sec-t{font-size:15px;line-height:22px;font-weight:600;color:var(--gray-17)}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.resting{border:1px dashed var(--gray-23);border-radius:var(--radius-control);
 padding:22px;text-align:center;font-size:13px;color:var(--gray-15);background:var(--gray-19)}
/* a consequential pick is a card with its consequence written on it, never a
   select the reader has to already understand. Used for the user type and,
   since 16 Sep, for the account role, which nobody could previously decode. */
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.choice{text-align:left;background:var(--gray-1);border:1px solid var(--gray-13);
 border-radius:var(--radius-surface);padding:14px 16px;cursor:pointer;font:inherit;
 display:flex;gap:12px;align-items:flex-start;transition:border-color .15s,box-shadow .15s}
.choice:hover{border-color:var(--gray-23)}
.choice[aria-checked="true"]{border-color:var(--blue-11);box-shadow:0 0 0 1px var(--blue-11)}
.choice .rdo{flex:none;width:16px;height:16px;border-radius:50%;margin-top:3px;
 border:1.5px solid var(--gray-23);background:var(--gray-1)}
.choice[aria-checked="true"] .rdo{border:5px solid var(--blue-11)}
.choice b{display:block;font-size:14px;font-weight:600;line-height:22px;color:var(--gray-17)}
.choice i{display:block;font-style:normal;font-size:12px;line-height:18px;color:var(--gray-15);margin-top:2px}
/* a role's powers, rendered from ACCOUNT_POWERS x CAN rather than written out,
   so a new power reaches the cards and the comparison table in one edit. */
.pwlist{display:block;margin-top:8px;padding-top:8px;border-top:1px solid var(--gray-13)}
.pw{display:flex;align-items:flex-start;gap:6px;font-size:12px;line-height:18px;margin-bottom:3px}
.pw svg{flex:none;margin-top:2.5px}
.pw.y{color:var(--gray-12)}.pw.y svg{color:var(--green-14)}
.pw.n{color:var(--gray-15)}.pw.n svg{color:var(--gray-11)}
.wsbox{border:1px solid var(--gray-13);border-radius:var(--radius-control);background:var(--gray-1);
 max-height:340px;overflow-y:auto}
.wsrow{display:flex;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--gray-16);cursor:pointer}
/* 18 Sep, delight pass */
.wsrow.st-own{box-shadow:inset 3px 0 0 var(--c,var(--blue-11))}
.st-say{font-size:13.5px;line-height:20px;color:var(--gray-12);padding:10px 12px;background:var(--gray-19);border-radius:var(--radius-control);margin:0 0 14px}
.st-say b{color:var(--gray-17);font-weight:600}
.st-gaps{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:8px}
.st-gapbar .linkbtn{white-space:nowrap}
td .st-gaps{margin-top:6px}
.rc-setup{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center;padding:10px 16px;margin-bottom:16px;border:1px solid var(--gray-13);border-radius:var(--radius-control);background:var(--gray-1);font-size:13px;line-height:18px;color:var(--gray-17)}
.rc-setup-t{font-weight:600;flex:none}
.rc-step{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.rc-step .tick{width:18px;height:18px;font-size:10px}
.rc-step.is-on{color:var(--gray-15)}
.rc-step i{font-style:normal;color:var(--gray-15);margin-left:6px;font-size:12px;font-variant-numeric:tabular-nums}
.rc-live{display:flex;align-items:center;gap:10px;padding:10px 14px;margin-bottom:16px;border-radius:var(--radius-control);background:var(--green-11);font-size:13px;line-height:18px;color:var(--gray-17)}
.rc-live>svg{width:14px;height:14px;flex:none;color:var(--green-14)}
.rc-live .dq-x{margin-left:auto;flex:none;width:24px;height:24px;color:var(--gray-12)}
.rc-live .dq-x svg{width:14px;height:14px}
.rc-hdrchip{cursor:pointer;font:inherit;font-size:12px;font-weight:500}
.rc-hdrchip:hover{filter:brightness(.97)}
.rc-limsay{padding-top:10px;padding-bottom:12px;border-top:1px solid var(--gray-13)}
.rc-limsay .nc-limsay{margin:0;font-size:13px;line-height:19px}
.rc-refused{margin:0 24px 12px}
tr.rc-open>td{border-bottom:0!important}
tr.rc-editrow>td{padding:0 16px 14px!important;background:var(--gray-1)}
.rc-edit{border:1px solid var(--gray-13);border-left:2px solid var(--blue-11);border-radius:6px;padding:12px 14px;background:#fff;max-width:920px}
.rc-edit-h{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
/* item 58, 28 Sep 2026: .rc-edit .nc-screens{margin-top:10px} deleted with
   .nc-screens itself above; this override had nothing left to override. */
.wsrow:last-child{border-bottom:0}
.wsrow:hover{background:var(--gray-19)}
.wsrow input{flex:none;width:16px;height:16px;accent-color:var(--blue-11);margin:0}
.wsrow .wsn{font-size:14px;font-weight:500;color:var(--gray-17);display:block}
.wsrow .wsc{font-size:12px;line-height:18px;color:var(--gray-15);display:block}
/* one tab per picked workspace, each carrying its own preset, so which ones
   differ is readable without opening any of them. This replaces the
   per-workspace step the wizard used. */
.wstabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:14px}
.wstab{display:flex;align-items:center;gap:8px;flex:none;max-width:230px;cursor:pointer;
 background:var(--gray-1);border:1px solid var(--gray-13);border-radius:var(--radius-control);
 padding:7px 12px 7px 8px;font:inherit;text-align:left}
.wstab:hover{border-color:var(--gray-23)}
.wstab.is-on{border-color:var(--blue-11);box-shadow:0 0 0 1px var(--blue-11);background:var(--blue-17)}
.wstab b{display:block;font-size:13px;font-weight:600;line-height:18px;color:var(--gray-17)}
.wstab i{display:block;font-style:normal;font-size:11px;line-height:16px;color:var(--gray-15)}
.wstab.is-empty i{color:var(--amber-700);font-weight:500}
.accbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
/* the footer is the review step, always on screen, so the grant is legible at
   the moment Send is pressed rather than one screen earlier. */
.am-foot{position:sticky;bottom:0;z-index:5;margin-top:20px;background:var(--gray-1);
 border:1px solid var(--gray-13);border-radius:var(--radius-control);padding:12px 16px;
 display:flex;flex-direction:column;gap:8px;box-shadow:0 -2px 8px rgba(31,41,55,.06)}
.am-footrow{display:flex;align-items:center;gap:12px}
.fsum{display:flex;align-items:center;gap:8px;min-width:0;font-size:13px;color:var(--gray-12);flex-wrap:wrap}
.fsum strong{color:var(--gray-17);font-weight:600}
/* coordinator feedback, round 6: the preview reads as its own line, full
   width, left-aligned and muted, never squeezed between Cancel and Send;
   the action row underneath keeps the original summary-left, buttons-right
   shape. Nothing here wraps, even for a longer sentence than the fixture
   produces. */
.am-preview{display:block;width:100%;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modal.wide{width:min(720px,94vw)}
.modal.wide .modal-b{max-height:min(66vh,560px);overflow-y:auto}
table.cmp td,table.cmp th{vertical-align:middle}
table.cmp tbody tr:last-child td{border-bottom:0}
table.cmp td:not(:first-child),table.cmp th:not(:first-child){width:88px}
@media(max-width:1100px){
 .am-wrap{grid-template-columns:minmax(0,1fr);gap:16px}
 .am-rail{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
 .am-rail-i{flex:none;width:auto;padding:8px 10px}
 .am-rail-s{display:none}
}
@media(max-width:880px){
 .c-h,.panel-h{flex-wrap:wrap} /* 17 Sep 2026, round 5: a title beside two rows of pills was being squeezed to nothing */
 .am-foot{flex-wrap:wrap;row-gap:10px}
 .fsum{width:100%;order:-1}
 .am-foot .sp{display:none}
 .am-foot .shd-button{flex:1}
 .wsrow{flex-wrap:wrap;row-gap:6px}
 .wsrow .chip{margin-left:42px}
 .wsbox{max-height:none}
}

/* ══ Version C: the transformation ═══════════════════════════════════════════
   Adding a first client converts the account to the workspace model. In the real
   product that is a round trip: the backend converts, then the new Home fetches.
   So this is not decoration over a known duration, it is the loading state for
   work of unknown length, and it has to stay honest while it waits.

   The first build did this with a skeleton card plus two coach marks afterwards.
   That failed on its own terms: a card flicking into a 28px avatar in 420ms
   reads as a glitch, and a tooltip pinned against the rail teaches nothing. This
   version makes the wait itself the explanation. The screen draws the model, one
   idea at a time, and there is no separate guide because the sequence is the
   guide.                                                                      */
.xs{position:fixed;inset:0;z-index:5000;background:var(--gray-1);
  display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
.xs-stage{width:100%;max-width:760px;display:flex;flex-direction:column;align-items:center;gap:28px}
/* the two workspace cards */
.xs-row{display:flex;align-items:stretch;justify-content:center;gap:0;width:100%;position:relative}
.xs-ws{flex:0 0 300px;max-width:300px;background:#fff;border:1px solid var(--gray-13);border-radius:10px;
  padding:16px;box-shadow:0 1px 2px rgba(31,41,55,.05);box-sizing:border-box;
  transition:flex-basis .6s cubic-bezier(.34,1.15,.5,1),max-width .6s cubic-bezier(.34,1.15,.5,1),
             opacity .45s ease,padding .6s ease,transform .6s cubic-bezier(.34,1.15,.5,1)}
.xs-ws .xs-nm{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:600;color:var(--gray-17);margin-bottom:12px}
.xs-ws .xs-av{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:600;color:#fff;flex:none}
.xs-i{display:flex;align-items:center;justify-content:space-between;font-size:13px;line-height:26px;color:var(--gray-11);
  opacity:0;transform:translateY(5px);transition:opacity .38s ease,transform .38s ease}
.xs-i b{font-weight:600;color:var(--gray-17);font-variant-numeric:tabular-nums}
.xs-on .xs-i{opacity:1;transform:none}
.xs-on .xs-i:nth-child(2){transition-delay:.05s}
.xs-on .xs-i:nth-child(3){transition-delay:.11s}
.xs-on .xs-i:nth-child(4){transition-delay:.17s}
.xs-on .xs-i:nth-child(5){transition-delay:.23s}
/* the second workspace arrives from the right */
/* nothing there at all, not merely invisible, so the first card is genuinely
   centred before the second exists and genuinely moves aside when it arrives */
.xs-new{opacity:0;flex-basis:0;max-width:0;padding-left:0;padding-right:0;border-width:0;overflow:hidden}
.xs-new.in{opacity:1;flex-basis:300px;max-width:300px;padding-left:16px;padding-right:16px;border-width:1px}
/* the divider, and what it means */
.xs-div{flex:0 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  opacity:0;overflow:hidden;transition:opacity .4s ease,flex-basis .6s cubic-bezier(.34,1.15,.5,1)}
.xs-div.in{opacity:1;flex:0 0 78px}
.xs-div .xs-line{width:1px;flex:1;background:linear-gradient(var(--gray-13),var(--gray-13));min-height:26px}
.xs-div .xs-lock{width:30px;height:30px;border-radius:50%;background:var(--gray-2);border:1px solid var(--gray-13);
  display:grid;place-items:center;flex:none}
/* the account bar that appears above both */
.xs-top{width:100%;max-width:678px;background:#fff;border:1px solid var(--gray-13);border-radius:10px;padding:12px 16px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  opacity:0;transform:translateY(-8px);transition:opacity .45s ease,transform .45s cubic-bezier(.34,1.2,.5,1)}
.xs-top.in{opacity:1;transform:none}
.xs-top .xs-chip{font-size:12px;font-weight:500;color:var(--blue-11);background:var(--blue-19,#eff6ff);
  border-radius:20px;padding:3px 10px}
/* the caption, one idea at a time */
.xs-cap{min-height:52px;text-align:center;max-width:600px}
.xs-cap h3{font-size:18px;line-height:26px;font-weight:600;color:var(--gray-17);margin:0 0 4px}
.xs-cap p{font-size:14px;line-height:21px;color:var(--gray-11);margin:0}
.xs-cap .xs-t{animation:xsCap .42s cubic-bezier(.4,0,.2,1) both}
@keyframes xsCap{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
/* progress: which idea we are on, and that work is still happening */
.xs-foot{display:flex;flex-direction:column;align-items:center;gap:24px;min-height:34px}
/* item 61, 28 Sep 2026: .xs-pips/.xs-pip* deleted, unemitted - plain dots for
   the beat count, replaced by the labelled steps .xs-steps renders instead. */
.xs-steps{padding:0}
.xs-wait{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--gray-11)}
.xs-spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--gray-13);border-top-color:var(--blue-11);
  animation:xsSpin .7s linear infinite}
@keyframes xsSpin{to{transform:rotate(360deg)}}
@media (max-width:760px){
  .xs-row{flex-direction:column;align-items:center;gap:0}
  .xs-ws{flex:0 0 auto;width:100%;max-width:320px}
  .xs-new{max-width:0;height:0;padding-top:0;padding-bottom:0}
  .xs-new.in{max-width:320px;height:auto;padding-top:16px;padding-bottom:16px}
  .xs-div{flex:0 0 0;width:100%;flex-direction:row;height:0}
  .xs-div.in{flex:0 0 auto;height:52px}
  .xs-div .xs-line{width:auto;height:1px;flex:1;min-height:0}
}
/* Reduced motion removes movement, never the explanation. The first build sent
   this case straight past the whole sequence, so a machine with the OS setting
   on saw no transformation at all and then a tooltip out of nowhere.         */
@media (prefers-reduced-motion:reduce){
  .xs-ws,.xs-i,.xs-new,.xs-div,.xs-top,.xs-cap .xs-t{transition:none;animation:none}
  .xs-new{opacity:1;transform:none}
  .xs-spin{animation:none}
}
}
</style>

const SEQ_STATE=["Active","Active","Active","Paused","Draft"];
function growSequences(c){
 const names=SEQ_SETS[c.id]||[]; c.sequences=[];
 if(!c.seq) return;
 const r=rng("seq:"+c.id);
 /* the per-sequence figures have to sum back to the client's headline totals,
    or the client record and the sequence list contradict each other on the one
    number the client cares about most.                                      */
 const w=[]; for(let i=0;i<c.seq;i++) w.push(.4+r());
 const tot=w.reduce((a,b)=>a+b,0);
 let sentLeft=c.sent, prosLeft=c.prospects;
 for(let i=0;i<c.seq;i++){
  const name=names[i]||("Campaign "+(i+1));
  const state=i<Math.ceil(c.seq*.55)?"Active":SEQ_STATE[3+(i%2)];
  const last=i===c.seq-1;
  const share=w[i]/tot;
  const sent=state==="Draft"?0:last?sentLeft:Math.round(c.sent*share);
  const pros=last?prosLeft:Math.round(c.prospects*share);
  sentLeft-=sent; prosLeft-=pros;
  const reply=state==="Draft"?0:+(c.reply*(.6+r()*.8)).toFixed(1);
  /* a draft has a list loaded and nobody emailed yet, which is exactly why a
     draft sitting on 900 prospects is worth a conversation. */
  const contacted=state==="Draft"?0:Math.round(Math.max(0,pros)*(.72+r()*.26));
  c.sequences.push({name,state,prospects:Math.max(0,pros),contacted,sent:Math.max(0,sent),reply,
   owner:(staffOf(c)[i%Math.max(1,staffOf(c).length)]||{name:"the agency"}).name});
 }
 /* rounding has to land somewhere. Put it on the largest active sequence so no
    row ends up negative and the column still totals the headline.          */
 const drift=c.sent-c.sequences.reduce((t,x)=>t+x.sent,0);
 if(drift){const t=c.sequences.filter(x=>x.state!=="Draft").sort((a,b)=>b.sent-a.sent)[0];if(t)t.sent+=drift}
 const pdrift=c.prospects-c.sequences.reduce((t,x)=>t+x.prospects,0);
 if(pdrift){const t=c.sequences.slice().sort((a,b)=>b.prospects-a.prospects)[0];
  if(t){t.prospects+=pdrift; t.contacted=Math.min(t.contacted,t.prospects)}}
}

 if(!items.length) return "";

/* what happened last in this workspace, newest first. Derived from the same

function activityList(c){
 const rows=[];

 const active=(c.sequences||[]).filter(q=>q.state==="Active").length;
 if(active&&c.sent) rows.push([0,"today","Sent from "+active+" active sequence"+(active===1?"":"s")]);
 rows.sort((a,b)=>a[0]-b[0]);

const RC_LIVE_SEEN={};
const rcStepDate=(c,i)=>{const d=(c.setupDates||[])[i]; if(d) return d;
 const t=Date.parse(c.created); if(isNaN(t)) return c.created;
 const d2=new Date(t+[0,2,5,8][i]*864e5); return d2.getDate()+" "+["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d2.getMonth()]};

 /* 2 Oct 2026 (S2): gone at 4 of 4, nothing takes its place */
 return "";
 if(RC_LIVE_SEEN[c.id]) return "";
 return `<div class="rc-live" role="status">${tickI}<span><b>${c.name.split(" ")[0]}</b> is live since ${rcStepDate(c,S.length-1)}. Every setup step is done.</span>

}

function blReceipt(k,before,prev,cid){
 const m=compute(k),R=RES[k],freed=m.free-before;
 /* the client nearest its limit, excluding the agency's own workspace and any
    row that was just changed; pct first, then room, so "at limit" wins */
 const changed=new Set(prev.map(x=>x[1]));
 const near=fundedClients().filter(c=>!changed.has(c.id)&&R.rows[c.id])
   .map(c=>({c,s:rowState(k,c.id,m)})).filter(x=>x.s.pct>=R.warn).sort((a,b)=>b.s.pct-a.s.pct)[0];
 const n=prev.length, first=x=>x.split(" ")[0].replace(/[,&]$/,"");
 let text=n===1?"Saved.":"Saved, "+n+" changes.";
 /* 21 Sep 2026, delight pass round 3: a save scoped to one client's Limits tab
    (cid set) speaks about that client rather than the shared pool. */
 if(freed>0) text+=" "+f(freed)+" "+R.unit+" freed"+(near?"; "+near.c.name+(near.s.room===0?" is at its limit":" is near its limit")+" and could use them.":cid?"":" for the shared pool.");
 else if(freed<0) text+=" "+f(-freed)+" "+R.unit+(cid?" now reserved for "+byId[cid].name:" more of the pool is now spoken for.");
 clearTimeout(blrTimer);
 BLR={text,k,id:cid||"",undo:()=>{prev.forEach(([xk,xid,fld,v])=>{RES[xk].rows[xid][fld]=v})},
   act:freed>0&&near?{label:"Raise "+first(near.c.name)+"'s limit",cid:near.c.id}:null};
 blrTimer=setTimeout(()=>{BLR=null;render()},8000);
}

/* ── orient: the plan card, compact, credits folded in ────────────────────── */
/* a single-workspace plan, so the pacing card on a normal user's Home agrees
   with the KPI row above it. The agency pool is 150,000 across clients; quoting
   that number to someone who has sent 2,148 from one workspace is the kind of
   contradiction that makes a whole screen untrustworthy. */
const NORMAL_PLAN={sends:5000,lead_finder:1000,verification:2000,ai:500};
const NORMAL_USED={lead_finder:610,verification:840,ai:455};
/* `norm` drops Allocate: there is nothing to allocate across until a second
   workspace exists. Add capacity stays, because running out is still possible. */
function planCard(norm){
 if(norm){
  const used=AGENCY_OWN.contacted, pool=NORMAL_PLAN.sends;
  const rate=used/Math.max(1,CYCLE.day), left=(pool-used)/Math.max(1,rate);
  const early=CYCLE.days-CYCLE.day-Math.floor(left);
  const creds=["lead_finder","verification","ai"].map((k,i)=>{
   const u=NORMAL_USED[k], p=NORMAL_PLAN[k], r=u/Math.max(1,CYCLE.day), d=(p-u)/Math.max(1,r);
   return {l:RES[k].label.replace(" Credits",""),c:["#1D4ED8","#059669","#D97706"][i],
     v:(d>=CYCLE.days-CYCLE.day?"lasts the cycle":Math.max(0,Math.round(d))+" days left"),p:u/p*100}});
  return '<div class="card"><div class="c-h"><span class="c-t">Plan pacing</span>'
   +'<span class="c-a"><span class="sub">'+CYCLE.month+'</span></span></div><div class="c-b">'
   +'<div class="big"><span class="big-v" style="font-size:24px;line-height:32px">'+f(used)+'</span>'
   +'<span class="big-s">of '+f(pool)+' emails, '+Math.round(elapsed()*100)+'% of the cycle gone</span></div>'
   +(left<CYCLE.days-CYCLE.day
     ?'<p class="pace bad">At this burn the plan is exhausted around <b>'+onDay(left)+'</b>, '+early+' days early.</p>'
     :'<p class="pace">On pace to finish the cycle inside the plan.</p>')
   +segbars(creds)
   +'<div class="tools" style="margin-top:12px">'
    +dqTip('<button class="shd-button shd-button--secondary shd-button--sm" data-gobill>Add capacity</button>',ADD_CAP_TIP)
   +'</div></div></div>';
 }
 const sm=compute("sends"), used=sm.used, pool=sm.R.pool, sd=burnDays("sends");
 const early=CYCLE.days-CYCLE.day-Math.floor(sd), pct=Math.round(used/pool*100), el=Math.round(elapsed()*100);
 /* by workspace: the cycle's emails split by the workspace that sent them */
 const byWs=fundedWorkspaces().map(c=>({c,u:cRow("sends",c.id).used})).filter(x=>x.u>0).sort((a,b)=>b.u-a.u);
 const wsTot=byWs.reduce((a,x)=>a+x.u,0)||1, top=byWs.slice(0,3), rest=byWs.slice(3);

/* ═══ agency-side Analytics: Sequence, Email account and Team reports blended
   across every workspace the signed-in person is on. 25 Sep 2026, 54 §1.
   Reuses the same membership rule as everything else cross-client: myClients()
   is null-ws-means-every-workspace for Owner/Admin, an enumerated list for a

let anTab="seq", anWsOpen=false, anWsSel=null;
let anSort={seq:{col:null,dir:-1},mail:{col:null,dir:-1},team:{col:null,dir:-1}};
const anSources=()=>myClients().concat(canI("dashboard")?[OWN_WS]:[]);
const anWsName=c=>c.own?AGENCY.name:c.name;
const anVisible=()=>{const mine=anSources();
 if(anWsSel===null) return mine;
 const sel=new Set(anWsSel); return mine.filter(c=>sel.has(c.id))};
const anWsLabel=()=>anWsSel===null?"All mine":anWsSel.length+" of "+anSources().length;
const AN_TABS=[["seq","Sequence"],["mail","Emails &amp; Domain","New"],["team","Teams"]];
/* 29 Sep 2026, Hitesh: "check analytics screen, it should look like this" (the product's Analytics, Sequence tab). */
let anView="prospect", anPct=false, anGran="daily", anCount="relative", anFirst=false;
/* one small table per tab: [key,label,isNumeric]. Labels first, numerics last,
   in every tab, so the totals row below can colspan the labels generically. */
const AN_COLS={
 seq:[["ws","Workspace"],["seq","Sequence"],["owner","Owner"],["prospects","Prospects",1],
   ["contacted","Contacted",1],["opened","Opened",1],["replied","Replied",1],["positive","Positive",1]],
 mail:[["ws","Workspace"],["mbx","Email account"],["setup","Setup score",1],["inbox","Inbox score",1],
   ["sent","Sent",1],["replied","Replied",1],["bounced","Bounced",1]],
 team:[["person","Person"],["role","Role"],["ws","Workspaces",1],["prospects","Prospects",1],
   ["contacted","Contacted",1],["replied","Replied",1],["positive","Positive",1]],
};
const anDefaultSort=t=>{const c=AN_COLS[t].find(x=>x[2]);return c?c[0]:AN_COLS[t][0][0]};
const anSortState=()=>{const s=anSort[anTab];return {col:s.col||anDefaultSort(anTab),dir:s.dir}};
/* growSequences() falls back to the literal "the agency" for a client with no
   Member staffed on it (Vertex, Brightline, Cascade all have none - only
   Sam is enumerated, on Alloy and Northwind). That reads fine on the client's
   own sequence list, where it is shorthand for "nobody named, an agency
   person handles it", but the report's Owner column promises a named person
   on every row, so it is re-pointed at a real one here rather than in the
   shared fixture, which other screens still read as-is. Alternates so one
   name does not carry the whole account. */
const ANALYTICS_OWNER_FALLBACK=["Priya Nair","Alex Meridian"];
function anSeqRows(wss){
 const out=[];
 wss.forEach(c=>{(c.sequences||[]).forEach((q,i)=>{
   const opened=Math.min(q.contacted,Math.round(q.contacted*0.4));
   const replied=Math.round(q.contacted*(q.reply||0)/100);
   const ratio=c.reply?c.pos/c.reply:0.3;
   const positive=Math.min(replied,Math.round(replied*ratio));
   const owner=(q.owner&&q.owner!=="the agency")?q.owner:ANALYTICS_OWNER_FALLBACK[i%ANALYTICS_OWNER_FALLBACK.length];
   out.push({wsId:c.id,ws:anWsName(c),seq:q.name,owner,
     prospects:q.prospects,contacted:q.contacted,opened,replied,positive});
 })});
 return out;
}
function anMailRows(wss){
 const out=[];
 wss.forEach(c=>{(c.mailboxes||[]).forEach(m=>{
   const [email,health,limit]=m, r=rng("anmbx:"+c.id+":"+email), down=health==="Disconnected";
   const sent=down?0:Math.round((limit||60)*CYCLE.day*(0.5+r()*0.4));
   out.push({wsId:c.id,ws:anWsName(c),mbx:email,
     setup:down?0:60+Math.round(r()*39), inbox:down?0:55+Math.round(r()*44),
     sent, replied:Math.round(sent*(c.reply||3)/100*(0.6+r()*0.7)),
     bounced:Math.round(sent*(0.004+r()*0.014))});
 })});
 return out;
}
function anTeamRows(wss){
 const ids=new Set(wss.map(c=>c.id));
 return Object.keys(PEOPLE).map(key=>{
  const p=PEOPLE[key];
  const mine=(p.ws?p.ws.filter(id=>ids.has(id)):[...ids]).map(id=>byId[id]).filter(Boolean);
  return {person:p.name,role:p.role,ws:mine.length,
   prospects:mine.reduce((t,c)=>t+(c.prospects||0),0),
   contacted:mine.reduce((t,c)=>t+(c.sent||0),0),
   replied:mine.reduce((t,c)=>t+Math.round((c.sent||0)*(c.reply||0)/100),0),
   positive:mine.reduce((t,c)=>t+positives(c),0)};

/* ═══ Home, the agency's landing screen ═══════════════════════════════════════
   Rail item 1, and where an agency account lands at login instead of Sequences.
   Zone order is deliberate: what needs a decision, then whether the agency is
   pacing right, then the clients ranked. Two rules hold it together.

   1. Zone 1 carries only what an owner can resolve and an operator cannot, plus
      operator work that has aged past its consequence. Without that rule this
      becomes a second inbox competing with the queue in All clients.
   2. Nothing here is a blended rate across clients. One reply rate across five
      unrelated ICPs is arithmetic, not information, and that is the shape that
      was promised in Mar 2024 and never shipped.                              */

const CYCLE={day:9,days:30,month:"September 2026"};        /* today is 9 Sep 2026 */
const elapsed=()=>CYCLE.day/CYCLE.days;
const PACE_DAYS=3;   /* under this many days of runway, pacing stops being a card */
/* ═══ the agency's card fails ═════════════════════════════════════════════════
   Decided 12 Sep 2026, after the Aug 2025 incident in which an agency's failed
   payment locked its clients out: during the agency's grace period a client
   workspace stays readable, sending pauses, and the client's paused state
   names the agency and never the reason. Reachable with #grace. */
const GRACE={on:false,failedOn:"7 Sep",daysLeft:5};
/* item 55, 28 Sep 2026: canViewAs deleted, unread (one hit, its own
   definition; always returned true and nothing called it). */
const viewAsBtn=(c,cls)=>`<button class="${cls}" data-asclient="${c.id}">${c.forClient===false?"View as its users":"View as client"}</button>`;
const grace=()=>GRACE.on;
const graceBanner=()=>grace()?`<div class="msg m-bad grace" style="margin-bottom:20px">${warnI}<span><strong>Payment failed on ${GRACE.failedOn}.</strong>
  ${GRACE.daysLeft} days to update the card before the account pauses. Everyone keeps reading their workspaces; nothing is sending.
  ${canI("billing")?'<button class="linkbtn" data-gobill>Update payment</button>':"An owner updates the card."}</span></div>`:"";
const graceNote=c=>grace()?`<div class="msg m-warn grace" style="margin-bottom:16px">${warnI}<span>Sending is paused by ${AGENCY.name}.
  You can see everything as usual; your sequences resume when they restart them.</span></div>`:"";
/* headroom in days at the burn rate observed so far this cycle */
const burnDays=k=>{const m=compute(k),perDay=m.used/CYCLE.day;
  return perDay>0?m.free/perDay:Infinity};
const runsOut=()=>RK.filter(k=>RES[k].nature!=="Storage")
  .map(k=>({k,d:burnDays(k)})).sort((a,b)=>a.d-b.d)[0];
const onDay=d=>{const n=CYCLE.day+Math.floor(d);
  return n>CYCLE.days?"after the cycle resets":n+" Sep"};
const ageDays=t=>{const m=/(\d+)\s*day/.exec(t||"");if(m)return +m[1];
  return /yesterday/.test(t||"")?1:0};
/* item 55, 28 Sep 2026: myCaps deleted, unread (one hit, its own
   definition). */
const medianCPP=()=>{const v=myClients().map(costPer).filter(x=>x!=null).sort((a,b)=>a-b);
  if(!v.length)return null;const h=v.length>>1;
  return v.length%2?v[h]:(v[h-1]+v[h])/2};

/* what an owner has to decide, ordered by what it costs to leave alone */
function dashItems(){
 const out=[];
 RK.forEach(k=>{const m=compute(k);
  fundedWorkspaces().forEach(c=>{const st=rowState(k,c.id,m);
   if(st.room===0&&!REQUESTS.some(r=>r.client===c.id&&r.res===k))
    out.push({score:90,sev:"critical",client:c.id,raise:k+"|"+c.id,act:"Raise limit",age:"today",
      what:c.name+" is at its "+RES[k].label.toLowerCase()+" limit and has stopped",
      why:f(m.free)+" "+RES[k].unit+" sit unallocated in the pool. Only you can raise this."})})});
 REQUESTS.filter(r=>myClientsForLimits().some(c=>c.id===r.client)).forEach(r=>{const m=compute(r.res);
  out.push({score:80,sev:"decision",client:r.client,req:r.id,act:"Approve",age:r.when,
    what:byId[r.client].name+" asked for "+f(r.amount)+" more "+RES[r.res].label.replace(/^Monthly |^Active /,"").toLowerCase(),
    why:r.note+" Approving leaves "+f(Math.max(0,m.free-r.amount))+" in the pool."})});
 /* operator work escalates here once it has aged. A disconnected mailbox is not
    the owner's job until nobody has done it for two days, at which point it is. */
 INFRA().filter(a=>a.client==="__x"||ageDays(a.age)>=2).forEach(a=>{
  const cross=a.client==="__x", c=cross?null:byId[a.client];
  out.push({score:cross?35:a.sev==="critical"?85:a.kind==="Bounce rate rising"?75:50,sev:a.sev,age:a.age,act:a.act,
    client:c?c.id:null, collision:cross,
    what:cross?a.kind:a.kind+" on "+c.name+", unresolved for "+a.age,
    why:a.kind==="Bounce rate rising"
        ?a.detail+". Every workspace sending from this domain pool is exposed, not only this one."
      :a.kind==="Email account disconnected"
        ?a.detail+". Volume this workspace pays for is not going out."
      :a.detail+"."})});
 /* item 63, 28 Sep 2026: the pending-link Home item deleted. It fired on
    myClients().filter(isPending), always empty (no fixture was ever
    isPending), for a request nobody could actually make yet (Connect an
    existing account is phase 2, D2a). */
 /* a client going quiet, which is what churn looks like before the email arrives */
 myClients().forEach(c=>{if(c.prev&&c.reply&&c.reply<c.prev*0.75)
  out.push({score:65,sev:"warning",client:c.id,act:"Open",age:"this cycle",
    what:c.name+" reply rate fell from "+c.prev.toFixed(1)+"% to "+c.reply.toFixed(1)+"%",
    why:"Down "+Math.round((1-c.reply/c.prev)*100)+"% this cycle. Nothing in the product will tell them, and nothing will tell you again."})});
 return out.sort((a,b)=>b.score-a.score);
}

/* the reason a client is pinned to the top of zone 3, or null */
/* 21 Sep 2026, delight pass: "At limit" is a moment, not a permanent state, so
   the chip says when it happened. Seeded from the request that asked about
   the same resource, when one exists, since that is the same event; a fresh
   limit with no matching request is dated to today. Session-lived, like
   DECIDED, so a page reload starts the clock over. */
const AT_LIMIT_SINCE={};
function atLimitSince(c,k){
 if(!AT_LIMIT_SINCE[c.id]){const r=REQUESTS.find(x=>x.client===c.id&&x.res===k);
   AT_LIMIT_SINCE[c.id]=r?r.when:"today"}
 return AT_LIMIT_SINCE[c.id]}
function attention(c){
 /* a disabled client outranks everything else that could be said about it.
    Nothing it does matters until it is re-enabled, and the row has to say so
    or the agency thinks sending stopped when it did not. */
 if(c.disabled) return{rank:-1,pin:true,chip:"Disabled",tone:"c-bad",
   why:"Sending is stopped and nothing goes out. Re-enable to start again. Nothing has been lost."};
 const m=medianCPP(), cp=costPer(c);
 const lim=funded(c)?RK.map(k=>({k,st:rowState(k,c.id,compute(k))})).filter(x=>x.st.room===0):[];
 if(lim.length) return{rank:0,pin:true,chip:"At limit since "+atLimitSince(c,lim[0].k),tone:"c-bad",
   why:RES[lim[0].k].short.charAt(0).toUpperCase()+RES[lim[0].k].short.slice(1)+" ran out. Sending and sourcing stop until you raise the limit."};
 /* a quarter down and at least a point down. Without the floor a move from
    1.2 to 0.8 flags, and at forty clients a third of the book is "Falling". */
 if(c.prev&&c.reply&&c.reply<c.prev*0.75&&c.prev-c.reply>=1) return{rank:1,pin:true,chip:"Falling",tone:"c-warn",
   why:"Reply rate down from "+c.prev.toFixed(1)+"% last cycle. Worth a call before they ask for one."};
 if(cp!=null&&m&&cp>m*2) return canI("billing")
   ?{rank:2,pin:true,chip:"Costly",tone:"c-warn",
     why:"Costs "+(cp/m).toFixed(1)+"x the median per positive reply. Priced right, or served wrong?"}
   :{rank:2,pin:true,chip:"Low yield",tone:"c-warn",
     why:f(positives(c))+" positive replies from "+f(c.sent)+" sent."};
 /* a brand new client is a lifecycle state, not a decision, so it carries a chip
    but does not jump the queue above a client that is actually running */
 if(c.sent===0) return{rank:9,pin:false,chip:doneN(c)<4?"Setup pending":"Not started",tone:"c-mute",
   why:doneN(c)<4?(4-doneN(c))+" of 4 setup steps left":"Set up, nothing sent yet"};
 return null;
}

function planChart(compact,H0,W0){
 const R=RES.sends, pool=R.pool, W=W0||640, H=H0||(compact?150:196), L=46, T=22, B=34, Rr=14;
 const px=d=>L+(d-1)/(CYCLE.days-1)*(W-L-Rr);

 /* item 9, 29 Sep 2026 (Hitesh: "Plan pacing looks dummy"): the line is the
    account's real emails sent this cycle, the same number the card prints,
    spread over the elapsed days in DAILY's shape. DAILY is only the shape. */
 const used=compute("sends").used, shape=DAILY.slice(0,CYCLE.day), shapeSum=shape.reduce((a,v)=>a+v,0)||1, k=used/shapeSum;
 let run=0; const pts=shape.map((v,i)=>{run+=v*k;return[px(i+1),py(run),Math.round(run),i+1]});
 const last=pts[pts.length-1];
 const line=pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
 const area="M"+px(1).toFixed(1)+","+py(0).toFixed(1)+" L"+line.replace(/ /g," L")
   +" L"+last[0].toFixed(1)+","+py(0).toFixed(1)+" Z";
 const grid=[0,1/3,2/3,1].map(fr=>{const y=py(pool*fr);
   return '<line x1="'+L+'" x2="'+(W-Rr)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="var(--line-soft)"/>'
    +'<text x="'+(L-8)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end" class="ax">'+(fr?abbr(pool*fr):"0")+'</text>'}).join("");

 const cw=64, cx=Math.min(W-Rr-cw, last[0]-cw/2), cy=last[1]-30;

/* ── radial gauge, the "Repeat Customer Rate" pattern from the reference ────── */
function gauge(pct,big,sub){
 const W=210,H=126,cx=W/2,cy=H-14,r=76,N=44;
 const on=Math.round(N*Math.min(1,pct/100));
 let t="";
 for(let i=0;i<N;i++){
  const a=Math.PI-(i/(N-1))*Math.PI, x1=cx+Math.cos(a)*(r-13), y1=cy-Math.sin(a)*(r-13);
  const x2=cx+Math.cos(a)*r, y2=cy-Math.sin(a)*r;
  const c=i<on?(pct>=90?"#DC2626":pct>=75?"#D97706":"#1D4ED8"):"var(--gray-200)";
  t+='<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)
   +'" stroke="'+c+'" stroke-width="3" stroke-linecap="round"/>'}
 return '<svg viewBox="0 0 '+W+' '+H+'" class="gauge" role="img" aria-label="'+big+' '+sub+'">'+t
  +'<text x="'+cx+'" y="'+(cy-16)+'" text-anchor="middle" class="gv">'+big+'</text>'
  +'<text x="'+cx+'" y="'+(cy+2)+'" text-anchor="middle" class="gs">'+sub+'</text></svg>'}

/* 18 Sep, delight pass: a new client's default limit is a share that leaves
   room, never the whole free pool: floor(free / max(2, clients + 1)), rounded
   down to 500, at least 500. With no clients the newcomer gets half. One
   function, so the row, the sentence and create() can not disagree. */
/* 2 Oct 2026, Hitesh (board row 03, C2): a new workspace gets one share of the
   plan, 10% by default, moved with a slider; every resource follows the share
   until its own number is typed over. The share is of the PLAN, not of what is
   available, so it means the same thing for every workspace; the slider's top
   is the largest share whose reservations still fit what is available today. */
const NC_SHARE_DEFAULT=10;
const ncStep=k=>{const p=RES[k].pool;return p>=100000?500:p>=5000?50:p>=1000?10:5};
function ncShareMax(){let mx=100;RK.forEach(k=>{const m=compute(k);mx=Math.min(mx,Math.floor(m.free/RES[k].pool*100))});return Math.max(1,mx)}
function ncTightest(){let b=null;RK.forEach(k=>{const m=compute(k),v=m.free/RES[k].pool;if(!b||v<b.v)b={k,v}});return b?RES[b.k].label.replace(/ \/ month$/,""):""}
function ncShare(){const mx=ncShareMax();return Math.max(1,Math.min(mx,nc.share==null?NC_SHARE_DEFAULT:nc.share))}
function ncDerived(k){const st=ncStep(k);return Math.max(st,Math.floor(RES[k].pool*ncShare()/100/st)*st)}
function ncCapFor(k){return nc.custom&&nc.custom[k]!=null?nc.custom[k]:ncDerived(k)}
const ncDefaultCap=ncDerived;
const ncIsCustom=()=>!!nc.custom&&Object.keys(nc.custom).length>0;
function ncUsageHTML(){
 const who=(nc.name||"this workspace").trim(), mx=ncShareMax(), share=ncShare(), custom=ncIsCustom(), fill=mx>1?Math.round((share-1)/(mx-1)*100):100;
 const tile=(k,l)=>`<div class="nc-share-tile"><b data-tile="${k}">${f(ncCapFor(k))}</b><span>${l}</span></div>`;
 const row=k=>{const R=RES[k],m=compute(k);return `<div class="nc-urow2" data-capfor="${k}"><span class="l">${R.label}</span><span class="sub"><b>${f(m.free)}</b> available</span>${numIn(ncCapFor(k),R.unit,`data-cap="${k}" aria-label="${R.label} limit"${nc.custom&&nc.custom[k]!=null?' class="is-custom"':''}`)}</div>`};
 return `<div class="nc-usage" id="ncUsage">
  <div class="nc-urow"><label class="flabel" for="ncShare" style="margin:0">How much of your plan ${who} can use each cycle</label><span class="nc-upct" id="ncPct">${custom?"Custom":share+"%"}</span></div>
  <input type="range" id="ncShare" min="1" max="${mx}" step="1" value="${share}" style="--p:${fill}%" aria-label="Share of your plan">
  <div class="nc-ucap"><span>1%</span><span>Up to ${mx}% today. ${ncTightest()} run out first.</span></div>
  <div class="nc-share-tiles">${tile("sends","emails a month")}${tile("lead_finder","Lead Finder credits a month")}${tile("verification","verification credits")}${tile("ai","AI credits")}</div>
  <div class="nc-uline"><span class="sub">Emails are a monthly limit. Credits are reserved for ${who} from your balance.</span><button type="button" class="linkbtn" id="ncEdit">${nc.open?"Hide":"Edit each resource"}</button></div>
  ${nc.open?`<div class="nc-ulist"><div class="nc-uhead"><span class="sub">Each number follows the slider until you type over it.</span><button type="button" class="linkbtn" id="ncReset" style="${custom?"":"display:none"}">Reset to ${share}%</button></div>${RK.map(row).join("")}</div>`:""}
  ${nc.err?`<p class="nc-limsay is-err" id="ncUerr"><span>${nc.err}</span></p>`:""}
 </div>`;
}
/* repaints only the values, so the slider keeps the drag and a row keeps its caret */
function ncPaintUsage(){
 const mx=ncShareMax(), share=ncShare(), custom=ncIsCustom();
 const sl=el("ncShare"); if(sl){sl.style.setProperty("--p",(mx>1?Math.round((share-1)/(mx-1)*100):100)+"%")}
 const pct=el("ncPct"); if(pct)pct.textContent=custom?"Custom":share+"%";
 document.querySelectorAll("[data-tile]").forEach(b=>b.textContent=f(ncCapFor(b.dataset.tile)));
 document.querySelectorAll("#ncUsage [data-cap]").forEach(i=>{const k=i.dataset.cap; if(document.activeElement!==i)i.value=f(ncCapFor(k)); i.classList.toggle("is-custom",!!(nc.custom&&nc.custom[k]!=null))});
 const rs=el("ncReset"); if(rs){rs.style.display=custom?"":"none";rs.textContent="Reset to "+share+"%"}
}

/* ═══ client-side Email Warm-up. 54 §3.2/3.3: one TrulyInbox account per
   agency, so a workspace user sees only their own workspace's mailboxes, never
   the TrulyInbox login or the consent screen. Status and figures are held
   here, seeded once per mailbox and mutated by the toggle so a pause/resume
   sticks for the session. */
const WARMUP_TONE={Warming:"info",Paused:"warn","Not started":"mute"};
let WARMUP_STATE={};
const warmupKey=(cid,email)=>cid+"|"+email;
function warmupRow(c,m){
 const [email,health]=m, key=warmupKey(c.id,email);
 if(!WARMUP_STATE[key]){
  const r=rng("warmup:"+key), down=health==="Disconnected";
  const status=down?"Not started":(r()<0.15?"Paused":"Warming");
  const sent=down?0:12+Math.round(r()*28);
  const recv=down?0:Math.max(0,sent-2-Math.round(r()*6));
  const deliv=down?0:88+Math.round(r()*11);
  WARMUP_STATE[key]={status,sent,recv,deliv};
 }
 return WARMUP_STATE[key];
}
function cWarmup(c){
 const rows=c.mailboxes||[];
 return `<p class="sub" style="margin:0 0 14px">${AGENCY.name} sets up warm-up for this workspace.

   <thead><tr><th>Email account</th><th>Warm-up</th><th class="ar">Sent today</th><th class="ar">Received today</th>

   <tbody>${rows.length?rows.map(m=>{

     const may=!agency&&canC(c,"warmup")&&st.status!=="Not started";
     return `<tr><td>${email}</td>
       <td><span class="chip c-${WARMUP_TONE[st.status]}">${st.status}</span></td>

       <td class="ar tnum">${st.status==="Not started"?'<span class="sub">–</span>':st.deliv+"%"}</td>
       <td class="ar colact"><button class="sw" role="switch" aria-checked="${st.status==="Warming"}"
         ${may?`data-warmup="${c.id}|${email}"`:"disabled"}
         ${agency?`title="Set up by ${AGENCY.name}"`:""} aria-label="Warm-up for ${email}"></button></td></tr>`;
   }).join(""):'<tr><td colspan="6"><span class="sub">No email accounts connected to this workspace.</span></td></tr>'}
   </tbody></table></div></div>`;

/* Reports for the client: four numbers and fourteen days. Daily sends are
   derived from the workspace's cycle total the same way the mailbox counts are,
   so the chart agrees with the tiles and the tiles agree with the client list.
   Meetings are a fixture ratio on positive replies; the product records them as
   an outcome, this prototype does not carry per-thread outcomes. */
const MEETING_RATE=0.42;
const meetings=c=>Math.round(positives(c)*MEETING_RATE);
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function dailySeries(c,n){
 const perDay=c.sent/Math.max(1,CYCLE.day), out=[];
 for(let i=0;i<n;i++){
  const d=new Date(2026,8,CYCLE.day-(n-1-i)), dow=d.getDay();
  const h=((c.id.charCodeAt(0)*31+c.id.charCodeAt(1)*17+i*13)%23)/23;   /* deterministic jitter */
  const wk=(dow===0||dow===6)?0.12:1;
  const sent=Math.round(perDay*wk*(0.8+0.4*h));
  const rep=Math.round(sent*c.reply/100*(0.7+0.6*((h*7)%1)));
  out.push({d,sent,rep});
 }
 return out;
}
function reportChart(c){
 /* 17 Sep 2026, round 2: a 640-wide viewBox scaled to a 1300px panel made this
    chart 480px tall. Drawn wide it keeps its shape at about 200px. */
 const S=dailySeries(c,14), W=1300,H=190,L=46,T=14,B=28,Rr=46;
 const maxS=Math.max(1,...S.map(x=>x.sent)), maxR=Math.max(1,...S.map(x=>x.rep));
 const iw=(W-L-Rr)/S.length, bw=Math.min(22,iw*.55);
 const py=v=>T+(H-T-B)*(1-v/maxS), pr=v=>T+(H-T-B)*(1-v/maxR), px=i=>L+iw*i+iw/2;
 const grid=[0,.5,1].map(fr=>{const y=py(maxS*fr);
   return '<line x1="'+L+'" x2="'+(W-Rr)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="var(--line-soft)"/>'
    +'<text x="'+(L-8)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end" class="ax">'+(fr?abbr(Math.round(maxS*fr)):"0")+'</text>'
    +'<text x="'+(W-Rr+8)+'" y="'+(y+4).toFixed(1)+'" text-anchor="start" class="ax">'+(fr?Math.round(maxR*fr):"0")+'</text>'}).join("");
 const bars=S.map((x,i)=>'<rect class="bar-sent" x="'+(px(i)-bw/2).toFixed(1)+'" y="'+py(x.sent).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+(py(0)-py(x.sent)).toFixed(1)+'" rx="2" fill="var(--blue-11)" fill-opacity=".85"><title>'+x.d.getDate()+' '+MON[x.d.getMonth()]+': '+f(x.sent)+' sent</title></rect>').join("");
 const pts=S.map((x,i)=>px(i).toFixed(1)+","+pr(x.rep).toFixed(1)).join(" ");
 const dots=S.map((x,i)=>'<circle class="dot-rep" cx="'+px(i).toFixed(1)+'" cy="'+pr(x.rep).toFixed(1)+'" r="3" fill="var(--green-14)" stroke="#fff" stroke-width="1.5"><title>'+x.d.getDate()+' '+MON[x.d.getMonth()]+': '+x.rep+' replies</title></circle>').join("");
 const xlab=S.map((x,i)=>i%3===1?'<text x="'+px(i).toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle" class="ax">'+x.d.getDate()+' '+MON[x.d.getMonth()]+'</text>':"").join("");
 return '<svg viewBox="0 0 '+W+' '+H+'" class="chart" role="img" aria-label="Emails sent and replies per day, last 14 days">'
  +grid+xlab+bars+'<polyline points="'+pts+'" fill="none" stroke="var(--green-14)" stroke-width="2" stroke-linejoin="round"/>'+dots+'</svg>';
}
const chartLegend=()=>`<span class="c-a" style="display:flex;gap:14px;font-size:12px;color:var(--gray-12)">
     <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--blue-11);vertical-align:-1px;margin-right:6px"></span>Sent</span>
     <span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--green-14);vertical-align:-1px;margin-right:6px"></span>Replies</span></span>`;
function cReports(c){
 const rep=Math.round(c.sent*c.reply/100), pos=positives(c), mt=meetings(c);
 const d=c.reply-c.prev;
 return `<div class="kpis" style="margin-bottom:20px">
   ${kpi("Emails sent",f(c.sent),null,CYCLE.month+", so far")}
   ${kpi("Replies",f(rep),c.prev?d:null,"Reply rate "+c.reply.toFixed(1)+"%"+(c.prev?", was "+c.prev.toFixed(1)+"% last cycle":""),false,(d>=0?"":"")+d.toFixed(1)+" pts")}
   ${kpi("Positive replies",f(pos),null,c.sent?(c.pos.toFixed(1)+"% of sent"):"No sending yet")}
   ${kpi("Meetings booked",f(mt),null,pos?("From "+f(pos)+" positive replies"):"None yet")}
  </div>
  <div class="panel"><div class="panel-h"><span class="panel-t">Last 14 days</span>
    <span class="sub">Sent and replies, per day</span>
    ${chartLegend()}</div>
   <div class="panel-b" style="padding-top:4px">${c.sent?reportChart(c):'<p class="sub" style="margin:8px 0">Nothing has been sent from this workspace yet.</p>'}</div></div>`;
}

   agencies this is for run twenty to sixty. `scaleTo(40)` appends synthetic
   clients built the same way as the fixtures (mailboxes derived from sends,
   sequences summing to the headline totals, a limit row per resource), so
   every list, table, popover and roll-up can be rendered at the size it will
   actually be used at. Reachable with #scale=40. Nothing else changes. */
const SCALE={n:0};
const SCALE_NAMES=["Ashgrove Dental","Beacon Freight","Cobalt Works","Dunmore Capital","Elmstead Clinics","Fairhaven Legal",
 "Granite Peak Software","Halcyon Robotics","Ironbridge Steel","Juniper Analytics","Kestrel Aviation","Larkspur Media",
 "Marlow Property","Nimbus Cloud","Oakridge Schools","Pennant Insurance","Quarry Lane Foods","Rosewood Care",
 "Saltmarsh Energy","Tamar Logistics","Umber Studios","Verity Payments","Westbrook Motors","Xenon Labs","Yarrow Health",
 "Zephyr Travel","Alder Consulting","Brackenfield Farms","Corwen Textiles","Dovetail Furniture","Ember Security",
 "Fenwick Books","Glasswater Marine","Hollins Recruitment","Isley Architects","Jarrow Tools","Kelso Optics"];
function scaleTo(n){
 const r=rng("scale");
 const pal=["#B45309","#0F766E","#C2410C","#6D28D9","#0E7490","#9333EA","#4B5563","#BE185D","#1D4ED8","#047857","#B91C1C","#7C3AED"];
 let i=0;
 while(CLIENTS.length<n&&i<SCALE_NAMES.length){
  const name=SCALE_NAMES[i++], id="s"+String(i).padStart(2,"0");
  if(byId[id]) continue;
  const slug=name.toLowerCase().replace(/[^a-z]+/g,"-").replace(/^-|-$/g,"");
  const sent=Math.round((1500+r()*14000)/100)*100, seq=1+Math.floor(r()*6);
  /* six fixed roles, 23 Sep 2026: weighted toward Workspace Collaborator, the way
     Limited Access used to be the common case, with Workspace Admin the other
     common one and Workspace Viewer the rarer reports-only case. */
  const role=r()<.15?"Workspace Viewer":r()<.55?"Workspace Collaborator":"Workspace Admin";
  const c={id,name,company:name+" Ltd",email:"hello@"+slug+".com",colour:pal[i%pal.length],
   seq,mbx:Math.max(2,Math.round(sent/CYCLE.day/85)),prospects:Math.round(sent*0.2/10)*10,sent,
   reply:0,prev:0,pos:+(0.5+r()*3).toFixed(1),
   created:(1+Math.floor(r()*28))+" Aug, 2026",limitsReviewed:r()<.8,
   users:[["hello@"+slug+".com",role]],mailboxes:[],synthetic:true};
  /* last cycle's rate moves with this cycle's, as it does in life; independent
     draws made half the book "Falling" and the flag meaningless */
  c.reply=+(2+r()*7).toFixed(1); c.prev=+(c.reply*(0.7+0.8*r())).toFixed(1);
  SEND_DOMAINS[id]=[slug+".com",slug+"-go.com",slug+"-reach.com"]; SEQ_SETS[id]=[];
  RK.forEach(k=>{const st=ncStep(k),cap=k==="sends"?Math.round(sent*1.2/500)*500
    :Math.max(st,Math.round(RES[k].pool*0.015*(1+r())/st)*st);
    RES[k].rows[id]={res:0,cap,used:Math.min(cap,Math.round(cap*(0.2+r()*0.75)))}});
  growMailboxes(c); growSequences(c);
  CLIENTS.push(c); byId[id]=c;
  /* Priya is an Admin: ws is already null, reaching this workspace like every
     other one automatically. Sam is a Member and needs adding explicitly. */
  if(r()<.25&&Array.isArray(PEOPLE.sam.ws)&&PEOPLE.sam.ws.indexOf(id)<0){PEOPLE.sam.ws.push(id)}
 }
 LAST.clients=Math.max(LAST.clients,CLIENTS.length-2);
 SCALE.n=CLIENTS.length;

    one deep link that could land on the admin panel's own Settings, which
    D13 ended ("no Settings on the admin panel; every setting lives in a
    workspace, including the agency's own"). Routed into the agency's own
    workspace like #seq/#crm below, so #settings opens the real, correctly
    scoped screen instead of a state the rail itself no longer links to. */
 /* item 16, 28 Sep 2026: inMod defaults to "sequences" and this deep link
    never touched it, so a cold #settings load painted Sequences current in
    the rail at the same time as Settings - the same stale-highlight defect
    the in-app Settings click was fixed for, just from a different entry. */
 if(k==="settings"){ctx="own";asClient=false;inMod=null}
 /* #seq, #crm, #leads and the rest used to mean "the agency's own X" inside the
    master workspace. They still mean that; the workspace is just a real one now. */
 if(AGY_MOD[k]&&!MASTER_MOD[k]&&k!=="analytics"){ctx="own";asClient=false;inMod=RAIL2MOD[k]||k;view={name:"clients"}}
 /* the agency-wide screens: #analytics is the cross-workspace report, #api is
    the agency's own API & Integrations section. Neither is a workspace module. */
 if(k==="analytics"){ctx="agency";asClient=false;view={name:"analytics"}}
 if(k==="api"){ctx="agency";asClient=false;view={name:"apiint"}}
 /* People, a person (agency key, or a client user's "c:<clientId>|<email>"),
    and a cold Add a person: defect D4, none of the three worked from a hash. */
 if(k==="people"){view={name:"people"}; PEOPLE_TAB=v==="clients"?"clients":"agency"}
 if(k==="person"&&v){view={name:"people"};if(PEOPLE[v])setTimeout(()=>{modal={kind:"ppperson",k:v};renderModal()},60)}
 if(k==="addmember"){view={name:"people"};setTimeout(()=>openInvite({}),60)}
 if(k==="client"&&byId[v]) view={name:"record",id:v};
 /* the client's own side, and the create modal, are otherwise several clicks
    in. Coordinator review round 1, 24 Sep: a cold #asclient link lands on the
    first screen the role actually grants, not on the fixed Workspace item -
    Workspace Admin and Collaborator (Sequences first in CLIENT_MODULES) land on
    Sequences, Workspace Viewer (only Reports and Usage) lands on Reports. */
 if(k==="asclient"&&byId[v]){ctx=v;asClient=true;
  const cc=byId[v], role=actingRole(cc), mods=roleSet(role).mods;
  const first=CLIENT_MODULES.find(m=>mods.indexOf(m[0])>-1);
  cView=first?first[0]:"settings"}
 if(k==="addclient"){view={name:"clients"};setTimeout(openAddClient,0)}}
render();

.shd-button--tertiary{background:transparent;border:1px solid #e5e7eb;color:#6b7280}.shd-button--tertiary:hover{background:#f3f4f6}.shd-button--tertiary:active{background:#e5e7eb}

.pp-tabs{gap:24px}.pp-tabs button{color:#6b7280;transition:color .15s,border-color .15s}.pp-tabs button:hover{color:#374151;border-bottom-color:#d1d5db}.pp-tabs button[aria-selected=true]{color:#1d4ed8;border-bottom-color:#1d4ed8;font-weight:600}

 /* 25 Sep 2026: resolved. This topic used to ask an open question about a

const REACT=[["yes","Confirmed"],["no","Contradicted"],["meh","Did not care"],["new","New requirement"]];
const RDOT={yes:"d-yes",no:"d-no",meh:"d-meh",new:"d-new"};

/* switching person goes through the same path the person menu uses, so the rail
   and the dashboard guard both apply. An operator must not be dropped on a
   dashboard they cannot see. */
function T_become(who){me_=who;if(view.name==="dash"&&!canI("dashboard")) view={name:"clients"}}

const SKEY="sess.agency-workspaces.v1";
let sIdx=0, sOpen=false, sData={};
try{sData=JSON.parse(localStorage.getItem(SKEY)||"{}")}catch(e){sData={}}
const sSave=()=>{try{localStorage.setItem(SKEY,JSON.stringify(sData))}catch(e){}};
const sRec=k=>(sData[k]=sData[k]||{r:null,n:""});

function sessRender(){
 const S=el("sess"); if(!S||S.hidden) return;
 const T=TOPICS[sIdx], rec=sRec(T.k);
 const done=TOPICS.filter(x=>sData[x.k]&&(sData[x.k].r||sData[x.k].n)).length;
 el("sessCt").textContent=(sIdx+1)+" / "+TOPICS.length;
 el("sessNow").textContent=T.t;
 el("sessPrev").disabled=sIdx===0;
 el("sessNext").disabled=sIdx===TOPICS.length-1;
 el("sessTog").innerHTML=sOpen?"&#9660;":"&#9650;";
 el("sessTog").title=sOpen?"Collapse":"Expand";
 S.className=sOpen?"open":"collapsed";
 if(!sOpen) return;
 el("sessList").innerHTML=TOPICS.map((x,i)=>{const r=(sData[x.k]||{}).r;
  return `<button class="sess-li" role="listitem" data-si="${i}" aria-current="${i===sIdx}">
   <span class="sess-dot ${r?RDOT[r]:""}"></span>
   <span><b>${x.t}</b><i>${x.src}</i></span>
   <span></span></button>`}).join("");
 el("sessMain").innerHTML=`
  <p class="sess-h">${sIdx+1}. ${T.t}</p>
  <p class="sess-sub">Testing a claim from ${T.src}</p>
  <p class="sess-q">${T.ask}</p>
  <div class="sess-grid">
   <dl class="sess-cell"><dt>What this screen claims</dt><dd>${T.claim}</dd></dl>
   <dl class="sess-cell"><dt>What would change our mind</dt><dd>${T.watch}</dd></dl>
   ${T.open?`<dl class="sess-cell"><dt>Still open</dt><dd>${T.open}</dd></dl>`:""}
  </div>
  <div class="sess-react">${REACT.map(([k,l])=>
    `<button data-r="${k}" aria-pressed="${rec.r===k}">${l}</button>`).join("")}</div>
  <textarea id="sessNote" placeholder="What they actually said. Their words, not the summary.">${rec.n.replace(/</g,"&lt;")}</textarea>
  <div class="sess-foot">
   <button class="shd-button shd-button--tertiary shd-button--sm" id="sessCopy">Copy notes as Markdown</button>
   <button class="shd-button shd-button--tertiary shd-button--sm" id="sessDl">Download</button>
   <button class="shd-button shd-button--tertiary shd-button--sm" id="sessClear">Clear session</button>
   <span class="sub">${done} of ${TOPICS.length} recorded &middot; saved in this browser</span>
  </div>
  <div class="sess-foot" style="margin-top:8px"><span class="sub" style="color:var(--gray-15)">Reviewing as</span>
   ${Object.keys(PEOPLE).map(k=>`<button class="shd-button shd-button--sm ${k===me_?"shd-button--primary":"shd-button--tertiary"}" data-sessswap="${k}" ${asClient||solo?"disabled":""}>${PEOPLE[k].name} &middot; ${PEOPLE[k].role}</button>`).join("")}
  </div>`;
 el("sessMain").querySelectorAll("[data-sessswap]").forEach(b=>b.onclick=()=>swapMe(b.dataset.sessswap));
 el("sessList").querySelectorAll("[data-si]").forEach(b=>b.onclick=()=>sessGo(+b.dataset.si));
 el("sessMain").querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{
   const r=b.dataset.r; rec.r=rec.r===r?null:r; sSave(); sessRender()});
 const n=el("sessNote");
 n.oninput=()=>{rec.n=n.value;sSave()};
 n.onblur=()=>sessRender();
 el("sessCopy").onclick=()=>sessExport("copy");
 el("sessDl").onclick=()=>sessExport("file");
 el("sessClear").onclick=()=>{if(confirm("Clear every reaction and note from this session?")){sData={};sSave();sessRender()}};
}

/* a topic navigates the prototype and then re-renders it. The panel is outside
   #page, so render() never touches it. */
function sessGo(i){
 sIdx=Math.max(0,Math.min(TOPICS.length-1,i));
 modal=null;drawer=null;popOpen=false;mePopOpen=false;newOpen=false;newPick=null;recMenu=false;
 TOPICS[sIdx].go();
 render();
 if(el("modalWrap"))renderModal();
 if(el("drawerWrap"))renderDrawer();
 sessRender();
}

function sessMd(){
 const stamp=new Date().toISOString().slice(0,10);
 const lab={yes:"Confirmed",no:"Contradicted",meh:"Did not care",new:"New requirement"};
 let out="# Validation session, "+stamp+"\n\n"
  +"Walked against the prototype at `prototype/agency-admin.html`.\n\n"
  +"| # | Topic | Reaction | What they said | Source |\n|---|---|---|---|---|\n";
 TOPICS.forEach((t,i)=>{const r=sData[t.k]||{};
  out+="| "+(i+1)+" | "+t.t+" | "+(r.r?"**"+lab[r.r]+"**":"–")+" | "
    +((r.n||"").replace(/\s*\n\s*/g," ").replace(/\|/g,"\\|")||"–")+" | `"+t.src+"` |\n"});
 const changed=TOPICS.filter(t=>["no","new"].indexOf(((sData[t.k]||{}).r))>-1);
 out+="\n## What has to change\n\n"+(changed.length
  ?changed.map(t=>"- **"+t.t+"** ("+lab[sData[t.k].r]+"). "+((sData[t.k].n||"").replace(/\s*\n\s*/g," ")||"No note taken.")
     +" Claim under test: "+t.claim).join("\n")
  :"Nothing was contradicted and no new requirement was raised. Record that as a result, not as a blank.")+"\n";
 return out;
}
function sessExport(how){
 const md=sessMd();
 if(how==="copy"){
  const done=()=>{const b=el("sessCopy");b.textContent="Copied";setTimeout(()=>{b.textContent="Copy notes as Markdown"},1400)};
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(md).then(done,()=>sessFallback(md));
  else sessFallback(md);
  return;
 }
 const a=document.createElement("a");
 a.href=URL.createObjectURL(new Blob([md],{type:"text/markdown"}));
 a.download="validation-session-"+new Date().toISOString().slice(0,10)+".md";
 document.body.appendChild(a);a.click();a.remove();
}
/* clipboard is blocked on file:// in some builds, and a demo is the worst place
   to discover that. Fall back to a selectable textarea. */
function sessFallback(md){
 const w=document.createElement("div");
 w.style.cssText="position:fixed;inset:0;z-index:200;background:rgba(17,24,39,.45);display:flex;align-items:center;justify-content:center;padding:24px";
 w.innerHTML='<div style="background:#fff;border-radius:8px;padding:16px;max-width:720px;width:100%">'
  +'<p style="margin:0 0 8px;font-size:14px;font-weight:600">Select and copy</p>'
  +'<textarea readonly style="width:100%;box-sizing:border-box;height:320px;font-family:ui-monospace,Menlo,monospace;font-size:12px;border:1px solid #e5e7eb;border-radius:6px;padding:10px"></textarea>'
  +'<div style="margin-top:10px;text-align:right"><button style="font:inherit;font-size:13px;padding:6px 12px;border-radius:6px;border:1px solid #e5e7eb;background:#fff;cursor:pointer">Close</button></div></div>';
 document.body.appendChild(w);
 const ta=w.querySelector("textarea");ta.value=md;ta.select();
 w.querySelector("button").onclick=()=>w.remove();
 w.onclick=e=>{if(e.target===w)w.remove()};
}

function sessShow(on){
 const S=el("sess");
 S.hidden=!on;
 el("sessReopen").hidden=on;
 document.body.style.paddingBottom=on?(sOpen?"min(340px,46vh)":"46px"):"0";
 if(on) sessRender();
}
el("sessPrev").onclick=()=>sessGo(sIdx-1);
el("sessNext").onclick=()=>sessGo(sIdx+1);
el("sessTog").onclick=()=>{sOpen=!sOpen;document.body.style.paddingBottom=sOpen?"min(340px,46vh)":"46px";sessRender()};
el("sessHide").onclick=()=>sessShow(false);
el("sessReopen").onclick=()=>sessShow(true);
/* Escape hides the panel, but only once nothing else is claiming Escape: the
   modal and the drawer both use it and they are on top. */
document.addEventListener("keydown",e=>{
 if(e.key==="Escape"&&!modal&&!drawer&&!popOpen&&!el("sess").hidden){sessShow(false)}
 if((e.metaKey||e.ctrlKey)&&e.key==="/"){e.preventDefault();sessShow(el("sess").hidden)}
 if(el("sess").hidden||document.activeElement===el("sessNote")) return;
 if(e.key==="["){e.preventDefault();sessGo(sIdx-1)}
 if(e.key==="]"){e.preventDefault();sessGo(sIdx+1)}
});
/* #present opens the session on topic 1. Without the hash the prototype boots
   exactly as it did, so every existing deep link and the whole harness are
   unaffected.                                                              */
if(/(^|[#&])present\b/.test(location.hash)){sOpen=true;sessShow(true);sessGo(0)}
/* item 6, 28 Sep 2026: reviewer scaffolding must not sit on a product screen
   by default. sessShow(false) also reveals the "Validation panel" reopen
   pill (it is the click-to-get-back-in affordance once a reviewer has had
   the panel open and hidden it), which used to run on cold boot too and
   sat over Home's third "Needs a decision" row on every deep link. On boot,
   with nothing opened yet, both the panel and the pill stay hidden; Ctrl+/
   is the way in, and closing the panel after that is what surfaces the pill. */
else{el("sess").hidden=true;el("sessReopen").hidden=true;document.body.style.paddingBottom="0"}
</script>
