<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saleshandy · version C</title>
<!-- BUILD STAMP. file:// pages are cached aggressively, so a plain reload can
     serve an old copy and make a change look like it never happened. The stamp
     prints to the console on every load and sits in the tab title, so which
     build is on screen is never a guess. Hard-reload with Ctrl+Shift+R. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   Saleshandy · Workspaces for Agencies · prototype stylesheet
   Rebuilt 9 Sep 2026 against two sources only, no invented values:
     - src/assets/css/_custom-variable.scss (saleshandy-webui, GitHub, main)
     - ~/SD (1).html, the interactive design-token reference
   Every rule below is traceable to a named token from one of the two. Where
   they conflicted, the choice and the reason are in 17-dashboard-map.md §8.
   Selector names are unchanged from the prior sheet; only values moved.
   ═══════════════════════════════════════════════════════════════════════════ */
:root{
  /* ── palette, verbatim from _custom-variable.scss, cross-confirmed against
     SD(1)'s COLOR_PALETTE (Blue/Gray/Red/Orange/Yellow/Green/Purple families) ── */
  --blue-1:#e6f7ff;  --blue-5:#346aff;  --blue-6:#0137fc;  --blue-7:#0004c9;
  --blue-11:#1d4ed8; --blue-12:#bfdbfe; --blue-13:#dbeafe; --blue-15:#1f2937;
  --blue-16:#374151; --blue-17:#eff6ff; --blue-20:#1e40af; --blue-24:#3b82f6; --blue-31:#2563eb;
  --gray-1:#ffffff;  --gray-2:#fafafa;  --gray-3:#f5f5f5;  --gray-4:#e8e8e8;  --gray-5:#d9d9d9;
  --gray-6:#bfbfbf;  --gray-7:#8c8c8c;  --gray-8:#595959;  --gray-9:#262626;  --gray-11:#9ca3af;
  --gray-12:#4b5563; --gray-13:#e5e7eb; --gray-15:#6b7280; --gray-16:#f3f4f6; --gray-17:#111827;
  --gray-19:#f9fafb; --gray-23:#d1d5db; --gray-24:#212529;
  --green-6:#52c41a; --green-11:#d1fae5; --green-12:#065f46; --green-14:#047857; --green-16:#059669;
  --red-6:#f5222d;   --red-12:#b91c1c;  --red-17:#fef2f2;  --red-18:#dc2626;  --red-19:#fee2e2;
  --gold-6:#faad14;  --orange-12:#b45309; --orange-14:#d97706; --orange-15:#ffedd5;
  --purple-11:#ddd6fe; --purple-12:#5b21b6; --purple-13:#6d28d9; --purple-14:#ede9fe;

  /* ── SD(1) LABEL_STATUSES: the 7 status categories used for every chip.
     subtle = resting background, border = resting border, intense = hover only
     (not used at rest here, nothing in this prototype hovers a chip). Text is
     NOT tinted by status in the source component; see §8 note on this call. ── */
  --st-accent-bg:#eff6ff;    --st-accent-bd:#dbeafe;
  --st-warn-bg:#fffbeb;      --st-warn-bd:#fef3c7;
  --st-success-bg:#ecfdf5;   --st-success-bd:#d1fae5;
  --st-error-bg:#fef2f2;     --st-error-bd:#fee2e2;
  --st-delight-bg:#f5f3ff;   --st-delight-bd:#ddd6fe;
  --st-neutral-bg:#f3f4f6;--avatar-ring:#bfdbfe;--sw-on:#1d4ed8;--sw-off:#e5e7eb;--st-warn-ic:#b45309;   --st-neutral-bd:#d1d5db;
  --label-text:#1d1c1c;

  /* ── SD(1) RADIUS scale, applied per the most specific matching component ── */
  --radius-control:4px;      /* radius/4px: buttons, banners, toasts, modal, drawer footer, tab-box */
  --radius-input:4px;        /* radius/4px, matching every control in the real system */
  --radius-surface:6.479px;  /* shadow/base-radius: default surface, generic cards */
  --radius-table:8px;        /* table/Container-Radius: table-wrapping panels */

  /* ── SD(1) SHADOW_ELEVATIONS / SHADOW_COMPONENT / SHADOW_LAYOUT, verbatim ── */
  --shadow-xs:0 1.62px 3.239px 0 rgba(0,0,0,.16);                                  /* cards at rest */
  --shadow-lg:0 32.394px 64.788px -12.958px rgba(0,0,0,.16),0 1.62px 3.239px 0 rgba(0,0,0,.04); /* modal, drawer */
  --shadow-dropdown:1.62px 1.62px 12.958px -2.43px rgba(4,21,76,.16),6.479px 12.958px 45.352px -19.436px rgba(156,157,161,.24); /* action menus, popovers */
  --shadow-sidenav:.81px 1.62px 3.239px 0 #e5e7eb;
  --focus-ring:0 0 0 3px #dbeafe;      /* inputField/Border-Shadow-Focus, "3px ring" */
  --focus-ring-error:0 0 0 3px #fee2e2;

  /* aliases the existing markup reads, so no selector had to change */
  --blue-700:var(--blue-11); --blue-800:var(--blue-20); --blue-500:var(--blue-24); --blue-50:var(--blue-17);
  --gray-800:var(--blue-15); --gray-700:var(--blue-16); --gray-600:var(--gray-12); --gray-500:var(--gray-15);
  --gray-400:var(--gray-11); --gray-300:var(--gray-23); --gray-200:var(--gray-13); --gray-100:var(--gray-16);
  --gray-50:var(--gray-19); --ink:var(--gray-24); --line:var(--gray-13); --line-soft:var(--gray-16);
  --red-700:var(--red-12); --red-600:var(--red-18); --red-50:var(--red-19);
  --amber-700:var(--orange-12); --amber-600:var(--orange-14); --amber-50:var(--orange-15);
  --green-700:var(--green-12); --green-600:var(--green-16); --green-50:var(--green-11);
  --violet-700:var(--purple-13); --violet-50:var(--purple-14);
}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{font-family:Inter,sans-serif;font-size:14px;line-height:22px;color:var(--gray-24);background:var(--gray-19);
 -webkit-font-smoothing:antialiased}
button{font-family:inherit}
[hidden]{display:none!important}
svg{display:block}
.regular-1{font-size:12px;line-height:20px;font-weight:400}.regular-2{font-size:14px;line-height:22px;font-weight:400}
.regular-3{font-size:16px;line-height:24px;font-weight:400}.regular-4{font-size:20px;line-height:28px;font-weight:400}
.semibold-1{font-size:12px;line-height:20px;font-weight:600}.semibold-2{font-size:14px;line-height:22px;font-weight:600}
.semibold-3{font-size:16px;line-height:24px;font-weight:600;color:var(--gray-17)}
.semibold-4{font-size:20px;line-height:28px;font-weight:600}.semibold-5{font-size:24px;line-height:32px;font-weight:600}
.tnum{font-variant-numeric:tabular-nums}
.ar,th.ar,td.ar{text-align:right}
.sub{font-size:12px;line-height:18px;color:var(--gray-15)}
.cs{display:block;font-size:12px;font-weight:400;line-height:20px;color:var(--gray-12)}
.cn{background:none;border:0;padding:0;font:inherit;font-size:14px;font-weight:600;line-height:20px;color:var(--blue-15);cursor:pointer;text-align:left}
.cn:hover{color:var(--blue-11)}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sep{color:var(--gray-11);flex:none}
.sp{flex:1}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}

/* ── shell ─────────────────────────────────────────────────────────────────
   Sidebar: shadow/side-nav, ".8125px solid #E5E7EB" rounded to a rendering 1px.
   Global header: header/Height 44px, header/Background #F9FAFB (gray subtle),
   header/Border-Bottom #E5E7EB, header/Padding "6px 24px". Icon buttons:
   header/Icon-Wrapper-Size 32px, header/Icon-Size 20px.                      */
.app{display:flex;height:100vh;overflow:hidden;position:relative}
/* .app-sidebar, real: 240px expanded, white, border-right 1px $gray-13, NO shadow.
   Kept persistently expanded for an agency account rather than the real app's
   hover-to-expand-from-57px behaviour: that pattern exists so a single-workspace
   account doesn't need labels at rest, and an agency admin switching clients all
   day is the opposite case. That is the one deliberate interaction divergence
   left in this file; every colour, size and state below is the real component's. */
/* .app-sidebar, deployed, exact: no padding of its own except 12px at the foot;
   the header, the nav column and the footer each carry the product's own. */
.sb{position:absolute;left:0;top:0;bottom:0;z-index:999;width:57px;flex:none;background:var(--gray-1);display:flex;flex-direction:column;padding:0 0 12px;
 gap:0;overflow-y:auto;overflow-x:hidden;border-right:1px solid var(--gray-13);
 transition:width .3s ease-in-out}
/* .app-sidebar__nav, deployed, exact: a column with an 8px gap, padded 12px, no
   bottom padding. The gap is the rhythm the collapsed rail is read by. */
#navList{flex:1 1 auto;display:flex;flex-direction:column;gap:8px;padding:12px 12px 0;min-height:0}
/* 17 Sep 2026: with 17 items and 6 group labels the list is taller than a 900px rail. As
   flex items its children shrank to fit, and the only ones that could were the group labels
   (overflow:hidden gives them a zero minimum), so each collapsed to a blank 16px band on
   hover. Children keep their size and the rail scrolls, which it was already set up to do. */
#navList>*{flex:none}
/* 18 Sep, Hitesh: "items which should be stick bottom screen are not properly
   handled". The rule above also froze the spacer, so Settings and the two
   footer items sat under More with the rest of the rail empty. The spacer is
   the one child that grows; when the list is taller than the rail it collapses
   and the rail scrolls, as before. */
#navList>.nav-gap{flex:1 1 0;min-height:8px}
/* hover on a pointer device, and a pinned class for touch and for capture */
@media(hover:hover){.sb:hover{width:240px;box-shadow:2px 0 8px rgba(31,41,55,.08)}}
.sb.is-open{width:240px;box-shadow:2px 0 8px rgba(31,41,55,.08)}
/* everything that is not an icon is clipped rather than removed, so the width
   transition carries it and nothing reflows. Matches the real nav item, which
   sets overflow:hidden and animates all .2s. Opacity now shares the exact same
   duration and easing as the width transition, on both open and close, so the
   two always stay proportionally in step: at 50% of the animation the rail is
   half-open and the label is exactly half-opaque, never fully legible text in
   a still-mostly-collapsed rail. A delay-based version of this fix (opacity
   waiting, then fading in fast) was tried first and still left a timing window
   where full-opacity multi-word group labels ("Across your clients", "Owned by
   the agency") clipped mid-word inside a narrow rail; matching durations
   removes the race instead of trying to outrun it. Bug found 15 Sep 2026 from
   a screenshot caught mid-transition on an iPad, reported to persist after the
   first fix. */
.sb .lbl,.sb .nav-badge,.sb .nav-new,.sb-group,.sb .nm,.sb .ws-ctx,.sb-brand span,.sb .ws-btn svg{
 opacity:0;transition:opacity .3s ease-in-out}
.sb:hover .lbl,.sb:hover .nav-badge,.sb:hover .nav-new,.sb:hover .sb-group,.sb:hover .nm,
.sb:hover .ws-ctx,.sb:hover .sb-brand span,.sb:hover .ws-btn svg,
.sb.is-open .lbl,.sb.is-open .nav-badge,.sb.is-open .nav-new,.sb.is-open .sb-group,
.sb.is-open .nm,.sb.is-open .ws-ctx,.sb.is-open .sb-brand span,.sb.is-open .ws-btn svg{
 opacity:1;transition:opacity .3s ease-in-out}
/* a count still has to be visible on a collapsed icon, or the one thing the
   rail exists to signal is the thing it hides. The real sidebar solves it the
   same way: position:absolute on the icon, top:-2px left:15px. */
/* collapsed geometry. Group headings must give up their height, not just their
   ink, or the rail scrolls to accommodate labels nobody can read. */
.sb:not(:hover):not(.is-open) .sb-group{display:none}
.sb:not(:hover):not(.is-open) .sb-brand{justify-content:center}
.sb:not(:hover):not(.is-open) .sb-brand span{display:none}
.sb:not(:hover):not(.is-open) .sb-ws{padding:0;background:none}
.sb:not(:hover):not(.is-open) .ws-btn{padding:0;justify-content:center;gap:0}
/* collapsed, the item is a 32px square with the 20px icon 6px from every edge.
   The label keeps its width even at opacity 0 unless told otherwise, and that
   width pushed the icon off centre inside the active tile. */
.sb:not(:hover):not(.is-open) .nav-item{width:32px;padding:6px;gap:0;justify-content:flex-start}
.sb:not(:hover):not(.is-open) .nav-item .lbl{flex:0 0 0;width:0;overflow:hidden}
.sb:not(:hover):not(.is-open) .nav-item{position:relative}
.sb:not(:hover):not(.is-open) .nav-badge{position:absolute;top:-2px;left:15px;opacity:1;
 min-width:16px;height:16px;font-size:11px;padding:0 4px}
/* the New badge stays visible on the collapsed icon too, where the product puts it */
.sb:not(:hover):not(.is-open) .nav-new{position:absolute;top:0;left:15px;opacity:1;
 width:26px;height:14px;padding:1px 3px;display:flex;align-items:center;justify-content:center;line-height:12px}
/* .app-sidebar__header, deployed, exact: 50px, 11.5px vertical padding, 14px side
   margins, a 1px #e5e7eb rule beneath */
.sb-brand{display:flex;align-items:center;gap:6px;height:50px;flex:none;padding:11.5px 0;margin:0 14px;border-bottom:1px solid var(--gray-13);color:var(--gray-17);font-weight:700;font-size:16px}
.sb-brand svg{width:30px;height:26px}
/* the workspace switcher has no equivalent in the real sidebar at all (the real
   header slot holds only the logo); it is this feature's own new furniture per
   09 §2, styled to sit quietly inside the same rail rather than clash with it. */
.sb-ws{margin:12px 12px 0;border-radius:var(--radius-input);background:var(--gray-19);padding:4px;position:relative}
.ws-btn{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-radius:var(--radius-input);padding:8px;
 cursor:pointer;text-align:left;color:var(--gray-17)}
.ws-btn:hover{background:var(--gray-16)}
.ws-btn .nm{flex:1;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ws-btn .avatar{width:30px;height:30px;font-size:11px}
.ws-btn svg{color:var(--gray-11)}
.ws-ctx{display:block;font-size:11px;font-weight:500;color:var(--gray-15);margin-top:1px}
/* group labels are also new: the real rail is one flat list. Grouping earns its
   keep once Home/Work queue/Client Management/Billing exist beside the base
   product's items, which the real rail never has to distinguish. */
.sb-group{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--gray-11);
 padding:12px 12px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* .nav-item .lbl already had this exact safety net (line below); .sb-group did
   not, which is precisely why a multi-word group name ("Across your clients")
   could render as raw clipped characters mid-transition while a short nav
   label never did. Matched here rather than invented, so any width this rail
   is ever caught at, mid-animation or otherwise, degrades to a clean ellipsis
   instead of a cut-off word. */
/* .app-sidebar__nav-item, real, exact: 32px, 6px padding all sides, 8px gap,
   4px radius, hover #eff6ff, icon 20px $blue-15 (#1f2937) at rest, text 14px/500
   $blue-15. Active state is the brand's diagonal two-stop blue gradient with
   white icon and text, not a flat tint; same gradient as the logo mark. */
.nav-item{display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:6px;border:0;background:none;
 border-radius:var(--radius-control);color:var(--blue-15);font-size:14px;font-weight:500;cursor:pointer;text-align:left;position:relative}
.nav-item svg{width:20px;height:20px;flex:none;color:var(--blue-15)}
.nav-item:hover{background:#eff6ff;color:var(--blue-15)}
.nav-item[aria-current=page]{background:linear-gradient(46deg,#2563eb 17.53%,#3b82f6 96.95%);color:#fff}
.nav-item[aria-current=page] svg{color:#fff}
.nav-item .lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* app-sidebar__count-badge / __new-badge, real, exact: solid fills, white text,
   not tinted pills. */
.nav-badge{font-size:11px;font-weight:700;color:#fff;background:#10b981;border-radius:12px;
 min-width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;line-height:1}
.nav-badge.hot{background:#ef4444}
.nav-new{font-size:10px;font-weight:500;color:#fff;background:#f59e0b;border-radius:3px;padding:1px 5px;letter-spacing:0}
.nav-gap{flex:1}
/* 18 Sep QA: Status stole width from the name and usage columns on Home, so
   "Northwind Logistics" and "89% Prospects" wrapped. */
.crow td:first-child{min-width:230px}
.crow td:nth-child(5){min-width:160px}
.crow td:nth-child(2){width:36%}
/* .app-sidebar__footer, deployed: a 1px #e5e7eb divider, then items at the same 8px gap */
.sb-foot{border-top:1px solid var(--gray-13);padding-top:8px;display:flex;flex-direction:column;gap:8px}

.main{flex:1;min-width:0;display:flex;flex-direction:column;margin-left:57px}
.topbar{height:44px;flex:none;display:flex;align-items:center;gap:16px;padding:6px 24px;background:var(--gray-19);
 border-bottom:1px solid var(--gray-13);position:relative;z-index:30}
.psplit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:20px;align-items:start}
@media (max-width:1080px){.psplit{grid-template-columns:minmax(0,1fr)}}
.thread{position:fixed;top:0;right:0;bottom:0;width:480px;max-width:100vw;background:var(--gray-1);border-left:1px solid var(--gray-13);box-shadow:-8px 0 24px rgba(31,41,55,.12);z-index:90;display:flex;flex-direction:column}
.thread-h{padding:14px 20px;border-bottom:1px solid var(--gray-13);display:flex;justify-content:space-between;align-items:center;gap:12px}
.thread-b{flex:1 1 auto;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;background:var(--gray-19)}
.tmsg{border:1px solid var(--gray-13);border-radius:8px;padding:10px 14px;font-size:13.5px;line-height:20px;background:var(--gray-1);max-width:92%}
.tmsg p{margin:4px 0 6px;color:var(--gray-17)}
.tmsg-in{align-self:flex-start;background:var(--blue-17);border-color:var(--blue-13)}
.tmsg-out{align-self:flex-end}
.tmsg-out.is-sent{background:var(--st-success-bg);border-color:var(--st-success-bd)}
.thread-f{padding:16px 20px;border-top:1px solid var(--gray-13);flex:none}
#threadTxt{width:100%;min-height:96px;font:inherit;font-size:13.5px;line-height:20px;padding:10px 12px;border:1px solid var(--gray-13);border-radius:6px;resize:vertical;margin-bottom:12px;color:var(--gray-17)}
#threadTxt:focus{outline:none;border-color:var(--blue-11);box-shadow:0 0 0 3px var(--blue-13)}
.acc2{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
@media(max-width:1180px){.acc2{grid-template-columns:1fr}.acc-side{position:static}}
.acc-side{position:sticky;top:16px}
.preset-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.preset-card{text-align:left;border:1px solid var(--gray-13);border-radius:6px;padding:10px 12px;background:var(--gray-1);cursor:pointer;font:inherit;color:var(--gray-17);display:flex;flex-direction:column;gap:3px}
.preset-card:hover{border-color:var(--gray-23)}
.preset-card[aria-checked=true]{border-color:var(--blue-11);background:var(--blue-17);box-shadow:inset 0 0 0 1px var(--blue-11)}
.preset-card[disabled]{cursor:not-allowed;opacity:.7}
.preset-card b{font-size:13.5px;font-weight:600}
.preset-card i{font-style:normal;font-size:11.5px;line-height:15px;color:var(--gray-15)}
.preset-card.is-custom{border-style:dashed;border-color:var(--orange-14);background:var(--st-warn-bg)}
.accsec{padding:10px 0 6px}
.accsec+.accsec{border-top:1px solid var(--gray-24)}
.accsec .accgrp-h{padding:4px 0 6px}
.accgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.acccard-g{display:block;font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gray-11);margin-bottom:2px}
.acc-side .acc-dl{display:block;margin-top:14px}
.acc-side .acc-dl dt{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gray-11);margin:12px 0 3px}
.acc-side .acc-dl dt:first-child{margin-top:0}
.acc-side .acc-dl dd{margin:0;font-size:13px;line-height:19px;color:var(--gray-17)}
.acccard{border:1px solid var(--gray-13);border-radius:6px;padding:12px 14px;background:var(--gray-1)}
.acccard.is-off{background:var(--gray-19)}
.acccard.is-off .acccard-h b{color:var(--gray-15)}
.acccard-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.acccard b{font-size:14px;font-weight:500;color:var(--gray-17);display:block}
.acccard i{font-style:normal;font-size:12px;line-height:17px;color:var(--gray-15);display:block;margin-top:2px}
.accchks{margin-top:10px;border-top:1px dashed var(--gray-13);padding-top:4px}
.accchk{display:flex;gap:8px;align-items:flex-start;padding:6px 0;cursor:pointer}
.accchk input{margin:3px 0 0;flex:none;width:14px;height:14px;accent-color:var(--blue-11)}
.accchk b{font-size:13px}
.accchk.is-off{cursor:not-allowed}.accchk.is-off b{color:var(--gray-15)}
.mini-rail{border:1px solid var(--gray-13);border-radius:6px;overflow:hidden}
.mini-item{display:flex;align-items:center;gap:10px;padding:8px 12px;font-size:13.5px;color:var(--gray-17);border-bottom:1px solid var(--gray-24)}
.mini-item:last-child{border-bottom:0}
.mini-item svg{width:16px;height:16px;color:var(--blue-15);flex:none}
.mini-item em{margin-left:auto;font-style:normal;font-size:11px;color:var(--blue-11);font-weight:600;white-space:nowrap}
.mini-item.is-fixed{color:var(--gray-15)}.mini-item.is-fixed svg{color:var(--gray-11)}.mini-item.is-fixed em{color:var(--gray-11);font-weight:500}
.acctree{border-top:1px solid var(--gray-13)}
.accgrp{border-bottom:1px solid var(--gray-13)}
.accgrp:last-child{border-bottom:0}
.accgrp-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
 padding:10px 20px 4px;background:var(--gray-19)}
.accgrp-h span:first-child{font-size:11px;font-weight:600;letter-spacing:.06em;
 text-transform:uppercase;color:var(--gray-15)}
.accgrp-h span:last-child{font-size:11px;color:var(--gray-15)}
.accrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:12px 20px}
.accrow+.accrow{border-top:1px solid var(--gray-24)}
.accrow b{font-size:14px;font-weight:500;color:var(--gray-17);display:block}
.accrow i{font-style:normal;font-size:12px;line-height:17px;color:var(--gray-15);display:block;margin-top:2px}
.accmod.is-off b{color:var(--gray-15)}
.accacts{padding:0 20px 10px 34px}
.accacts .accrow{padding:9px 0 9px 14px;border-left:2px solid var(--gray-13);border-top:0}
.accacts .accrow+.accrow{margin-top:2px}
.accacts .accrow b{font-size:13px}
.accacts.is-off .accrow b{color:var(--gray-15)}
.accacts.is-off .accrow{border-left-color:var(--gray-24)}
.acctag{font-size:11px;color:var(--gray-15);border:1px solid var(--gray-13);border-radius:4px;
 padding:1px 6px;margin-left:8px;vertical-align:1px}
.crumb{display:flex;align-items:center;gap:8px;color:var(--gray-15);font-size:13px;min-width:0}
.crumb-tail{font-weight:600;color:var(--gray-17)}
.tb-search{display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:var(--radius-input);background:var(--gray-1);
 border:1px solid var(--gray-23);width:min(420px,40vw);color:var(--gray-11);position:relative}
.tb-search svg{width:16px;height:16px;flex:none}
.tb-search input{flex:1;border:0;background:transparent;font:inherit;font-size:13.5px;color:var(--gray-17);outline:none;min-width:0}
.tb-search input::placeholder{color:var(--gray-11)}
.tb-search kbd{font:inherit;font-size:10px;color:var(--gray-11);border:1px solid var(--gray-13);border-radius:5px;
 padding:0 5px;line-height:16px;background:var(--gray-1)}
.util{margin-left:auto;display:flex;align-items:center;gap:6px}
.ubtn{width:32px;height:32px;border-radius:var(--radius-input);border:0;background:none;display:grid;place-items:center;cursor:pointer;
 color:var(--gray-12);position:relative}
.ubtn:hover{background:var(--gray-16)}
.ubtn svg{width:20px;height:20px}
.ubadge{position:absolute;top:2px;right:0;font-size:9px;font-weight:700;color:#fff;background:var(--red-18);
 border-radius:999px;padding:0 4px;line-height:14px}
.me{display:flex;align-items:center;gap:8px;border:0;background:none;border-radius:999px;padding:4px 8px 4px 4px;cursor:pointer}
.me:hover{background:var(--gray-16)}
.me .avatar{width:30px;height:30px;border-radius:50%;font-size:11px}
.pop{position:fixed;width:360px;background:var(--gray-1);border-radius:var(--radius-surface);
 box-shadow:var(--shadow-dropdown);z-index:1001;overflow:hidden;border:1px solid var(--gray-13)}
.pop-s{padding:10px 10px 6px}
.pop-s input{width:100%;height:32px;border:1px solid var(--gray-13);border-radius:var(--radius-input);background:var(--gray-1);padding:0 12px;font:inherit;font-size:13px;outline:none}
.pop-l{max-height:min(64vh,520px);overflow:auto;padding:4px 6px 6px}
.pop-tag--warn{color:var(--orange-12)}.pop-tag--bad{color:var(--red-12)}
.pop-h{font-size:12px;font-weight:600;color:var(--gray-11);padding:10px 10px 4px;white-space:nowrap}
.acc-row{display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:start;padding:8px 0}
.acc-row b{font-size:13px;font-weight:600;color:var(--gray-17);display:block;line-height:1.4}
.acc-row i{font-style:normal;font-size:12px;color:var(--gray-15);display:block;line-height:1.45}
.acc-row .sw[disabled]{opacity:.4;cursor:not-allowed}
.pop-tag{margin-left:auto;font-size:11px;color:var(--gray-11);white-space:nowrap}
.pop-r{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;border-radius:var(--radius-input);padding:7px 10px;
 cursor:pointer;text-align:left;font:inherit;font-size:13px;color:var(--gray-17)}
.pop-r:hover,.pop-r[aria-current=true]{background:var(--blue-17)}
.pop-r .avatar{width:26px;height:26px;font-size:10px}
.pop-r .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pop-f{padding:8px 10px 10px;border-top:1px solid var(--gray-16)}
.ctx-bar{display:none}
.asbanner{background:var(--gray-17);color:#fff;font-size:13px;padding:8px 24px;display:flex;align-items:center;gap:12px;justify-content:space-between}
.asbanner button{border:0;border-radius:var(--radius-control);background:rgba(255,255,255,.14);color:#fff;font:inherit;font-size:12px;padding:5px 10px;cursor:pointer}
.page{flex:1;overflow-y:auto;min-width:0;background:var(--gray-19)}

/* ── page furniture ──────────────────────────────────────────────────────── */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 24px;flex-wrap:wrap}
.toolbar .semibold-3{font-size:22px;line-height:30px;letter-spacing:-.01em}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cell-main{display:flex;align-items:center;gap:10px;min-width:0}
/* subheader/*: the page-level tab row under the toolbar */
.tabbar{display:flex;gap:24px;padding:0 24px;border-bottom:1px solid var(--gray-13);background:var(--gray-1)}
.tabbar button{border:0;background:none;font:inherit;font-size:13px;font-weight:400;color:var(--gray-15);padding:18px 0;
 cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabbar button:hover{color:var(--blue-16)}
/* the deployed ink bar is 3px with a 2px top radius, not a 2px flat border.
   .bs-tabs-ink-bar{background-color:#1d4ed8;height:3px;border-top-left-radius:2px;
   border-top-right-radius:2px} */
.tabbar button[aria-selected=true]{color:var(--blue-11);font-weight:600;border-bottom-color:var(--blue-11);border-bottom-width:3px;border-top-left-radius:2px;border-top-right-radius:2px}
.wrap{padding:0 24px 32px;display:flex;flex-direction:column;gap:20px}
/* round 9: one rhythm from header to content. After a tab bar the wrap supplies the 20px; after a
   toolbar the toolbar's own 22px bottom padding does. Templates no longer set padding-top inline. */
.tabbar+.wrap{padding-top:20px}
.c-h+.tscroll{margin-top:12px}
.filters{padding:16px 24px 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:20px;align-items:start}
.dwrap{display:grid;grid-template-columns:minmax(0,2.4fr) minmax(320px,.9fr);gap:20px;padding:4px 24px 36px;align-items:start}
@media(min-width:1700px){.dwrap{grid-template-columns:minmax(0,3fr) minmax(380px,.85fr)}}
.dmain,.drail{display:flex;flex-direction:column;gap:20px;min-width:0}
/* the top row: This cycle and the rail's first card share a row, so they share
   a height. The KPI card's body grows to fill; the tiles keep their size. */
.dwrap-top{grid-template-rows:auto 1fr}
/* 18 Sep, Hitesh: "you made it bigger". This cycle keeps its natural height;
   Plan pacing is compacted to sit beside it, not the other way round. */
.dtop-l{grid-column:1;grid-row:1;display:flex;flex-direction:column;gap:20px;min-width:0;align-self:stretch}
.dtop-r{grid-column:2;grid-row:1;display:flex;flex-direction:column;min-width:0;align-self:stretch}
.dtop-l>.kgrp,.dtop-r>.card{flex:1}
.dtop-l>.kgrp{display:flex;flex-direction:column}
.dtop-l>.kgrp .kgrp-b{flex:1;display:flex;flex-direction:column;justify-content:center}
.dtop-r .c-b{padding-top:12px;padding-bottom:14px}
.dtop-r .big-v{font-size:22px!important;line-height:28px!important}
.dtop-r .big-s{font-size:12px;line-height:16px}
.dtop-r .pace-ws{margin:8px 0 0}
.dtop-r .pace-ws .lgd{margin-top:5px;gap:2px 10px}
.dtop-r .pace-ws .lgd span{flex:none}
.dtop-r .chart{margin-top:4px;width:100%;max-height:96px}
.pace-creds{display:flex;gap:4px 14px;flex-wrap:wrap;margin-top:8px}
.pace-creds span{display:inline-flex;align-items:center;gap:5px;font-size:11px;line-height:16px;color:var(--gray-12)}
.pace-creds i{width:6px;height:6px;border-radius:50%;flex:none}
.pace-creds b{font-weight:600;color:var(--gray-17)}
.dwrap-top>.dmain{grid-column:1;grid-row:2}
.dwrap-top>.drail{grid-column:2;grid-row:2}
.pace-ws{margin:10px 0 2px}
.pace-ws .lgd b{font-weight:600;color:var(--gray-17)}
@media(max-width:1180px){.dwrap-top{grid-template-rows:none}.dtop-l,.dtop-r,.dwrap-top>.dmain,.dwrap-top>.drail{grid-column:1;grid-row:auto}}
/* four across at 1440px, where the right rail leaves the main column ~810px.
   At 190px min they wrapped 3+1, which reads as a layout fault rather than a
   choice. Narrower viewports still wrap, which is correct.                */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:20px}

/* ── surfaces ──────────────────────────────────────────────────────────────
   .card: a generic surface (shadow/base-radius 6.479px, shadow/xs at rest).
   .panel: a table-wrapping surface (table/Container-Radius 8px, same shadow;
   TABLE_TOKENS gives the container its own #F3F4F6 border, kept here too). */
.card{background:var(--gray-1);border-radius:var(--radius-surface);box-shadow:var(--shadow-xs);border:0}
.panel{background:var(--gray-1);border-radius:var(--radius-table);box-shadow:var(--shadow-xs);
 border:1px solid var(--gray-16);overflow:hidden}
/* A panel whose entire content is a table is not a card in the real app: the
   table sits on the Gray50 page ground and carries its own 1px Gray200 border,
   so the wrapper must not add a second border, radius or shadow.            */
.panel:has(>.tscroll:only-child){background:transparent;border:0;box-shadow:none;border-radius:0;overflow:visible}
.c-h,.panel-h{display:flex;align-items:center;gap:12px;padding:20px 24px 0}
.panel-h{padding:18px 24px 14px}
.c-t,.panel-t{font-size:15px;line-height:22px;font-weight:600;color:var(--gray-17);white-space:nowrap}
.c-a{margin-left:auto;display:flex;align-items:center;gap:8px}
.c-b,.panel-b{padding:16px 24px 22px}
.panel-b{padding:16px 24px}
.nest{border-radius:var(--radius-input);background:var(--gray-19);margin-top:16px}
.nest-h{font-size:12px;font-weight:600;color:var(--gray-15);padding:12px 16px 0}
.nest-f{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px 14px;flex-wrap:wrap}

/* ── KPI tiles ───────────────────────────────────────────────────────────── */
/* grouped KPI card */
.kgrp-h{display:flex;align-items:center;padding:13px 18px;border-bottom:1px solid var(--gray-13)}
.kgrp-t{font-size:13.5px;font-weight:600;color:var(--gray-17)}
.kgrp-b{padding:16px 18px}
.ktiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.ktile{border:1px solid var(--gray-13);border-radius:6px;padding:13px 14px;background:var(--gray-19)}
.ktile-h{display:flex;align-items:center;gap:8px}
.ktico{width:24px;height:24px;border-radius:5px;background:#fff;border:1px solid var(--gray-13);
 color:var(--blue-11);display:grid;place-items:center;flex:none}
.ktico svg{width:13px;height:13px}
.ktl{font-size:12.5px;font-weight:500;color:var(--gray-12)}
.ktile-v{display:flex;align-items:center;gap:8px;margin-top:9px}
.ktv{font-size:24px;line-height:32px;font-weight:600;color:var(--gray-17);letter-spacing:-.02em;
 font-variant-numeric:tabular-nums}
.ktile-v .dchip{margin-left:auto}
.ktile-b{font-size:11.5px;line-height:17px;color:var(--gray-11);margin-top:2px;font-variant-numeric:tabular-nums}
.kgrp-f{padding:12px 18px;border-top:1px solid var(--gray-13);background:var(--gray-19);
 border-radius:0 0 6px 6px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.kgrp-fl{font-size:11.5px;color:var(--gray-12);flex:none}
.kgrp-f .sbar{flex:1;min-width:130px}
.kgrp-f .lgd{margin-top:0;flex:none}
.kpi{padding:18px 20px 0;display:flex;flex-direction:column}
.kpi-t{display:flex;align-items:center;gap:8px}
.kpi-t .dchip{margin-left:auto}
.kpi-l{font-size:13.5px;font-weight:500;color:var(--gray-12)}
.kpi-v{display:flex;align-items:center;gap:10px;font-size:28px;line-height:36px;font-weight:600;color:var(--gray-17);
 letter-spacing:-.02em;margin:8px 0 14px;font-variant-numeric:tabular-nums}
/* the footer band. auto top margin pins it to the card's base, and a fixed
   height keeps the rule on one line across the row: a card carrying a channel
   bar and a legend is taller inside than a card carrying one line of text, and
   without this its rule floats ten pixels above its neighbours' and the card
   reads as a different component. */
.kpi-c{margin:auto -20px 0;padding:11px 20px;border-top:1px solid var(--gray-13);
 background:var(--gray-19);font-size:12px;line-height:18px;color:var(--gray-11);
 min-height:52px;display:flex;flex-direction:column;justify-content:center}
/* one stacked bar per channel beats four chips: it never wraps, and it shows the
   mix as a proportion rather than as four numbers to compare by eye */
.sbar{display:flex;height:6px;border-radius:3px;overflow:hidden;gap:2px}
.sbar i{display:block;height:100%;border-radius:2px}
.lgd{display:flex;flex-wrap:wrap;gap:3px 12px;margin-top:8px}
.lgd span{display:inline-flex;align-items:center;gap:5px;font-size:11px;line-height:16px;color:var(--gray-12)}
.lgd i{width:6px;height:6px;border-radius:50%;flex:none}
.dchip{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;line-height:16px;flex:none}
.dchip svg{width:9px;height:9px}
.big{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.big-v{font-size:30px;line-height:38px;font-weight:600;color:var(--gray-17);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.big-s{font-size:13px;color:var(--gray-15);flex-basis:100%}
.pace{font-size:13px;line-height:19px;color:var(--gray-15);margin:6px 0 0}
.pace.bad{color:var(--orange-12)}

/* ── tables ────────────────────────────────────────────────────────────────
   Matched against the real rendered table, not the token docs: the generic
   organism in shared/design-system/.../organisms/_table.scss is overridden by
   _agency-client.scss, and the override is what ships. Header is Gray100
   (#f3f4f6) with a full 1px Gray200 (#e5e7eb) border and NO shadow, not the
   generic Gray50 + 0 4px 4px. Rows stay white and signal hover with a 4px
   ambient shadow rather than a background change. Cell padding is 10px 12px
   with a 32px first-cell inset and 17.6px last-cell inset.                 */
/* .table-list in the real app is a fixed-height scroll region with a sticky
   header (`position:sticky;top:0;z-index:2`) and a 7px scrollbar with a
   Gray200 thumb. Height is capped so long lists scroll under the header
   rather than pushing the page.                                            */
.tscroll{overflow-x:auto;overflow-y:auto;max-height:calc(100vh - 240px)}
.tscroll::-webkit-scrollbar{width:7px;height:7px}
.tscroll::-webkit-scrollbar-thumb{border-radius:4px;background-color:var(--gray-13)}
.tscroll::-webkit-scrollbar-track{background:transparent}
table.organism{border-collapse:collapse;width:100%;background:#fff}
table.organism th{font-size:12px;font-weight:600;color:var(--gray-12);text-align:left;padding:10px 12px;
 background:var(--gray-16);border-top:1px solid var(--gray-13);border-bottom:1px solid var(--gray-13);
 white-space:nowrap;letter-spacing:0;position:sticky;top:0;z-index:2}
table.organism th:first-child{padding-left:24px;border-left:1px solid var(--gray-13);border-top-left-radius:4px}
table.organism th:last-child{padding-right:24px;border-right:1px solid var(--gray-13);border-top-right-radius:4px}
table.organism td{font-size:14px;font-weight:500;line-height:18px;color:var(--blue-15);padding:11px 12px;
 border-bottom:1px solid var(--gray-13);vertical-align:middle}
/* Real scopes nowrap to the short numeric/label fields, not to every cell, so
   prose cells (a queue reason, a status explanation) still wrap.           */
table.organism td.tnum,table.organism td.ar{white-space:nowrap}
/* the th rule above sets text-align:left and outranks a bare `.ar` (0-1-2 vs
   0-1-1), which silently left-aligned every numeric header while its values
   stayed right-aligned. Do not simplify these selectors back.             */
table.organism th.ar,table.organism td.ar{text-align:right}
table.organism td:first-child{padding-left:24px;border-left:1px solid var(--gray-13)}
table.organism td:last-child{padding-right:24px;border-right:1px solid var(--gray-13)}
/* Real hover is an ambient shadow on a still-white row, from _agency-client.scss
   `tr:hover{box-shadow:0 0 .25rem rgba(31,41,55,.16)}`. Kept relative so the
   shadow is not clipped by the neighbouring cells' borders.                */
table.organism tbody tr{background:#fff;transition:box-shadow .2s ease}
table.organism tbody tr:hover{position:relative;z-index:1;box-shadow:0 0 4px rgba(31,41,55,.16)}
table.organism tbody tr:last-child td{border-bottom:1px solid var(--gray-13)}
/* 18 Sep QA: the group label starts where the first column's text starts */
table.organism tr.grouprow>td{padding:10px 24px 6px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--gray-11);border-bottom:0;background:transparent}
table.organism tr.att>td{background:transparent}
.colact{white-space:nowrap;width:1%}
/* column selector: trigger + popover, matching the real columns-selector */
.agency-idrow{display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--blue-14);
 border-radius:var(--radius-input);background:var(--gray-19);width:fit-content}
.colsel{position:relative}
.colsel-t{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:4px;
 color:var(--gray-15);transition:all .2s ease}
.colsel-t svg{width:20px;height:20px}
.colsel-t:hover{background:var(--gray-16)}
.colsel-t.on{color:var(--blue-11);background:var(--blue-13)}
.colsel-p{position:absolute;top:38px;right:0;z-index:60;width:280px;background:var(--gray-1);
 border:1px solid var(--gray-13);border-radius:4px;box-shadow:var(--shadow-dropdown);overflow:hidden}
.colsel-s{display:flex;align-items:center;gap:8px;height:32px;margin:8px;padding:0 12px;
 border:1px solid var(--gray-16);border-radius:var(--radius-input);color:var(--gray-11)}
.colsel-s svg{width:14px;height:14px;flex:none}
.colsel-s input{flex:1;border:0;background:transparent;font:inherit;font-size:13px;color:var(--gray-17);outline:none;min-width:0}
.colsel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 12px;
 border-top:1px solid var(--gray-13);border-bottom:1px solid var(--gray-13)}
.colsel-l{max-height:260px;overflow-y:auto;padding:4px 0}
.cbx{display:flex;align-items:center;gap:8px;padding:6px 12px;margin:0;font-size:14px;line-height:20px;
 color:var(--blue-15);cursor:pointer}
.cbx:hover{background:var(--blue-17)}
.cbx input{width:16px;height:16px;accent-color:var(--blue-11);flex:none;margin:0}
.cbx--off{color:var(--gray-11);cursor:not-allowed}
.cbx--off:hover{background:transparent}
/* Empty state, matching .agency-empty-list-container .content exactly:
   title 16px/700 Gray800 with 24px line-height, sub-title 14px/500 Gray500
   with 20px line-height and a 16px gap, action 32px below.                 */
.empty{text-align:center;padding:56px 24px}
.empty-t{font-size:16px;font-weight:700;line-height:24px;color:var(--blue-15);margin:0}
.empty-s{font-size:14px;font-weight:500;line-height:20px;color:var(--gray-15);margin:16px auto 0;max-width:420px}
.empty .shd-button{margin-top:32px}
/* 18 Sep: the Clients empty state as a centred hero, not a sliver */
.cempty-wrap{min-height:calc(100vh - 44px - 68px - 32px);justify-content:center;align-items:center}
.cempty{width:100%;max-width:880px;padding:36px 40px 32px}
.cempty-hero{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:32px;align-items:center}
.cempty-h{margin:6px 0 0;font-size:20px;line-height:28px;font-weight:600;letter-spacing:-.01em;color:var(--gray-17)}
.cempty-p{margin:10px 0 0;font-size:14px;line-height:22px;color:var(--gray-12)}
.cempty-cta{display:flex;align-items:center;gap:16px;margin-top:22px;flex-wrap:nowrap;white-space:nowrap}
.cempty-vis{padding:12px;width:360px;flex:none}
/* the name keeps its line; the three chips sit on one line beneath it */
.cempty-vis .fc-rail{width:100%;padding-left:34px;flex-wrap:nowrap;justify-content:flex-start;overflow:hidden}
.cempty-vis .fc-rail i{font-style:normal}
.cempty-vis .fc-rail .s{display:none}
.cempty-vis .fc-rail span{white-space:nowrap;flex:none}
.cempty-vis .fc-top b{overflow:hidden;text-overflow:ellipsis;min-width:0}
.cempty-vis .fc-tile i{min-height:30px}
.cempty-vis .fc-tile b{overflow:visible;white-space:normal}
.cempty-gets{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:32px;padding-top:24px;border-top:1px solid var(--gray-16)}
.cempty-get{display:flex;gap:12px;align-items:flex-start;min-width:0}
.cempty-ico{flex:none;width:34px;height:34px;border-radius:9px;background:var(--blue-13);color:var(--blue-11);display:flex;align-items:center;justify-content:center}
.cempty-ico svg{width:17px;height:17px;display:block}
.cempty-get b{display:block;font-size:14px;font-weight:600;line-height:20px;color:var(--gray-17);padding-top:7px}
.cempty-get i{display:block;font-style:normal;font-size:12.5px;line-height:18px;color:var(--gray-15);margin-top:2px}
@media(max-width:1180px){.cempty{padding:28px 32px}}
@media(max-width:900px){.cempty-hero{grid-template-columns:1fr}.cempty-gets{grid-template-columns:1fr}}
/* Row actions, revealed on row hover. Geometry is the real app's standard
   action button, which both the generic table organism (.action-icon-generic)
   and the agency-client override (.hoverable-cell--actions div) agree on:
   34x32, 4px radius, Gray500 resting, Blue100 fill + Blue700 icon on hover. */
.rowacts{display:flex;align-items:center;justify-content:flex-start;gap:16px}
.rowacts button{height:32px;width:34px;display:flex;align-items:center;justify-content:center;
 border:0;background:none;border-radius:4px;color:var(--gray-15);cursor:pointer;transition:all .2s ease}
.rowacts button svg{width:18px;height:18px}
.rowacts button:hover{background:var(--blue-13);color:var(--blue-11)}
/* The real pattern swaps content for actions on hover rather than shifting
   layout: hoverable-cell--content is shown at rest, --actions on row hover.  */
.hovercell{display:flex;align-items:center;justify-content:flex-start;gap:16px}
.hovercell .rowacts{visibility:hidden}
tr:hover .hovercell .rowacts,tr:focus-within .hovercell .rowacts{visibility:visible}
.sortable{display:inline-flex;align-items:center;gap:8px}
.sortable svg{width:12px;height:12px;color:var(--gray-11)}
/* 18 Sep, Hitesh: headers meet their values on every table. In a right-aligned
   column the sort icon sat after the label, so the label ended 20px left of
   the numbers under it. The icon leads in those columns; the label's right
   edge is the column's. */
table.organism th.ar .sortable{flex-direction:row-reverse}
.reason{display:block;font-size:12px;line-height:18px;color:var(--gray-15);white-space:normal;margin-top:2px;max-width:420px;font-weight:400}
.stat{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--gray-12);font-weight:400}
.stat i{width:7px;height:7px;border-radius:50%;display:inline-block}

/* ── chips / labels ────────────────────────────────────────────────────────
   SD(1) Label component: text is a fixed near-black regardless of status
   (textColor = "#1D1C1C" unless the solid variant), the hue lives only in the
   subtle background and the border. Height 24 (lg)/20 (sm), padding 4px 8px,
   pill radius. See 17-dashboard-map.md §8 for the one place this reads
   differently from the GitHub doc's coloured-text badge table.             */
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:4px 8px;border-radius:999px;
 font-size:12px;font-weight:500;line-height:1;white-space:nowrap;color:var(--label-text);
 border:1px solid transparent}
.c-ok{background:var(--st-success-bg);border-color:var(--st-success-bd)}
.c-warn{background:var(--st-warn-bg);border-color:var(--st-warn-bd)}
.c-bad{background:var(--st-error-bg);border-color:var(--st-error-bd)}
.c-info{background:var(--st-accent-bg);border-color:var(--st-accent-bd)}
.c-vio{background:var(--st-delight-bg);border-color:var(--st-delight-bd)}
.c-mute{background:var(--st-neutral-bg);border-color:var(--st-neutral-bd)}
.avatar{display:flex;align-items:center;justify-content:center;font-weight:500;border-radius:50%;flex:none;font-size:11px;width:28px;height:28px;box-sizing:border-box;background:var(--st-accent-bg);border:1px solid var(--avatar-ring);color:var(--blue-11)}
.avatar.av-tint{background:color-mix(in srgb,var(--c,#1d4ed8) 12%,#fff);border-color:color-mix(in srgb,var(--c,#1d4ed8) 28%,#fff);color:var(--c,#1d4ed8)}
.meter{display:flex;flex-direction:column;gap:5px;min-width:120px}
.track{height:5px;border-radius:var(--radius-control);background:var(--gray-16);overflow:hidden}
.track>span{display:block;height:100%;border-radius:var(--radius-control)}
.meter-t{font-size:12px;line-height:18px;color:var(--gray-15)}
/* two-line numeric cell: the count leads, the rate or the mix sits under it */
.stackv{display:block;font-weight:600;color:var(--ink)}
.stackb{display:block;font-size:11px;line-height:16px;color:var(--gray-12)}
/* usage, Home: the binding pool, then the rest, both in words */
/* 18 Sep, delight pass: decisions slide out and leave a receipt with Undo;
   an empty rail says when the last decision was; usage bars explain on hover */
.dq-out{transition:opacity .22s ease;opacity:0}
.pri2.dq-out{transform:translateX(24px);transition:opacity .22s ease,transform .22s ease}
.dq-receipt{display:flex;align-items:center;gap:10px;margin:0 24px 12px;padding:10px 14px;border-radius:var(--radius-control);
 background:var(--green-11);color:var(--gray-17);font-size:13px;line-height:18px;animation:dq-in .22s ease}
.dq-receipt--rail{margin:12px 16px 4px;padding:8px 10px;font-size:12.5px;line-height:17px}
.dq-receipt--rail .dq-tick{width:18px;height:18px}.dq-receipt--rail .dq-tick svg{width:11px;height:11px}
.dq-receipt--rail .linkbtn{font-size:12.5px}
.dq-receipt .dq-tick{flex:none;width:20px;height:20px;border-radius:50%;background:var(--green-16);color:#fff;display:grid;place-items:center}
.dq-receipt .dq-tick svg{width:12px;height:12px}
.dq-receipt .linkbtn{margin-left:auto;font-weight:600;flex:none}
.dq-receipt .dq-x{flex:none;width:24px;height:24px;color:var(--gray-12)}
.dq-receipt .dq-x svg{width:14px;height:14px}
@keyframes dq-in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.dq-receipt{animation:none}.dq-out,.pri2.dq-out{transition:none}}
.dq-empty{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:20px 24px 22px}
.dq-check{width:36px;height:36px;border-radius:50%;background:var(--green-11);color:var(--green-12);display:grid;place-items:center;margin-bottom:2px}
.dq-check svg{width:18px;height:18px}
.dq-empty-t{margin:0;font-size:14px;line-height:20px;font-weight:600;color:var(--gray-17)}
.dq-tip{position:relative;cursor:default}
.dq-card{display:none;position:absolute;left:0;top:calc(100% + 6px);z-index:30;width:max-content;min-width:150px;max-width:190px;
 background:var(--gray-24);color:#fff;font-size:11.5px;line-height:16px;font-weight:400;padding:8px 10px;border-radius:4px;box-shadow:var(--shadow-dropdown);text-align:left;white-space:normal}
.dq-tip:hover>.dq-card{display:block}
.dq-card b{display:block;font-weight:600;color:#fff}
.dq-card em{font-style:normal;font-weight:600;flex:none}
.dq-l{display:flex;justify-content:space-between;gap:10px;white-space:nowrap}
.dq-l>span,.dq-l>em{display:inline}
/* Home's Usage column is 145 px, so its card is denser and stays inside the column */
/* Home's Usage column is 145 px: too narrow for the lines, so the card hangs
   from the column's right edge and grows leftwards, away from Manage */
.crow .dq-card{left:auto;right:0}
.dq-card-r{display:block;margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,.18);color:#9CA3AF}
.dq-card-r .dq-l{display:flex}
/* 21 Sep 2026, delight pass round 1: the consequence tooltip. Same dark card as
   the usage tooltip above, but focusable, because the control it sits on is a
   button someone tabs to, not just hovers over. */
.dq-fore{display:none;position:absolute;left:0;top:calc(100% + 6px);z-index:30;width:max-content;max-width:260px;
 background:var(--gray-24);color:#fff;font-size:11.5px;line-height:16px;font-weight:400;padding:8px 10px;border-radius:4px;box-shadow:var(--shadow-dropdown);text-align:left;white-space:normal}
.dq-tip:hover>.dq-fore,.dq-tip:focus-within>.dq-fore{display:block}
td.colact .dq-fore,.pri-a .dq-fore{left:auto;right:0}
.u-head{display:block;font-size:13px;font-weight:600;line-height:18px}
.u-quiet{display:block;font-size:12px;line-height:18px;color:var(--gray-11)}
.u-sub{display:block;font-size:11px;line-height:16px;color:var(--gray-12);margin-top:1px}
/* usage, Clients: one row per pool in trouble */
.qa{display:none;margin:0 0 0 38px;gap:2px}
.qa button{width:26px;height:24px;border:0;background:none;border-radius:var(--radius-input);color:var(--gray-11);cursor:pointer;display:grid;place-items:center;padding:0}
.qa button svg{width:14px;height:14px}
.qa button:hover{background:var(--blue-17);color:var(--blue-11)}
.crow:hover .qa,.crow:focus-within .qa{display:flex}
.crow:hover .cell-main .cs,.crow:focus-within .cell-main .cs{display:none}
/* toggle: no dedicated geometry token in either source, so the pill itself
   keeps its established size; only colours are sourced (Blue700 on / Gray400 off,
   the checkBox,Radio & Toggle/secondary/Default token, not Gray300) */
.sw{width:28px;height:16px;border-radius:100px;border:0;background:var(--sw-off);position:relative;cursor:pointer;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:90px;background:var(--gray-1);transition:left .3s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw[aria-checked=true]{background:var(--sw-on)}
.sw[aria-checked=true]::after{left:14px}
.sw[disabled]{opacity:.5;cursor:default}

/* ── controls: BUTTON_SPECS + BTN_BASE_LAYOUT / BTN_BASE_LAYOUT_SM ──────────
   Medium 32px / padding 6px 16px. Small 28px / padding 4px 16px. Radius 4px
   on every variant, always. Hover/pressed shades are the exact spec values. */
/* metrics verbatim from @saleshandy/design-system dist/assets/css/design-system.css:
   height 2rem, padding .375rem 1rem, radius .25rem, gap .5rem, 14px/1.5rem, no border. */
.shd-button{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:32px;padding:6px 16px;
 border-radius:4px;font-size:14px;font-weight:500;line-height:24px;cursor:pointer;
 border:none;white-space:nowrap;background:var(--gray-1);color:var(--gray-15)}
.shd-button:disabled{opacity:.35;cursor:not-allowed}
.shd-button svg{width:16px;height:16px}
.shd-button--primary{background:var(--blue-11);color:#fff}
.shd-button--primary:hover,.shd-button--primary:active,.shd-button--primary:focus{background:var(--blue-20)}
.shd-button--tertiary{background:var(--gray-1);border:1px solid var(--gray-13);color:var(--gray-15)}
.shd-button--tertiary:hover{background:var(--gray-16)}
.shd-button--tertiary:active,.shd-button--tertiary:focus{background:var(--gray-16)}
.shd-button--secondary{background:transparent;border:1px solid var(--blue-11);color:var(--blue-11)}
.shd-button--secondary:hover,.shd-button--secondary:active,.shd-button--secondary:focus{background:var(--blue-13)}
.shd-button--danger{background:var(--red-12);color:#fff}
.shd-button--danger:hover{background:#991b1b}
.shd-button--sm{height:28px;padding:4px 16px;font-size:14px}
/* primary-text / Line-Item link button: no bg ever, colour shifts only */
.linkbtn{background:none;border:0;padding:0;font:inherit;font-size:13px;font-weight:500;color:var(--blue-11);cursor:pointer}
/* .shd-button--link underlines on hover, active and focus. Without it a link
   button is only distinguishable from body text by colour. */
.linkbtn:hover,.linkbtn:focus{color:var(--blue-20);text-decoration:underline}
.linkbtn:active{color:var(--blue-15)}
.linkbtn.quiet{color:var(--gray-15)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills button{display:inline-flex;align-items:center;gap:6px;height:28px;padding:4px 12px;border:0;background:var(--gray-16);
 border-radius:4px;font:inherit;font-size:12px;font-weight:500;line-height:18px;color:var(--gray-12);cursor:pointer}
.pills button:hover{background:var(--gray-13)}
.pills button[aria-pressed=true]{background:var(--blue-13);color:var(--blue-11)}
.pills .pn{font-size:10px;font-weight:600;background:rgba(255,255,255,.75);color:var(--gray-15);border-radius:2px;padding:1px 5px;line-height:16px}
.pills button[aria-pressed=true] .pn{background:#fff;color:var(--blue-11)}
.search{display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:var(--radius-input);
 border:1px solid var(--gray-23);background:var(--gray-1);color:var(--gray-11);min-width:200px}
.search svg{width:15px;height:15px;flex:none}
.search input{flex:1;border:0;background:transparent;font:inherit;font-size:13px;color:var(--gray-17);outline:none;min-width:0}

/* inputField/*: border, focus ring and text colours are exact tokens */
input[type=text],input[type=email],input[type=password],input[type=number],select{height:32px;border:1px solid var(--gray-23);
 border-radius:var(--radius-input);padding:0 16px;font:inherit;font-size:14px;line-height:20px;color:var(--gray-17);
 background:var(--gray-1);width:100%}
input[type=number]{width:96px;text-align:right}
textarea{border:1px solid var(--gray-23);border-radius:var(--radius-input);padding:8px 12px;font:inherit;
 font-size:14px;line-height:20px;color:var(--gray-17);background:var(--gray-1);width:100%;min-height:72px;resize:vertical}
textarea:hover{border-color:var(--blue-11)}
textarea:focus{outline:none;border-color:var(--blue-11);box-shadow:var(--focus-ring)}
.fld{display:block;font-size:12px;font-weight:600;line-height:16px;color:var(--gray-15);margin:0 0 4px}
.fld-e{display:block;font-size:12px;font-weight:500;line-height:20px;color:#b91c1c;margin-top:4px}
input::placeholder{color:var(--gray-11)}
input:hover,select:hover{border-color:var(--blue-11)}
input:focus,select:focus{outline:none;border-color:var(--blue-11);box-shadow:var(--focus-ring)}
input:disabled,select:disabled{background:var(--gray-19);color:var(--gray-15);border-color:var(--gray-23);cursor:not-allowed}
.field{margin-bottom:16px}
.flabel{display:block;font-size:13px;font-weight:500;color:var(--blue-16);margin-bottom:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;padding:4px 12px}
.stat{padding:14px 12px}
.stats>.stat{display:block}
.stat-l{font-size:12px;line-height:18px;color:var(--gray-15);display:flex;align-items:center;gap:6px}
.stat-v{font-size:22px;line-height:30px;font-weight:600;color:var(--gray-17);font-variant-numeric:tabular-nums;margin-top:2px}

/* banner/*: 4px radius, 12px/500 text, exact category colours. Padding is
   widened from the documented 4px 8px single-line strip because these carry
   two lines and an inline action; see 17-dashboard-map §8. */
.msg{display:flex;gap:10px;padding:12px 16px;border-radius:var(--radius-control);font-size:12px;font-weight:500;line-height:16px;align-items:flex-start}
.msg svg{width:16px;height:16px;flex:none;margin-top:2px}
.m-warn{background:var(--st-warn-bg);color:var(--blue-15);border:1px solid var(--st-warn-bd)}
.m-warn svg{color:var(--st-warn-ic)}
.m-bad{background:var(--st-error-bg);color:var(--blue-15);border:1px solid var(--st-error-bd)}
.m-bad svg{color:var(--red-12)}
.m-info{background:var(--blue-17);color:var(--blue-15);border:1px solid var(--blue-13)}
.m-ok{background:var(--st-success-bg);color:var(--green-12);border:1px solid var(--st-success-bd)}
.m-ok svg{color:var(--green-16)}
.m-info svg{color:var(--blue-11)}

/* ── rail rows, menus, search results ─────────────────────────────────────
   Menus/popovers/search use shadow/dropdown, the "select menus, filter
   dropdowns, action menus" elevation.                                     */
.pri2{display:flex;gap:12px;align-items:flex-start;padding:16px 24px;border-bottom:1px solid var(--gray-16)}
.pri2:last-child{border-bottom:0}
.pri2 .ring{width:20px;height:20px;flex:none;margin-top:2px}
.pri-b{flex:1;min-width:0}
.pri-t{display:block;font-size:13.5px;line-height:20px;font-weight:600;color:var(--gray-17)}
.pri-y{display:block;font-size:12.5px;line-height:18px;color:var(--gray-15);margin-top:2px}
.pri-m{display:block;font-size:11px;line-height:16px;color:var(--gray-11);margin-top:4px}
.pri-a{display:flex;gap:12px;align-items:center;margin-top:10px;flex-wrap:wrap}
.menu{position:absolute;top:calc(100% + 8px);right:0;width:300px;background:var(--gray-1);border-radius:var(--radius-surface);
 box-shadow:var(--shadow-dropdown);border:1px solid var(--gray-13);z-index:60;padding:6px;text-align:left}
.menu-h{padding:8px 12px 6px;font-size:12px;font-weight:600;color:var(--gray-15)}
.menu-i{display:flex;flex-direction:column;width:100%;text-align:left;border:0;background:none;font:inherit;padding:9px 12px;border-radius:var(--radius-input);cursor:pointer;gap:1px}
.menu-i:hover{background:var(--blue-17)}
.menu-c{flex-direction:row;align-items:center;gap:10px}
.menu-l{font-size:13.5px;font-weight:500;color:var(--gray-17)}
.menu-d{font-size:12px;color:var(--gray-15)}
.menu-back{color:var(--gray-15);font-size:12px;border-top:1px solid var(--gray-16);margin-top:4px;border-radius:0}
.srch{position:relative}
.srch-r{position:absolute;top:calc(100% + 8px);left:0;width:min(520px,80vw);max-height:440px;overflow:auto;background:var(--gray-1);
 border-radius:var(--radius-surface);box-shadow:var(--shadow-dropdown);border:1px solid var(--gray-13);z-index:70;padding:6px}
.srch-g{display:flex;align-items:center;gap:8px;padding:10px 12px 4px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--gray-11)}
.srch-i{display:grid;grid-template-columns:100px 1fr;column-gap:10px;width:100%;text-align:left;border:0;background:none;font:inherit;
 padding:8px 12px 8px 36px;border-radius:var(--radius-input);cursor:pointer}
.srch-i:hover{background:var(--blue-17)}
.srch-k{font-size:11px;color:var(--gray-11);grid-row:span 2;padding-top:2px}
.srch-l{font-size:13.5px;font-weight:500;color:var(--gray-17)}
.srch-s{font-size:12px;color:var(--gray-15)}
.srch-e{padding:14px;font-size:13px;color:var(--gray-15)}

/* ── charts ──────────────────────────────────────────────────────────────── */
.legend{display:flex;gap:14px;font-size:12px;color:var(--gray-15);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:2px;flex:none}
.legend i.dash{width:14px;height:0;border-top:2px dashed var(--gray-11);border-radius:0}
.sw[disabled]{opacity:.45;cursor:not-allowed}
.cnav{display:inline-flex;align-items:center;gap:4px;margin-right:4px}
.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 24px;border-top:1px solid var(--gray-13)}
.pager .tools{display:flex;align-items:center;gap:10px}
.estbar{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:12px 24px 11px;border-bottom:1px solid var(--gray-13)} /* 17 Sep: bottoms aligned and 11+1 so the pills sit exactly 12px above the table head, like every other filter row */
/* 18 Sep, Hitesh: headers meet their values on every table. The unit used to
   trail the box, so a right-aligned header met "credits", not the number. The
   unit now sits inside the box as a suffix; the box edge is the column edge. */
.numin{display:inline-flex;align-items:center;justify-content:flex-end;position:relative}
.numin input{width:172px;text-align:right;font-variant-numeric:tabular-nums;padding-right:82px}
.numin .unit{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--gray-11);white-space:nowrap;pointer-events:none}
.draftbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 24px;border-top:1px solid var(--gray-13);background:var(--blue-17);font-size:13px;line-height:19px;color:var(--gray-17)}
.draftbar .tools{display:flex;gap:8px;flex:none}
.cnav .ubtn{width:28px;height:28px;font-size:18px;line-height:1}
tr.is-focus td{background:var(--blue-17)}
tr.is-focus td:first-child{box-shadow:inset 3px 0 0 var(--blue-11)} /* 17 Sep 2026: the bar was drawn in every cell */
.chart{width:100%;height:auto;display:block;margin-top:12px;overflow:visible}
.chart .ax{font-size:10px;fill:var(--gray-11)}
.chart .cal{font-size:11px;font-weight:600;fill:#fff}
.gauge{width:100%;max-width:210px;height:auto;display:block;margin:4px auto 0}
.gauge .gv{font-size:26px;font-weight:600;fill:var(--gray-17)}
.gauge .gs{font-size:11px;fill:var(--gray-15)}
.segs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 20px;padding:12px 16px}
.seg-t{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.seg-l{font-size:12px;color:var(--gray-12)}
.seg-v{font-size:12px;color:var(--gray-15);margin-left:auto;white-space:nowrap}
.seg-b{height:6px;border-radius:var(--radius-control);background:var(--gray-16);overflow:hidden}
.seg-b>span{display:block;height:100%;border-radius:var(--radius-control)}
.hb{display:grid;grid-template-columns:1fr 100px 48px;align-items:center;gap:12px;margin-bottom:10px}
.hb:last-of-type{margin-bottom:0}
.hb-l{font-size:13px;color:var(--gray-12);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-t{height:8px;border-radius:var(--radius-control);background:var(--gray-16);overflow:hidden}
.hb-t>span{display:block;height:100%;border-radius:var(--radius-control)}
.hb-v{font-size:12px;color:var(--gray-15);text-align:right}
.ring{width:22px;height:22px}
.glbar{position:relative;height:6px;border-radius:var(--radius-control);background:var(--gray-16);margin-top:9px;max-width:440px}
.glbar>span{position:absolute;top:0;bottom:0;left:0;border-radius:var(--radius-control);background:var(--blue-11)}
.glbar>span.over{background:var(--red-18)}
.glbar>u{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--gray-17)}
.stack{height:12px;border-radius:var(--radius-input);overflow:hidden;display:flex;background:var(--gray-16)}
.stack>span{display:block;height:100%}
.swatch{width:8px;height:8px;border-radius:2px;flex:none;display:inline-block}

/* ── record, settings, link, drawer, modal ────────────────────────────────
   Modal: modal/Container-Radius 4px, header/body/footer padding "20px 24px",
   header border-bottom Gray200, footer radius "0 0 4px 4px", overlay
   rgba(17,24,39,.35), shadow/lg. Widths snapped to modal/Width-S (450px).
   Drawer: drawer/Margin 20px (a floating panel, not edge-flush, so 4px on all
   four corners is the coherent reading), drawer/Width-Small 432px,
   drawer/Head-Height 70px, same overlay + 20px margin.                      */
.dl{display:grid;grid-template-columns:130px 1fr;row-gap:8px;column-gap:12px;margin:0;font-size:13px}
.dl dt{color:var(--gray-15)}.dl dd{margin:0;color:var(--gray-17)}
.list-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--gray-16)}
.list-row:last-child{border-bottom:none}
.step-row{display:flex;align-items:center;gap:10px;padding:9px 0}
.tick{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--gray-23);display:grid;place-items:center;font-size:11px;color:#fff;flex:none}
.tick.on{background:var(--green-16);border-color:var(--green-16)}
.step-row.on .txt{color:var(--gray-15);text-decoration:line-through}
.conseq{border-radius:var(--radius-input);overflow:hidden;margin-top:12px;background:var(--gray-19)}
.conseq div{display:flex;justify-content:space-between;gap:12px;padding:9px 14px;font-size:13px;border-bottom:1px solid var(--gray-16)}
.conseq span:first-child{flex:0 0 42%;min-width:0}
.conseq div:last-child{border-bottom:none}
.conseq span:last-child{color:var(--gray-15);text-align:right;flex:1 1 auto;min-width:0}
/* the small inline confirm a round-2 consequential act shows under its own
   row, never a modal: .conseq's weight, laid out as one line with actions. */
.inlineconfirm{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
 background:var(--gray-19);border-radius:var(--radius-input);padding:10px 14px;font-size:13px;color:var(--gray-15)}
.inlineconfirm .tools{display:flex;gap:8px;flex:none}
.req{border-radius:var(--radius-input);background:var(--gray-19);padding:14px 16px;margin-bottom:10px}
.req:last-child{margin-bottom:0}
.req-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.lockrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--gray-16)}
.lockrow:last-child{border-bottom:0}
.lockctl{display:flex;align-items:center;gap:10px}
.swline{display:flex;align-items:flex-start;gap:12px}
.setwrap{display:grid;grid-template-columns:240px 1fr;gap:20px;align-items:start}
.setnav{background:var(--gray-1);border-radius:var(--radius-table);box-shadow:var(--shadow-xs);border:1px solid var(--gray-16);padding:8px;overflow:hidden}
.setnav h4{margin:0;padding:12px 12px 4px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--gray-11)}
.setnav button{display:flex;width:100%;align-items:center;gap:8px;text-align:left;border:0;background:none;font:inherit;font-size:13.5px;
 color:var(--gray-12);padding:8px 12px;border-radius:var(--radius-input);cursor:pointer}
.setnav button:hover{background:var(--gray-16)}
.setnav button[aria-current=true]{background:var(--blue-13);color:var(--blue-11);font-weight:600}
.setnav button .sc{margin-left:auto;font-size:10px;font-weight:600;color:var(--gray-11);flex:none}
.setnav button[aria-current=true] .sc{color:var(--blue-11)}
.gone-row{padding:8px 12px;font-size:13px;color:var(--gray-11)}
.gone-row s{text-decoration:line-through}
.inh{display:grid;grid-template-columns:160px 1fr}
.inh>div{padding:12px 24px;border-bottom:1px solid var(--gray-16);font-size:13.5px;line-height:20px}
.inh>div:nth-last-child(-n+2){border-bottom:none}
.inh .k{color:var(--gray-15)}
.lpath{display:grid;gap:8px}
.lpath button{display:block;text-align:left;background:var(--gray-1);border:1px solid var(--gray-13);border-radius:var(--radius-input);padding:12px 14px;font:inherit;cursor:pointer}
.lpath button[aria-pressed=true]{border-color:var(--blue-11);box-shadow:inset 0 0 0 1px var(--blue-11);background:var(--blue-17)}
.lp-t{display:block;font-size:14px;font-weight:600;color:var(--gray-17)}
.lp-d{display:block;font-size:12px;line-height:18px;color:var(--gray-15);margin-top:2px}
.lsec{margin-top:16px}.lsec-h{font-size:12px;font-weight:600;color:var(--gray-12);margin-bottom:8px}
.lgrid{display:grid;gap:8px}.lrow{display:flex;gap:8px;align-items:flex-start}
.ltick{width:16px;height:16px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;margin-top:2px}
.ltick.ok{background:var(--st-success-bg);color:#047857}.ltick.no{background:var(--st-error-bg);color:var(--red-12)}
.lt{display:block;font-size:13px;font-weight:500;color:var(--gray-17)}.ld{display:block;font-size:12px;line-height:18px;color:var(--gray-15)}
.scrim{position:fixed;inset:0;background:rgba(17,24,39,.35);z-index:80}
/* above the 999 sidebar, or the rail paints over the dialog it is meant to sit
   behind, and clips the dialog's left edge at narrow widths */
.mscrim{position:fixed;inset:0;background:rgba(17,24,39,.35);z-index:1099}
/* Add Client is a centred modal, not a side drawer, because that is what the
   real screen is: `.add-client .modal-content { width: 28.125rem;
   min-height: 26.063rem }`. The three steps stay; only the shell changed, so
   the most-used create path looks like the rest of the product. Body scrolls
   inside a capped height rather than the page growing.                      */
.drawer{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
 width:min(450px,calc(100vw - 32px));min-height:417px;max-height:calc(100vh - 64px);
 background:var(--gray-1);z-index:90;display:flex;flex-direction:column;
 box-shadow:var(--shadow-lg);border-radius:var(--radius-control);overflow:hidden}
.dr-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 24px 4px;border-bottom:0}
.dr-h .semibold-3{flex:1;min-width:0;font-size:16px;line-height:24px;font-weight:600;color:var(--gray-17)}
/* 18 Sep: pills read as filters, not progress. A numbered stepper with a
   line between the steps says where you are and how much is left. */
.dr-steps{display:flex;align-items:center;gap:8px;padding:14px 24px 0;list-style:none;margin:0}
.dr-steps li{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500;color:var(--gray-11);white-space:nowrap}
.dr-steps .st-n{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;
 border:1.5px solid var(--gray-23);color:var(--gray-15);background:var(--gray-1)}
.dr-steps li[data-on="1"]{color:var(--gray-17)}
.dr-steps li[data-on="1"] .st-n{background:var(--blue-11);border-color:var(--blue-11);color:#fff}
.dr-steps li[data-done="1"]{color:var(--green-12)}
.dr-steps li[data-done="1"] .st-n{background:var(--green-11);border-color:var(--green-11);color:var(--green-12)}
.dr-steps li[data-done="1"] .st-n svg{width:12px;height:12px}
.dr-steps .st-line{flex:1;height:1px;background:var(--gray-13);min-width:12px}
.dr-steps .st-line[data-done="1"]{background:var(--green-16)}
/* step 1: the two ways in, side by side, each with a mark so the choice reads
   before the words do */
.nc-paths{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nc-path{position:relative;text-align:left;background:var(--gray-1);border:1px solid var(--gray-13);border-radius:var(--radius-surface);
 padding:14px;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:10px;transition:border-color .15s,box-shadow .15s,background .15s}
.nc-path:hover{border-color:var(--gray-23)}
.nc-path[aria-checked="true"]{border-color:var(--blue-11);box-shadow:0 0 0 1px var(--blue-11);background:var(--blue-17)}
.nc-path .nc-ico{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--gray-16);color:var(--gray-12)}
.nc-path .nc-ico svg{width:16px;height:16px}
.nc-path[aria-checked="true"] .nc-ico{background:var(--blue-11);color:#fff}
.nc-path b{display:block;font-size:14px;font-weight:600;line-height:20px;color:var(--gray-17)}
.nc-path i{display:block;font-style:normal;font-size:12px;line-height:17px;color:var(--gray-15);margin-top:3px}
.nc-path .nc-tick{position:absolute;top:10px;right:10px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;
 background:var(--blue-11);color:#fff;opacity:0;transform:scale(.6);transition:opacity .15s,transform .15s}
.nc-path .nc-tick svg{width:11px;height:11px}
.nc-path[aria-checked="true"] .nc-tick{opacity:1;transform:scale(1)}
.nc-grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.nc-grid2 .field{margin-bottom:16px}
.nc-hint{display:flex;gap:6px;align-items:flex-start;margin-top:6px}
.nc-hint svg{width:14px;height:14px;flex:none;margin-top:2px;color:var(--gray-11)}
/* what the form is about to make, drawn as it will appear in the switcher */
.nc-prev{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px dashed var(--gray-23);border-radius:var(--radius-surface);
 background:linear-gradient(180deg,var(--gray-19),var(--gray-1))}
.nc-prev .avatar{width:36px;height:36px;border-radius:9px;font-size:13px;font-weight:600}
.nc-prev b{display:block;font-size:14px;font-weight:600;color:var(--gray-17);line-height:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nc-prev i{display:block;font-style:normal;font-size:12px;line-height:17px;color:var(--gray-15)}
.nc-prev.is-empty b{color:var(--gray-11);font-weight:500}
.nc-eyebrow{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--gray-11);margin-bottom:8px}
/* step 2: the same preset cards the Access tab shows, then the screens as
   toggles and the actions as checkboxes. One model, drawn smaller. */
.nc-sech{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.nc-sech .flabel{margin:0}
.nc-presets .preset-card{padding:9px 11px}
.nc-presets .preset-card b{font-size:13px}
.nc-presets .preset-card i{font-size:11px;line-height:14px}
.nc-screens{margin-top:12px;border:1px solid var(--gray-13);border-radius:var(--radius-control);background:var(--gray-1)}
.nc-screens>div{padding:10px 12px}
.nc-screens>div+div{border-top:1px solid var(--gray-16)}
.nc-screens .cs{display:flex;justify-content:space-between;margin-bottom:6px}
.nc-chips{display:flex;flex-wrap:wrap;gap:6px}
.nc-chip{height:26px;padding:0 10px;border-radius:999px;border:1px solid var(--gray-13);background:var(--gray-1);font:inherit;
 font-size:12px;font-weight:500;color:var(--gray-15);display:inline-flex;align-items:center;gap:5px;cursor:pointer;transition:all .12s}
.nc-chip svg{width:11px;height:11px}
.nc-chip:hover{border-color:var(--gray-23)}
.nc-chip[aria-pressed="true"]{border-color:var(--blue-11);background:var(--blue-17);color:var(--blue-11)}
.nc-chip[disabled]{cursor:not-allowed;opacity:.7}
.nc-verbs .accchk{padding:5px 0;align-items:flex-start}
.nc-verbs .accchk b{display:block;font-size:12.5px;font-weight:500;line-height:17px;color:var(--gray-17)}
.nc-verbs .accchk i{display:block;font-style:normal;font-size:11.5px;line-height:15px;color:var(--gray-15);margin-top:1px}
.nc-verbs .accchk.is-off b{color:var(--gray-15)}
.nc-staff{border:1px solid var(--gray-13);border-radius:var(--radius-control);background:var(--gray-1)}
.nc-staffrow{padding:10px 12px}
.nc-staffrow+.nc-staffrow{border-top:1px solid var(--gray-16)}
.nc-staffrow .nc-who{display:flex;align-items:center;gap:10px}
.nc-staffrow .avatar{width:28px;height:28px;border-radius:7px;font-size:11px;font-weight:600}
.nc-staffrow b{display:block;font-size:14px;font-weight:500;color:var(--gray-17);line-height:20px}
.nc-staffrow i{display:block;font-style:normal;font-size:12px;line-height:16px;color:var(--gray-15)}
.nc-staffrow .sw{margin-left:auto}
/* 18 Sep, delight pass: the three staff presets as one vertical radio list,
   full names, so the vocabulary stays the one the person page uses */
.nc-stpre{display:flex;flex-direction:column;gap:4px;margin:10px 0 0 38px}
.nc-stpre button{display:flex;align-items:center;gap:8px;width:100%;padding:6px 10px;border:1px solid var(--gray-13);border-radius:6px;background:var(--gray-1);font:inherit;text-align:left;cursor:pointer;color:var(--gray-17)}
.nc-stpre button:hover{border-color:var(--gray-23)}
.nc-stpre button[aria-checked="true"]{border-color:var(--blue-11);background:var(--blue-17);box-shadow:inset 0 0 0 1px var(--blue-11)}
.nc-stpre .rdo{flex:none;width:14px;height:14px;border-radius:50%;border:1.5px solid var(--gray-23);background:var(--gray-1)}
.nc-stpre button[aria-checked="true"] .rdo{border:4.5px solid var(--blue-11)}
.nc-stpre b{flex:1;font-size:12.5px;font-weight:500;white-space:nowrap}
.nc-stpre button[aria-checked="true"] b{font-weight:600}
.nc-stpre i{font-style:normal;font-size:11px;color:var(--gray-15);white-space:nowrap}
/* the first-client confirmation: the account today, and the shape it is about
   to take, drawn rather than described. */
.fc-lead{font-size:13.5px;line-height:20px;color:var(--gray-12);margin:0 0 14px}
.fc-vis{border:1px solid var(--gray-13);border-radius:12px;padding:14px;background:linear-gradient(180deg,var(--blue-17) 0%,var(--gray-1) 70%)}
.fc-top{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;background:var(--gray-1);border:1px solid var(--gray-13);border-radius:8px;padding:8px 10px;box-shadow:var(--shadow-xs)}
.fc-top .avatar{width:24px;height:24px;border-radius:6px;font-size:10px;font-weight:600}
.fc-top b{font-size:13px;font-weight:600;color:var(--gray-17);white-space:nowrap}
.fc-rail{flex:none;width:100%;display:flex;gap:4px;flex-wrap:wrap;padding-left:34px}
.fc-rail em{font-style:normal;font-size:11px;color:var(--gray-15);align-self:center;margin-right:2px}
.fc-rail span{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;background:var(--blue-13);color:var(--blue-11);font-size:11px;font-weight:600}
.fc-rail svg{width:11px;height:11px}
.fc-branch{display:block;width:100%;height:22px}
.fc-ws{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fc-tile{background:var(--gray-1);border:1px solid var(--gray-13);border-radius:8px;padding:10px 12px;min-width:0;box-shadow:var(--shadow-xs)}
.fc-tile.is-new{border-style:dashed;box-shadow:none;background:transparent}
.fc-tile .fc-nm{display:flex;align-items:center;gap:7px;min-width:0}
.fc-tile .avatar{width:22px;height:22px;border-radius:6px;font-size:9px;font-weight:600;flex:none}
.fc-tile b{font-size:12.5px;font-weight:600;color:var(--gray-17);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fc-tile i{display:block;font-style:normal;font-size:11px;line-height:15px;color:var(--gray-15);margin-top:6px}
.fc-tile .fc-kv{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.fc-tile .fc-kv span{font-size:11px;line-height:16px;color:var(--gray-12);background:var(--gray-19);border-radius:4px;padding:1px 6px;white-space:nowrap}
.fc-tile.is-new .fc-kv span{color:var(--gray-11);background:transparent;border:1px dashed var(--gray-13)}
.fc-facts{display:flex;flex-direction:column;gap:2px;margin-top:16px}
.fc-fact{display:flex;gap:12px;align-items:flex-start;padding:8px 0}
.fc-fact .fc-ic{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center}
.fc-fact .fc-ic svg{width:14px;height:14px}
.fc-fact span:last-child{font-size:13px;line-height:19px;color:var(--gray-12)}
.fc-fact b{font-weight:600;color:var(--gray-17)}
.fc-undo{display:flex;gap:9px;align-items:flex-start;margin-top:12px;padding:10px 12px;background:var(--gray-19);border-radius:8px;font-size:12.5px;line-height:18px;color:var(--gray-15)}
.fc-undo svg{flex:none;width:15px;height:15px;margin-top:1px}
/* the 720px wizard: Access in two columns, Limits as a small table */
.nc-cols{display:grid;grid-template-columns:minmax(0,1fr) 296px;gap:24px;align-items:start}
.nc-limhead{margin-bottom:14px}
.nc-limsay{margin:10px 2px 0;font-size:12.5px;line-height:18px;color:var(--gray-15)}
.nc-limsay b{font-weight:600;color:var(--gray-17)}
.nc-lim{border:1px solid var(--gray-13);border-radius:var(--radius-control);background:var(--gray-1)}
