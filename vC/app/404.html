<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/prd-workspaces-for-agencies/vC/app/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- PWA compatibility (SCAF-21) — manifest present; service worker lands later. -->
    <link rel="manifest" href="/prd-workspaces-for-agencies/vC/app/site.webmanifest" />
    <meta name="theme-color" content="#275df5" />
    <title>Saleshandy</title>
    <!-- Pre-paint theme init — stamps the persisted dark/light preference on
         <html> before first paint to avoid FOUC. Inline + synchronous on purpose. -->
    <script>
      ;(() => {
        const root = document.documentElement
        try {
          const ui = JSON.parse(localStorage.getItem('sh.ui') || '{}').state || {}
          root.setAttribute('data-theme', ui.theme === 'dark' ? 'dark' : 'light')
        } catch {
          root.setAttribute('data-theme', 'light')
        }
      })()
    </script>
    <script type="module" crossorigin src="/prd-workspaces-for-agencies/vC/app/assets/index-DnATKSi5.js"></script>
    <link rel="stylesheet" crossorigin href="/prd-workspaces-for-agencies/vC/app/assets/index-Dc0nHd7c.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
