   <td><div class="meter"><div class="track"><span style="width:${p}%;background:${barCol(tone)}"></span></div>
     <span class="meter-t tnum">${p}%</span></div></td>
   <td><span class="chip c-${tone}">${state}</span></td>
   <td class="ar colact">${pending
     ?`<span class="sub">Asked ${AGE(pending.when)}</span>`
     :st.pct>=R.warn||st.room===0
       ?`<button class="linkbtn" data-request="${k}">Request more</button>`
       :'<span class="sub">–</span>'}</td></tr>`}).join("");
 return `<div class="panel">

/* limits are edited as a draft and applied together. Typing a number used to
   change the pool on the spot, so a slip of the finger reallocated a client
   before the person had finished reading the row. Inputs are formatted text
   with a unit beside them; the number is parsed on change. */
let DRAFT={};
const dkey=(k,id,fld)=>k+"|"+id+"|"+fld;
const dval=(k,id,fld)=>{const d=DRAFT[dkey(k,id,fld)];return d==null?RES[k].rows[id][fld]:d};

/* ══ the sending estate ══════════════════════════════════════════════════════

     The agency buys mailboxes in the master workspace and assigns them down to
     a client workspace. When the client leaves, the mailbox comes back to the
     agency and can be given to the next client. A client may also buy its own
     inside its workspace, and those never transfer to the agency, because the
     agency never paid for them.

   That asymmetry is the whole decision, and it is the reason this screen exists
   rather than a paragraph: an agency's first question is what happens to the
   domains and mailboxes it paid for when a client walks. The answer has to be
   visible before they will move their estate onto us.

function doMbMove(addr,to){
 const rows=estateRows(), r=rows.find(x=>x.m[0]===addr);
 if(!r) return;
 const m=r.m;
 if(r.where) r.where.mailboxes=r.where.mailboxes.filter(x=>x[0]!==addr);
 else UNASSIGNED=UNASSIGNED.filter(x=>x[0]!==addr);

 [].concat(CLIENTS,[OWN_WS]).forEach(c=>{c.mbx=c.mailboxes.length});
}

/* ═══ A0 Dashboard, v3 ════════════════════════════════════════════════════════
   Built against 17 §2. Three jobs, weighted by how often each is needed:
     orient   health strip, KPI row, per-client bars, a compact plan card
     act      the decisions rail, with the controls back inline
     go       global search, a New menu that resolves the client first, and
              five quick actions on every client row
   The clients table is the launchpad, so it sits under the KPIs and the chart
   moves to the rail. Two rules unchanged: no blended rate, and a consequence
   sentence under every number.                                                */

const seqNames=c=>(c.sequences||[]).map(x=>x.name);
let dq="", newOpen=false, newPick=null, inMod="sequences";

/* ── go: search across every workspace the person is a member of ──────────── */
function searchAll(q){
 const t=q.trim().toLowerCase(); if(t.length<2) return [];
 const out=[];
 myClients().filter(c=>!isPending(c)).forEach(c=>{
  if(c.name.toLowerCase().indexOf(t)>-1||c.company.toLowerCase().indexOf(t)>-1)
    out.push({c,kind:"Client",label:c.name,sub:c.company,mod:"sequences"});
  (PROSPECTS[c.id]||[]).forEach(p=>{if((p.name+" "+p.co+" "+p.email).toLowerCase().indexOf(t)>-1)
    out.push({c,kind:"Prospect",label:p.name,sub:p.title+", "+p.co,mod:"prospects",pid:p.id})});
  seqNames(c).forEach(n=>{if(n.toLowerCase().indexOf(t)>-1)
    out.push({c,kind:"Sequence",label:n,sub:c.name,mod:"sequences"})});
  c.mailboxes.forEach(m=>{if(m[0].toLowerCase().indexOf(t)>-1)
    out.push({c,kind:"Email account",label:m[0],sub:m[1],mod:"accounts"})});
 });
 return out.slice(0,14);
}
function searchHTML(){
 const r=searchAll(dq);
 if(dq.trim().length<2) return "";
 if(!r.length) return '<div class="srch-r"><div class="srch-e">No results in the '+myClients().length
   +' workspaces you are a member of.</div></div>';
 let last=null;
 return '<div class="srch-r">'+r.map(x=>{
  const head=x.c.id!==last?'<div class="srch-g">'+av(x.c,18)+'<span>'+x.c.name+'</span></div>':"";
  last=x.c.id;
  return head+'<button class="srch-i" data-goto="'+x.c.id+'|'+x.mod+(x.pid?'|'+x.pid:'')+'">'

   +'<span class="srch-s">'+x.sub+'</span></button>'}).join("")+'</div>';
}

             +'<button class="linkbtn quiet" data-decline="'+q.req+'">Deny</button>';
 else if(q.raise){const [k,id]=q.raise.split("|"),m=compute(k),step=Math.max(500,Math.round(m.free*0.4/500)*500);
   act='<button class="shd-button shd-button--primary shd-button--sm" data-raise="'+q.raise+'">Raise to '+abbr(RES[k].rows[id].cap+step)+'</button>'}

 else if(q.collision) act='<button class="linkbtn" data-collision>Review</button>';

   act='<button class="linkbtn" data-goto="'+c.id+'|'+(q.act==="Reconnect"?"accounts":"sequences")+(mb?'|'+mb:'')+'">'+q.act+' &rarr;</button>'}

function planCard(){
 const sm=compute("sends"), used=sm.used, pool=sm.R.pool, sd=burnDays("sends");
 const early=CYCLE.days-CYCLE.day-Math.floor(sd);
 const creds=RK.filter(k=>RES[k].nature==="Consumable").map((k,i)=>{const m=compute(k),d=burnDays(k);
  return {l:RES[k].label.replace(" Credits",""),c:["#1D4ED8","#059669","#D97706"][i],
   v:(d===Infinity?"no burn":d<1?"under a day":Math.round(d)+" days left"),p:m.used/RES[k].pool*100}});
 return '<div class="card"><div class="c-h"><span class="c-t">Plan pacing</span>'
  +'<span class="c-a"><span class="sub">'+CYCLE.month+'</span></span></div>'
  +'<div class="c-b">'
  +'<div class="big"><span class="big-v" style="font-size:24px;line-height:32px">'+f(used)+'</span>'+deltaChip(pctDelta(used,LAST.sent))
  +'<span class="big-s">of '+f(pool)+' emails, '+Math.round(elapsed()*100)+'% of the cycle gone</span></div>'
  +(sd<CYCLE.days-CYCLE.day
    ?'<p class="pace bad">At this burn the plan is exhausted around <b>'+onDay(sd)+'</b>, '+early+' days early.</p>'
    :'<p class="pace">On pace to finish the cycle inside the plan.</p>')
  +planChart(true)
  +segbars(creds)
  +'<div class="tools" style="margin-top:12px">'
   +'<button class="shd-button shd-button--tertiary shd-button--sm" data-goalloc="sends">Allocate</button>'
   +(sd<CYCLE.days-CYCLE.day?'<button class="shd-button shd-button--secondary shd-button--sm" data-gobill>Add capacity</button>':'')
  +'</div></div></div>';
}

/* ═══ the agency's own outreach modules ═══════════════════════════════════════
   One renderer for every Outreach rail item in the agency workspace. The rule
   it exists to make visible: what you see here is the agency's own, scoped the
   same way a client workspace is scoped. Never an aggregation across clients,
   because a roll-up here would quietly undo the isolation the rest of the
   model depends on. Modules the workspaces feature does not change are stated
   as scoped rather than redrawn, the same way Growth Hub is.               */
/* the rail speaks in short keys, the client shell in module names. One map, so
   a rail click lands on the same thing in either workspace.               */
/* Templates joins the modules that are really drawn inside a client workspace.
   Without it, `parked` treats the Templates tab as an un-redrawn module and the
   client half of Pattern A never appears, which is the half that answers the
   question. */
const SCOPE_NOTE={
 leads:["A pool at the account, a cap per workspace",
  "The search tool is identical everywhere and needs no scoping. What is scoped is the credit it spends, which comes out of one pool you bought, and the lead record it produces, which belongs to the workspace that revealed it. Two clients can pay to reveal the same person and we will not dedupe it, because deduping means showing one client's records to another."],
 dialer:["Per workspace, and it has no client dimension today",
  "Phone numbers, calls and recordings carry no client field in the product as it stands, which is why a call cannot be attributed to a client at all right now. Under this model each one belongs to the workspace it was made from."],
 verify:["A pool at the account, a cap per workspace",
  "One pooled quota with a ceiling per client, exactly as Lead Finder. The lists themselves belong to the workspace that uploaded them."],
 radar:["Infrastructure at the account, results at the workspace",
  "The seed estate across Gmail, Yahoo and Outlook is bought and maintained once. A placement test, though, tests a specific domain and mailbox, so its result belongs to that workspace. A client can see its own deliverability without seeing your seed estate or any other client's score."],
};
/* the only three Outreach modules the master workspace still answers for. The
   first two are cross-client by nature and the third is a publishing decision.
   Everything else moved to the agency's own workspace, so a deep link to it now
   lands there rather than 404ing or showing an empty agency screen.        */
const MASTER_MOD={inbox:1,task:1,tmpl:1,mail:1};
const RAIL2MOD={seq:"sequences",crm:"prospects",inbox:"inbox",mail:"accounts",tmpl:"tmpl"};
/* the client's own view models five screens, so only the rail items that map
   to one are offered while viewing as the client. */
const RAIL2CVIEW={seq:"sequences",inbox:"inbox",crm:"prospects",leads:"leads",
 mail:"accounts",analytics:"analytics",usage:"usage",cws:"workspace"};
/* what a client calls each screen. One name per thing, used by the rail, the
   orientation line and the landing rule alike. */
const CLIENT_LBL={sequences:"Sequences",inbox:"Replies",prospects:"Prospects",leads:"Lead Finder",
 accounts:"Email accounts",analytics:"Reports",usage:"Usage"};
const AGY_MOD={
 seq:["Sequences","The agency's own campaigns, for winning clients"],
 task:["Tasks","Tasks on the agency's own outreach","Tasks across the clients you work on"],
 inbox:["Unified Inbox","Replies to the agency's own campaigns","Replies across the clients you work on"],
 leads:["Lead Finder","Sourcing for the agency's own pipeline"],
 crm:["CRM","The agency's own prospects: companies it wants as clients"],
 dialer:["Dialer","Calls on the agency's own outreach"],
 verify:["Email Verifier","Verification for the agency's own lists"],
 mail:["Email Accounts","Mailboxes on the agency's own domain"],
 tmpl:["Templates","The agency's own templates"],
 radar:["Inbox Radar","Placement for the agency's own domain"],
 analytics:["Analytics","Performance of the agency's own outreach"],
};
function vAgencyMod(){
 const k=view.name,[label,subOwn,subAcross]=AGY_MOD[k],O=AGENCY_OWN;
 /* the line that has to be on every one of these screens */
 /* the toggle this used to carry is gone. "Across your clients" and "the
    agency's own" were two scopes on one screen, and they are now two
    workspaces, which is the whole point of the 11 Sep change. In the master
    workspace a roll-up is always across clients.                          */
 const rollup=AGY_ROLLUP[k], across=!!rollup;
 /* the agency's own workspace is a peer, so its work joins the queue like any
    client's. Its rows name it, exactly as a client's rows name the client. */
 const rollSources=()=>myClients().concat(canI("dashboard")?[OWN_WS]:[]);
 /* the line that has to be on every one of these screens. For the two modules
    that roll up, it says which scope you are looking at instead of claiming
    nothing rolls up at all.                                               */
 const scope=rollup
  ?`<div class="msg m-info">${infoI}<span>${across
     ?`Across the <strong>${myClients().length} client${myClients().length===1?"":"s"}</strong>
       assigned to ${ME().name}, newest first. Every row names its client, and nothing from a
       client you are not a member of appears here.`
     :`<strong>${AGENCY.name}'s own</strong> ${label.toLowerCase()} only, for the campaigns the
       agency runs for itself.`}</span></div>`
  :`<div class="msg m-info">${infoI}<span>This is <strong>${AGENCY.name}'s own</strong>
   ${label.toLowerCase()}. A client's ${label.toLowerCase()} live in that client's workspace; use the
   switcher to go into one.</span></div>`;
 const toggle=rollup?`<button class="shd-button shd-button--tertiary" data-go2own>
    ${AGENCY.name}'s own ${label.toLowerCase()} &rarr;</button>`:"";
 /* the four modules this feature does not redraw still have a scoping decision
    behind them, and that decision is the thing an agency can react to. A
    placeholder that says "not redrawn" and stops is a dead end in a demo; one
    that states where the module's records and its quota live is the same screen
    doing work. Each line is the row from 20's matrix rather than a paraphrase. */
 const parked=t=>{const n=SCOPE_NOTE[k];
  return `<div class="panel">
   <div class="panel-h"><span class="panel-t">${t}</span>
    ${n?`<span class="c-a"><span class="chip c-info">${n[0]}</span></span>`:""}</div>
   <div class="panel-b"><p class="sub" style="margin:0">${n?n[1]
     :"The existing Saleshandy module, scoped to the agency workspace."}</p>
   </div></div>`};
 let body;
 if(k==="seq"){
  body=O.sequences.length?`<div class="panel"><div class="tscroll"><table class="organism" style="min-width:720px">
    <thead><tr><th>Sequence Name</th><th class="ar">Prospects</th><th class="ar">Contacted</th>
     <th class="ar">Replied</th><th>Status</th></tr></thead>
    <tbody>${O.sequences.map(([n,st,pr,ct,rp])=>`<tr>
      <td><span style="font-weight:600;color:var(--blue-15)">${n}</span></td>
      <td class="ar tnum">${f(pr)}</td><td class="ar tnum">${f(ct)}</td>
      <td class="ar tnum">${rp?rp.toFixed(1)+"%":"–"}</td>
      <td><span class="chip c-${st==="Active"?"ok":st==="Paused"?"warn":"mute"}">${st}</span></td></tr>`).join("")}
    </tbody></table></div></div>`
   :`<div class="panel"><div class="empty"><p class="empty-t">No sequences of its own</p>
     <p class="empty-s">${AGENCY.name} runs campaigns for clients but none for itself. That is a
     normal way to use the product, and nothing here is missing.</p></div></div>`;
 } else if(k==="tmpl"){
  const shared=tmplShared().length, locked=TEMPLATES.filter(t=>t.locked).length;
  const live=CLIENTS.filter(c=>!isPending(c));
  const holding=t=>live.filter(c=>{const x=tmplFor(c);
    return x.inherited.some(i=>i.id===t.id)||x.overrides.some(o=>o.base===t.id)}).length;
  const overridden=t=>live.filter(c=>(CLIENT_TMPL[c.id]||[]).some(o=>o.base===t.id)).length;
  body=`<div class="panel">
   <div class="panel-h"><span class="panel-t">Agency library</span>
    <span class="sub">${TEMPLATES.length} templates &middot; ${shared} published to every client workspace &middot; ${locked} locked</span></div>
   <div class="tscroll"><table class="organism" style="min-width:880px">
    <thead><tr><th>Template</th><th>Where it appears</th><th>Client can edit</th>

/* ═══ Dashboard, the agency home ══════════════════════════════════════════════
   Rail item 1, and where an agency account lands at login instead of Sequences.
   Zone order is deliberate: what needs a decision, then whether the agency is
   pacing right, then the clients ranked. Two rules hold it together.

   1. Zone 1 carries only what an owner can resolve and an operator cannot, plus
      operator work that has aged past its consequence. Without that rule this
      becomes a second inbox competing with the queue in All clients.
   2. Nothing here is a blended rate across clients. One reply rate across five
      unrelated ICPs is arithmetic, not information, and that is the shape that
      was promised in Mar 2024 and never shipped.                              */

const CYCLE={day:9,days:30,month:"September 2026"};        /* today is 9 Sep 2026 */
const elapsed=()=>CYCLE.day/CYCLE.days;
const PACE_DAYS=3;   /* under this many days of runway, pacing stops being a card */
/* ═══ the agency's card fails ═════════════════════════════════════════════════
   Decided 12 Sep 2026, after the Aug 2025 incident in which an agency's failed
   payment locked its clients out: during the agency's grace period a created
   client workspace stays readable, sending pauses, and the client's paused
   state names the agency and never the reason. Linked clients are on their own
   plan and are untouched. Reachable with #grace. */
const GRACE={on:false,failedOn:"7 Sep",daysLeft:5};
/* decided 12 Sep 2026: on a linked workspace the agency may open it as the
   client sees it only if the client granted that, at approval or later from
   their Workspace screen. Off by default. A created workspace is the agency's. */
const canViewAs=c=>!isLinked(c)||!!(c.link&&c.link.viewAs);
const viewAsBtn=(c,cls)=>canViewAs(c)
 ?`<button class="${cls}" data-asclient="${c.id}">View as client</button>`
 :`<button class="${cls}" disabled title="${c.name} has not granted this. They can, from the Workspace screen in their account.">View as client</button>`;
const grace=()=>GRACE.on;
const graceBanner=()=>grace()?`<div class="msg m-bad grace" style="margin-bottom:20px">${warnI}<span><strong>Payment failed on ${GRACE.failedOn}.</strong>
  ${GRACE.daysLeft} days to update the card before the account pauses. Your clients keep reading their workspaces; nothing is sending.
  ${canI("billing")?'<button class="linkbtn" data-gobill>Update payment</button>':"An owner updates the card."}</span></div>`:"";
const graceNote=c=>grace()&&!isLinked(c)?`<div class="msg m-warn grace" style="margin-bottom:16px">${warnI}<span>Sending is paused by ${AGENCY.name}.
  You can see everything as usual; your sequences resume when they restart them.</span></div>`:"";
/* headroom in days at the burn rate observed so far this cycle */
const burnDays=k=>{const m=compute(k),perDay=m.used/CYCLE.day;
  return perDay>0?m.free/perDay:Infinity};
const runsOut=()=>RK.filter(k=>RES[k].nature!=="Storage")
  .map(k=>({k,d:burnDays(k)})).sort((a,b)=>a.d-b.d)[0];
const onDay=d=>{const n=CYCLE.day+Math.floor(d);
  return n>CYCLE.days?"after the cycle resets":n+" Sep"};
const ageDays=t=>{const m=/(\d+)\s*day/.exec(t||"");if(m)return +m[1];
  return /yesterday/.test(t||"")?1:0};
const myCaps=k=>myClients().reduce((t,c)=>t+((RES[k].rows[c.id]||{cap:0}).cap),0);
const medianCPP=()=>{const v=myClients().map(costPer).filter(x=>x!=null).sort((a,b)=>a-b);
  if(!v.length)return null;const h=v.length>>1;
  return v.length%2?v[h]:(v[h-1]+v[h])/2};

/* what an owner has to decide, ordered by what it costs to leave alone */
function dashItems(){
 const out=[];
 RK.forEach(k=>{const m=compute(k);
  fundedWorkspaces().forEach(c=>{const st=rowState(k,c.id,m);
   if(st.room===0&&!REQUESTS.some(r=>r.client===c.id&&r.res===k))
    out.push({score:90,sev:"critical",client:c.id,raise:k+"|"+c.id,act:"Raise limit",age:"today",
      what:c.name+" is at its "+RES[k].label.toLowerCase()+" limit and has stopped",
      why:f(m.free)+" "+RES[k].unit+" sit unallocated in the pool. Only you can raise this."})})});
 REQUESTS.filter(r=>myClientsFor("usage").some(c=>c.id===r.client)).forEach(r=>{const m=compute(r.res);
  out.push({score:80,sev:"decision",client:r.client,req:r.id,act:"Approve",age:r.when,
    what:byId[r.client].name+" asked for "+f(r.amount)+" more "+RES[r.res].label.replace(/^Monthly |^Active /,"").toLowerCase(),
    why:r.note+" Approving leaves "+f(Math.max(0,m.free-r.amount))+" in the pool."})});
 /* operator work escalates here once it has aged. A disconnected mailbox is not
    the owner's job until nobody has done it for two days, at which point it is. */
 INFRA().filter(a=>a.client==="__x"||ageDays(a.age)>=2).forEach(a=>{
  const cross=a.client==="__x", c=cross?null:byId[a.client];
  out.push({score:cross?35:a.sev==="critical"?85:a.kind==="Bounce rate rising"?75:50,sev:a.sev,age:a.age,act:a.act,
    client:c?c.id:null, collision:cross,
    what:cross?a.kind:a.kind+" on "+c.name+", unresolved for "+a.age,
    why:a.kind==="Bounce rate rising"
        ?a.detail+". Every client sending from this domain pool is exposed, not only this one."
      :a.kind==="Email account disconnected"
        ?a.detail+". Volume the client is paying for is not going out."
      :a.detail+"."})});
 /* a link request nobody has approved is stalled onboarding, and only the agency
    can chase it. The client cannot approve something they were never told about. */
 myClients().filter(isPending).forEach(c=>out.push({score:70,sev:"decision",client:c.id,act:"Open",
   age:c.link.requested, what:c.name+" has not approved the workspace link yet",
   why:"Requested "+AGE(c.link.requested)+" from "+c.link.owner+". Nothing moves until they accept, and they may not have seen it."}));
 /* a client going quiet, which is what churn looks like before the email arrives */
 myClients().forEach(c=>{if(c.prev&&c.reply&&c.reply<c.prev*0.75)
  out.push({score:65,sev:"warning",client:c.id,act:"Open",age:"this cycle",
    what:c.name+" reply rate fell from "+c.prev.toFixed(1)+"% to "+c.reply.toFixed(1)+"%",
    why:"Down "+Math.round((1-c.reply/c.prev)*100)+"% this cycle. Nothing in the product will tell them, and nothing will tell you again."})});
 return out.sort((a,b)=>b.score-a.score);
}

/* the reason a client is pinned to the top of zone 3, or null */
function attention(c){
 /* a disabled client outranks everything else that could be said about it.
    Nothing it does matters until it is re-enabled, and the row has to say so
    or the agency thinks sending stopped when it did not. */
 if(c.disabled) return{rank:-1,pin:true,chip:"Disabled",tone:"c-bad",
   why:"Sending is stopped and nothing goes out. Re-enable to start again. Nothing has been lost."};
 const m=medianCPP(), cp=costPer(c);
 const lim=funded(c)?RK.map(k=>({k,st:rowState(k,c.id,compute(k))})).filter(x=>x.st.room===0):[];
 if(lim.length) return{rank:0,pin:true,chip:"At limit",tone:"c-bad",
   why:RES[lim[0].k].label+" is exhausted. Sending and sourcing stop until you raise it."};
 /* a quarter down and at least a point down. Without the floor a move from
    1.2 to 0.8 flags, and at forty clients a third of the book is "Falling". */
 if(c.prev&&c.reply&&c.reply<c.prev*0.75&&c.prev-c.reply>=1) return{rank:1,pin:true,chip:"Falling",tone:"c-warn",
   why:"Reply rate down from "+c.prev.toFixed(1)+"% last cycle. Worth a call before they ask for one."};
 if(cp!=null&&m&&cp>m*2) return canI("billing")
   ?{rank:2,pin:true,chip:"Costly",tone:"c-warn",
     why:"Costs "+(cp/m).toFixed(1)+"x the median per positive reply. Priced right, or served wrong?"}
   :{rank:2,pin:true,chip:"Low yield",tone:"c-warn",
     why:f(positives(c))+" positive replies from "+f(c.sent)+" sent."};
 /* a brand new client is a lifecycle state, not a decision, so it carries a chip
    but does not jump the queue above a client that is actually running */
 if(c.sent===0) return{rank:9,pin:false,chip:"Not started",tone:"c-mute",
   why:(4-doneN(c))+" of 4 setup steps remain, so nothing has been sent for them yet."};
 return null;
}

/* ═══ A0 Dashboard, the agency home ══════════════════════════════════════════
   Card grid, not stacked tables. Layout follows the references Hitesh supplied:
   a KPI row with the delta chip top-right and an explicit "Compare N (last
   month)" line, a chart card with a legend and a highlighted point, a table card
   with counted tab pills, and a right rail of priority items with "See all".

   Styling stays inside the Saleshandy design system: Blue 700, Inter, 4px radius,
   12px/600 #4B5563 headers, 32px controls. The richness comes from layout and
   charts, not from inventing a rounder, softer visual language.

   The one rule that did not change: no blended rate across unrelated clients.
   Counts, money, pacing and per-client comparisons are all legitimate as tiles
   and charts, so adopting the card form costs nothing. There is still no single
   reply rate on this screen.                                                    */

/* last cycle, for the comparison line on each tile */
const LAST={clients:4, sent:98400, positives:1870, cost:820.90};
const DASH_ROWS=8;   /* the dashboard ranks; the full list lives in Clients */
/* cumulative daily sends, days 1..9 of the cycle, summing to the 124,600 in RES */
const DAILY=[4200,6800,9500,12800,15600,17200,18400,19100,21000];

const myUsed=kk=>myClients().reduce((t,c)=>t+((RES[kk].rows[c.id]||{used:0}).used),0);
const abbr=n=>n>=1000?(n/1000).toFixed(n%1000&&n<10000?1:0).replace(/\.0$/,"")+"k":String(n);
const pctDelta=(now,then)=>then?((now-then)/then*100):null;
function deltaChip(d,invert,abs){
 if(d===null||!isFinite(d)) return "";
 const up=d>=0, good=invert?!up:up;
 const col=good?"var(--green-700)":"var(--red-600)";
 const bg=good?"var(--green-50)":"var(--red-50)";
 const arrow=up?"M6 3.5 9.5 8h-7z":"M6 8.5 2.5 4h7z";
 const txt=abs!==undefined?(up?"+":"")+abs:(up?"+":"")+d.toFixed(d>=10||d<=-10?0:1)+"%";
 return '<span class="dchip" style="color:'+col+';background:'+bg+'">'
  +'<svg viewBox="0 0 12 12" aria-hidden="true"><path fill="currentColor" d="'+arrow+'"/></svg>'
  +txt+'</span>'}

function kpi(label,icon,value,delta,compare,invert,abs){
 return '<div class="card kpi">'
  +'<div class="kpi-t"><span class="kpi-l">'+label+'</span>'
   +(delta===null?'<span class="kpi-i">'+icon+'</span>':deltaChip(delta,invert,abs))+'</div>'
  +'<div class="kpi-v">'+value+'</div>'
  +'<div class="kpi-c">'+compare+'</div></div>'}

/* ── cumulative sends against the straight-line plan budget ─────────────────── */
function planChart(compact){
 const R=RES.sends, pool=R.pool, W=640, H=compact?150:196, L=46, T=22, B=34, Rr=14;
 const px=d=>L+(d-1)/(CYCLE.days-1)*(W-L-Rr);
 const py=v=>H-B-(v/pool)*(H-T-B);
 let run=0; const pts=DAILY.map((v,i)=>{run+=v;return[px(i+1),py(run),run,i+1]});
 const last=pts[pts.length-1];
 const line=pts.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
 const area="M"+px(1).toFixed(1)+","+py(0).toFixed(1)+" L"+line.replace(/ /g," L")
   +" L"+last[0].toFixed(1)+","+py(0).toFixed(1)+" Z";
 const grid=[0,1/3,2/3,1].map(fr=>{const y=py(pool*fr);
   return '<line x1="'+L+'" x2="'+(W-Rr)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="var(--line-soft)"/>'
    +'<text x="'+(L-8)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end" class="ax">'+(fr?abbr(pool*fr):"0")+'</text>'}).join("");
 const xlab=[1,8,15,22,30].map(d=>'<text x="'+px(d).toFixed(1)+'" y="'+(H-12)+'" text-anchor="middle" class="ax">'+d+' Sep</text>').join("");
 /* callout on the last real day, the reference puts the value in a chip on the line */

  +'<line x1="'+last[0].toFixed(1)+'" y1="'+T+'" x2="'+last[0].toFixed(1)+'" y2="'+py(0)+'" stroke="var(--gray-300)" stroke-dasharray="3 3"/>'
  +'<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="4.5" fill="#1D4ED8" stroke="#fff" stroke-width="2"/>'
  +'<rect x="'+cx.toFixed(1)+'" y="'+cy.toFixed(1)+'" width="'+cw+'" height="20" rx="3" fill="var(--gray-800)"/>'
  +'<text x="'+(cx+cw/2).toFixed(1)+'" y="'+(cy+14).toFixed(1)+'" text-anchor="middle" class="cal">'+f(last[2])+'</text>'

/* ── radial gauge, the "Repeat Customer Rate" pattern from the reference ────── */
function gauge(pct,big,sub){
 const W=210,H=126,cx=W/2,cy=H-14,r=76,N=44;
 const on=Math.round(N*Math.min(1,pct/100));
 let t="";
 for(let i=0;i<N;i++){
  const a=Math.PI-(i/(N-1))*Math.PI, x1=cx+Math.cos(a)*(r-13), y1=cy-Math.sin(a)*(r-13);
  const x2=cx+Math.cos(a)*r, y2=cy-Math.sin(a)*r;
  const c=i<on?(pct>=90?"#DC2626":pct>=75?"#D97706":"#1D4ED8"):"var(--gray-200)";
  t+='<line x1="'+x1.toFixed(1)+'" y1="'+y1.toFixed(1)+'" x2="'+x2.toFixed(1)+'" y2="'+y2.toFixed(1)
   +'" stroke="'+c+'" stroke-width="3" stroke-linecap="round"/>'}
 return '<svg viewBox="0 0 '+W+' '+H+'" class="gauge" role="img" aria-label="'+big+' '+sub+'">'+t
  +'<text x="'+cx+'" y="'+(cy-16)+'" text-anchor="middle" class="gv">'+big+'</text>'
  +'<text x="'+cx+'" y="'+(cy+2)+'" text-anchor="middle" class="gs">'+sub+'</text></svg>'}

/* ── labelled coloured bars, the nested "Customers" card pattern ───────────── */
function segbars(rows){
 return '<div class="segs">'+rows.map(r=>'<div class="seg">'
  +'<div class="seg-t"><span class="dot" style="background:'+r.c+'"></span>'
   +'<span class="seg-l">'+r.l+'</span><span class="seg-v tnum">'+r.v+'</span></div>'
  +'<div class="seg-b"><span style="width:'+Math.min(100,r.p).toFixed(0)+'%;background:'+r.c+'"></span></div>'
  +'</div>').join("")+'</div>'}

/* ── horizontal comparison, per client. Never a blend ──────────────────────── */
function byClient(){
 const rows=[...myClients()].sort((a,b)=>positives(b)-positives(a));
 const max=Math.max(1,...rows.map(positives));
 return rows.map(c=>{const v=positives(c);
  return '<div class="hb"><span class="hb-l">'+c.name+'</span>'
   +'<span class="hb-t"><span style="width:'+(v/max*100).toFixed(0)+'%;background:'+c.colour+'"></span></span>'
   +'<span class="hb-v tnum">'+(v?f(v):"0")+'</span></div>'}).join("")}

/* ── the right rail: priority items with a progress ring and See all ───────── */
function ring(done,total,tone){
 const r=9,c=2*Math.PI*r,p=total?done/total:0;
 return '<svg viewBox="0 0 24 24" class="ring" aria-hidden="true">'
  +'<circle cx="12" cy="12" r="'+r+'" fill="none" stroke="var(--gray-200)" stroke-width="2.5"/>'
  +'<circle cx="12" cy="12" r="'+r+'" fill="none" stroke="'+tone+'" stroke-width="2.5" stroke-linecap="round"'
  +' stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+(c*(1-p)).toFixed(1)+'" transform="rotate(-90 12 12)"/></svg>'}

/* ═══ Settings, context aware ═════════════════════════════════════════════════

 ["dncall","Do Not Call List","company","A floor + W","Same rule as the do-not-contact list."],
 ["wl","Whitelabel","agency","A",

 const nCompany=SETS.filter(x=>x[2]!=="user").length;

 return `<div class="toolbar">

   ${agency&&canI("billing")?`<div class="msg m-info">${infoI}<span>Your migration summary is

   ${agency?"":`<div class="msg m-info">${infoI}<span>This workspace carries

/* ═══ Work queue: rail item, not a workspace ═════════════════════════════════
   This replaces the old "All clients" entry in the workspace switcher. The
   switcher answers "whose data am I in", and "everyone's at once" is not an
   answer to that: it is why the context stripe had to be an invented grey dash.

   The queue is the operator's home and it is deliberately wider than the
   Dashboard's right rail. The rail carries what an owner must decide; this
   carries everything anyone must do, replies and setup steps included.
   Performance and cost is gone, because the Dashboard's client table and its
   Cost to serve tile are the same data with a better frame.                    */
function vQueue(){
 const n=queueItems().length;
 return `<div class="toolbar">
   <div class="cell-main"><span style="min-width:0">
     <span class="semibold-3">Work queue</span>
     <span class="sub" style="display:block">${n} item${n===1?"":"s"} across the
      ${myClients().length} client${myClients().length===1?"":"s"} assigned to ${ME().name},
      ordered by what it costs to ignore</span></span></div>
   <div class="tools">
     <button class="shd-button shd-button--tertiary" data-nav2="clients">Clients</button>
     ${canI("dashboard")?`<button class="shd-button shd-button--tertiary" data-godash>Dashboard</button>`:""}
   </div></div>
  <div class="wrap" style="padding-top:4px">${aQueue()}</div>`;
}

/* moving between clients without the switcher: previous and next in the
   header, and a way back to the queue when that is where you came from. Sam
   works eighteen items across two clients; the switcher was three clicks each. */
let qFrom=null;
const wsList=()=>myClients().filter(c=>!isPending(c));
function clientNav(c){
 const L=wsList(), i=L.findIndex(x=>x.id===c.id);
 if(i<0||L.length<2) return "";
 const p=L[(i-1+L.length)%L.length], n=L[(i+1)%L.length];
 return `<span class="cnav"><button class="ubtn" data-cprev="${p.id}" title="Previous: ${p.name}" aria-label="Previous client, ${p.name}">&#8249;</button><span class="sub tnum">${i+1} of ${L.length}</span><button class="ubtn" data-cnext="${n.id}" title="Next: ${n.name}" aria-label="Next client, ${n.name}">&#8250;</button></span>`;
}
function queueBack(){
 if(!qFrom) return "";
 const Q=queueItems(); let j=qFrom.i+1; while(j<Q.length&&!Q[j].client) j++;
 return `<button class="shd-button shd-button--tertiary" data-backq>Back to queue</button>`
  +(j<Q.length?`<button class="shd-button shd-button--tertiary" data-nextq="${j}">Next in queue</button>`:"");
}
const Q_DEST={"Email account disconnected":"accounts","Bounce rate rising":"accounts",
 "Sequence stalled":"sequences","Setup incomplete":"overview","Near limit":"limits"};
const destFor=q=>Q_DEST[q.kind]||(/limits near$/.test(q.kind)?"limits":"overview");
let focusMb=null;
/* the four destinations that are record tabs rather than workspace modules */
const RECTAB={update:1,overview:1,limits:1,access:1};
function gotoClient(id,mod,pid){
 if(RECTAB[mod]){ctx="agency";view={name:"record",id};tab=mod;render();return}
 ctx=id; asClient=false; inMod=mod; openProspect=mod==="prospects"?(pid||null):null; focusMb=mod==="accounts"?(pid||null):null;
 if(view.name==="settings")view={name:"clients"}; render()}
/* One queue. An operator does not think in categories, they think about what needs them
   next, so ordering is by what it costs to ignore rather than by item type. */
function queueItems(){
 const out=[];
 const add=(o)=>out.push(o);
 INFRA().forEach(a=>{
  /* each alert is actionable on exactly one screen, so it belongs to whoever can
     open that screen. An alert you cannot act on is noise you cannot clear.  */
  const NEED={"Email account disconnected":"accounts","Bounce rate rising":"accounts",
    "Sequence stalled":"sequences","Prospect overlap":"prospects"};
  if(a.client&&NEED[a.kind]&&!iSee(a.client,NEED[a.kind])) return;
  const mb=(a.detail.match(/\S+@\S+\.\w+/)||[])[0];
  if(a.kind==="Email account disconnected") add({score:100,sev:"critical",kind:a.kind,client:a.client,mb,
    why:`3 days of sending lost. ${byId[a.client].name} is not receiving the volume they pay for`,age:a.age,act:"Reconnect"});
  else if(a.kind==="Bounce rate rising") add({score:60,sev:"warning",kind:a.kind,client:a.client,mb,
    why:"Left alone this damages the domain and every client sending from it",age:a.age,act:"Investigate"});
  else if(a.kind==="Sequence stalled") add({score:55,sev:"warning",kind:a.kind,client:a.client,
    why:"A campaign the client is paying for has stopped",age:a.age,act:"Open"});
  else if(a.kind==="Prospect overlap"&&myClients().length>1) add({score:10,sev:"info",kind:a.kind,client:null,
    why:"Two of your clients are contacting the same people",age:a.age,act:"Review",collision:true});
 });
 /* the one event that stops every client at once. Owner and admin see it,
    because they are the ones who can add capacity or move allocation. */
 /* outranks a dead mailbox: one mailbox stops one client, this stops all of them */
 if(grace()&&canI("limits")) add({score:101,sev:"critical",kind:"Payment failed",client:null,pay:true,
   why:`Failed on ${GRACE.failedOn}. ${GRACE.daysLeft} days before the account pauses. Every client is reading and nothing is sending`,age:"today",act:"Update payment"});
 const ro=canI("limits")?runsOut():null;
 if(ro&&ro.d<PACE_DAYS) add({score:95,sev:"critical",kind:"Plan runs out",client:null,plan:true,
   why:`${RES[ro.k].label} at this burn is gone ${onDay(ro.d)}. Every client stops with it`,age:"today",act:"Add capacity"});
 REQUESTS.filter(r=>myClientsFor("usage").some(c=>c.id===r.client)).forEach(r=>{const m=compute(r.res);
   add({score:80,sev:"decision",kind:"Capacity request",client:r.client,
     why:`${byId[r.client].name} is blocked and asked for ${f(r.amount)} more ${RES[r.res].unit}. ${f(m.free)} unallocated`,
     age:r.when,act:"Approve",req:r.id})});
 RK.forEach(k=>{const m=compute(k);
  myClientsFor("usage").forEach(c=>{const st=rowState(k,c.id,m);
    if(st.room===0&&!REQUESTS.some(r=>r.client===c.id&&r.res===k))
      add({score:90,sev:"critical",kind:"At limit",client:c.id,
        why:`${RES[k].label} stopped. ${byId[c.id].name} cannot continue until you raise it`,age:"today",act:"Raise limit",raise:k+"|"+c.id})})});
 REPLIES.filter(r=>myClientsFor("inbox").some(c=>c.id===r.client)).forEach(r=>
   add({score:r.positive?70:45,sev:r.positive?"reply":"info",kind:r.positive?"Positive reply":"Reply",client:r.client,
     why:`${r.from} · ${r.snippet}`,age:r.age,act:"Reply",reply:r.id}));
 /* name the steps that are actually outstanding. Saying "email accounts" when
    the missing step is limits sends the operator to the wrong tab.         */
 /* 16 §2.1 step 5: deferring the prospect review must leave something behind,
    or the pile is forgotten and a client's leads sit in the agency workspace
    indefinitely. Owner-scoped, because only the owner can resolve it.      */
 if(MIG.deferred&&MIG.unassigned>0&&canI("billing"))
   add({score:60,sev:"decision",kind:"Prospect review",client:null,
     why:`${f(MIG.unassigned)} prospects from the migration are still unassigned, sitting in your agency workspace`,
     age:"since launch",act:"Review",migreview:true});
 myClients().forEach(c=>{const miss=steps(c).filter(x=>!x[1]).map(x=>x[0].toLowerCase());
  if(miss.length) add({score:20,sev:"info",kind:"Setup incomplete",client:c.id,
     why:`${miss.length} step${miss.length===1?"":"s"} left. ${c.name} cannot send until ${miss.join(" and ")}`,
     age:"open",act:"Finish"})});
 const near=[];
 RK.forEach(k=>{const m=compute(k);myClients().forEach(c=>{const st=rowState(k,c.id,m);
   if(st.state==="Near limit")near.push({c:c.id,l:RES[k].label,p:Math.round(st.pct*100)})})});
 myClients().forEach(c=>{const n=near.filter(x=>x.c===c.id);if(n.length)
   add({score:40,sev:"warning",kind:n.length===1?"Near limit":`${n.length} limits near`,client:c.id,
     why:n.map(x=>`${x.l} ${x.p}%`).join(" · "),age:"today",act:"Review"})});
 return out.sort((a,b)=>b.score-a.score);
}
function aQueue(){
 const Q=queueItems();
 const pill={critical:"c-bad",decision:"c-info",warning:"c-warn",reply:"c-ok",info:"c-mute"};
 /* 16 §7 step 4: a row opens the client's workspace on the module the work
    actually lives in, with the context stripe in the client's colour. Landing
    on the record Overview instead makes the operator navigate twice and drops
    the stripe, which is the peripheral cue the safety rule leans on. Limits
    and setup are genuinely agency-side, so those two stay on the record and
    open the right tab rather than Overview.                                */
 const label={critical:"Critical",decision:"Decision",warning:"Warning",reply:"Reply",info:"Info"};
 const rows=Q.map((q,i)=>{const c=q.client?byId[q.client]:null;
  return `<tr>
   <td style="width:34px"><span class="sub tnum">${i+1}</span></td>
   <td><span class="chip ${pill[q.sev]}">${label[q.sev]}</span></td>
   <td><span style="font-weight:600;color:var(--gray-800)">${q.kind}</span>
     <span class="cs" style="display:block;white-space:normal">${q.why}</span></td>
   <td>${c?`<div class="cell-main">${av(c,24)}<span class="trunc">${c.name}</span></div>`:q.plan||q.pay?'<span class="sub">Every client</span>':'<span class="sub">2 clients</span>'}</td>
   <td><span class="sub">${AGE(q.age)}</span></td>
   <td class="ar colact">${
     q.req?(canI("limits")?`<button class="linkbtn" data-ok="${q.req}">Approve</button>`:`<span class="sub">Waiting on the agency</span>`)
     :q.raise?(canI("limits")?`<button class="linkbtn" data-raise="${q.raise}">Raise limit</button>`:`<span class="sub">Waiting on the agency</span>`)
     :q.migreview?`<button class="linkbtn" data-migreview>Review</button>`
     :q.collision?`<button class="linkbtn" data-collision>Review</button>`
     :q.reply?`<button class="linkbtn" data-openreply="${q.reply}">Reply</button>`
     :q.plan||q.pay?`<button class="linkbtn" data-gobill>${q.act}</button>`
     :c?`<button class="linkbtn" data-goto="${c.id}|${destFor(q)}${q.mb?"|"+q.mb:""}">${q.act}</button>`
     :`<button class="linkbtn">${q.act}</button>`}</td></tr>`}).join("");
 const n=t=>Q.filter(x=>x.sev===t).length;
 return `<div class="panel">
   <div class="stats">
    <div class="stat"><span class="stat-l">Needs you now</span><span class="stat-v" style="color:#B91C1C">${n("critical")}</span></div>
    <div class="stat"><span class="stat-l">Decisions</span><span class="stat-v" style="color:#1D4ED8">${n("decision")}</span></div>
    <div class="stat"><span class="stat-l">Replies</span><span class="stat-v" style="color:#047857">${n("reply")}</span></div>
    <div class="stat"><span class="stat-l">Everything else</span><span class="stat-v">${n("warning")+n("info")}</span></div>
   </div>
   <div class="tscroll"><table class="organism" style="min-width:1040px">
    <thead><tr><th></th><th>Type</th><th>What needs doing, and why it matters</th><th>Client</th><th>Age</th><th class="colact"></th></tr></thead>
    <tbody>${rows||'<tr><td colspan="6"><span class="sub">Queue is clear.</span></td></tr>'}</tbody>
   </table></div>
   <div class="panel-b" style="border-top:1px solid var(--gray-200)">
     <span class="sub">Ordered by what it costs to ignore, not by type. Only the ${myClients().length} client${myClients().length===1?"":"s"} assigned to ${ME().name} appear${myClients().length===1?"s":""}.</span>
   </div></div>`;
}
/* ═══ J1 Accept invite ═══════════════════════════════════════════════════════
   16 §6, flow D step 3. One screen, no tour: logo, who granted access to what,
   the email read-only, a password field, one button. The agency never holds

/* ═══ A2, connect path: link an existing client workspace ════════════════════
   07 §5 "Linked": created by the client, funded by the client's own plan, owned
   by the client, access granted by the client approving the agency's request, and
   revocable by the client at any time. This was out of scope in 09 §6; Hitesh
   put it back in on 9 Sep 2026.

   The mechanic is two-party consent, which is the pattern Instantly ships and
   which 15 §5 verified: the agency sends a request naming a Workspace ID, the
   target workspace's owner accepts, and only then does it join. The agency can
   never claim a workspace unilaterally, and that asymmetry is the whole reason
   this mode is safe to offer.

   Creating a client is 3 steps. Connecting one is 1, and that is the point:
   onboarding becomes Connect rather than Rebuild.                              */

function connectBody(){
 const stays=[
  ["Sequences","Every campaign, step and variant, still running"],
  ["Prospects and lists","Their leads stay theirs. Nothing is copied into the agency's account"],

  ["The agency gets in","Your staff you nominate become members of their workspace"],
  ["It appears in your switcher","Alongside the clients you created, with its own colour"],
  ["Their brand stays theirs","A linked workspace keeps its own whitelabel, not yours"],
 ];
 const nots=[
  ["You do not fund it","They keep their own plan and their own invoice. It draws nothing from your pool and has no limits you can set"],
  ["You cannot delete it","You can unlink. The workspace and everything in it belongs to them"],

 ];
 const li=(rows,tone)=>'<div class="lgrid">'+rows.map(([t,d])=>
   '<div class="lrow"><span class="ltick '+tone+'">'+(tone==="no"?"&#215;":"&#10003;")+'</span>'
   +'<span><span class="lt">'+t+'</span><span class="ld">'+d+'</span></span></div>').join("")+'</div>';
 return `<div class="field"><label class="flabel" for="wsid">Their Workspace ID</label>
   <input type="text" id="wsid" value="${nc.wsid||""}" placeholder="WS-3B19-XT" autocomplete="off">

  <div class="lsec"><div class="lsec-h">What stays exactly as it is</div>${li(stays,"ok")}</div>
  <div class="lsec"><div class="lsec-h">What changes</div>${li(changes,"ok")}</div>

  <div class="msg m-info" style="margin-top:14px">${infoI}<span>Sending this notifies the workspace
   owner. <strong>Nothing happens until they approve it</strong>, and you will see it as
   <em>Link pending</em> until they do.</span></div>`;
}

function linkRequest(){
 const id="l"+Date.now().toString(36).slice(-4);
 const wsid=(nc.wsid||"WS-0000-XX").trim().toUpperCase();
 const pal=["#9333EA","#0E7490","#B91C1C","#4338CA","#A16207"];
 const c={id,name:(nc.name||wsid).trim(),company:(nc.name||wsid).trim(),email:nc.email||"owner@"+id+".example",
  colour:pal[CLIENTS.length%pal.length],mode:"linked",
  link:{state:"pending",requestedBy:"Alex Meridian",wsid,requested:"just now",owner:nc.email||"the workspace owner"},
  seq:0,mbx:0,prospects:0,sent:0,reply:0,prev:0,pos:0,created:"09 Sep, 2026",permission:"No Access",
  staff:[],users:[],mailboxes:[]};
 CLIENTS.push(c); byId[id]=c;
 nc={name:"",company:"",email:"",wsid:"",path:"create"};
 drawer=null; renderDrawer(); view={name:"clients"}; ctx="agency"; render();
}

}

 {const b=el("drLink");if(b)b.onclick=()=>{cap();linkRequest()}}

 {const r=el("mbr");if(r)r.onchange=()=>{const e=el("mbe");if(e)mb.email=e.value;

 {const d=el("mbDone");if(d)d.onclick=()=>{

/* Reports for the client: four numbers and fourteen days. Daily sends are
   derived from the workspace's cycle total the same way the mailbox counts are,
   so the chart agrees with the tiles and the tiles agree with the client list.
   Meetings are a fixture ratio on positive replies; the product records them as
   an outcome, this prototype does not carry per-thread outcomes. */
const MEETING_RATE=0.42;
const meetings=c=>Math.round(positives(c)*MEETING_RATE);
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function dailySeries(c,n){
 const perDay=c.sent/Math.max(1,CYCLE.day), out=[];
 for(let i=0;i<n;i++){
  const d=new Date(2026,8,CYCLE.day-(n-1-i)), dow=d.getDay();
  const h=((c.id.charCodeAt(0)*31+c.id.charCodeAt(1)*17+i*13)%23)/23;   /* deterministic jitter */
  const wk=(dow===0||dow===6)?0.12:1;
  const sent=Math.round(perDay*wk*(0.8+0.4*h));
  const rep=Math.round(sent*c.reply/100*(0.7+0.6*((h*7)%1)));
  out.push({d,sent,rep});
 }
 return out;
}
function reportChart(c){
 const S=dailySeries(c,14), W=640,H=200,L=46,T=18,B=30,Rr=46;
 const maxS=Math.max(1,...S.map(x=>x.sent)), maxR=Math.max(1,...S.map(x=>x.rep));
 const iw=(W-L-Rr)/S.length, bw=Math.min(22,iw*.55);
 const py=v=>T+(H-T-B)*(1-v/maxS), pr=v=>T+(H-T-B)*(1-v/maxR), px=i=>L+iw*i+iw/2;
 const grid=[0,.5,1].map(fr=>{const y=py(maxS*fr);
   return '<line x1="'+L+'" x2="'+(W-Rr)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="var(--line-soft)"/>'
    +'<text x="'+(L-8)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end" class="ax">'+(fr?abbr(Math.round(maxS*fr)):"0")+'</text>'
    +'<text x="'+(W-Rr+8)+'" y="'+(y+4).toFixed(1)+'" text-anchor="start" class="ax">'+(fr?Math.round(maxR*fr):"0")+'</text>'}).join("");
 const bars=S.map((x,i)=>'<rect class="bar-sent" x="'+(px(i)-bw/2).toFixed(1)+'" y="'+py(x.sent).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+(py(0)-py(x.sent)).toFixed(1)+'" rx="2" fill="#1D4ED8" fill-opacity=".85"><title>'+x.d.getDate()+' '+MON[x.d.getMonth()]+': '+f(x.sent)+' sent</title></rect>').join("");
 const pts=S.map((x,i)=>px(i).toFixed(1)+","+pr(x.rep).toFixed(1)).join(" ");
 const dots=S.map((x,i)=>'<circle class="dot-rep" cx="'+px(i).toFixed(1)+'" cy="'+pr(x.rep).toFixed(1)+'" r="3" fill="#15803D" stroke="#fff" stroke-width="1.5"><title>'+x.d.getDate()+' '+MON[x.d.getMonth()]+': '+x.rep+' replies</title></circle>').join("");
 const xlab=S.map((x,i)=>i%3===1?'<text x="'+px(i).toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle" class="ax">'+x.d.getDate()+' '+MON[x.d.getMonth()]+'</text>':"").join("");
 return '<svg viewBox="0 0 '+W+' '+H+'" class="chart" role="img" aria-label="Emails sent and replies per day, last 14 days">'
  +grid+xlab+bars+'<polyline points="'+pts+'" fill="none" stroke="#15803D" stroke-width="2" stroke-linejoin="round"/>'+dots+'</svg>';
}
const chartLegend=()=>`<span class="c-a" style="display:flex;gap:14px;font-size:12px;color:var(--gray-12)">
     <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:#1D4ED8;vertical-align:-1px;margin-right:6px"></span>Sent</span>

const PAGE={}; let cliQ="", estQ="", estHealth="all";
const pageOf=(id,total,size)=>{const n=Math.max(1,Math.ceil(total/size)),p=Math.min(PAGE[id]||1,n);PAGE[id]=p;return {p,n,from:(p-1)*size,to:Math.min(total,p*size)}};

 return `<div class="pager"><span class="sub">Showing ${f(g.from+1)} to ${f(g.to)} of ${f(total)} ${what}</span>

/* ═══ scale: the forty-client state ═══════════════════════════════════════════
   30 §1.4: "show scale, or state the ceiling". Seven clients is a demo; the
   agencies this is for run twenty to sixty. `scaleTo(40)` appends synthetic
   clients built the same way as the fixtures (mailboxes derived from sends,
   sequences summing to the headline totals, a limit row per resource), so
   every list, table, popover and roll-up can be rendered at the size it will
   actually be used at. Reachable with #scale=40. Nothing else changes. */
const SCALE={n:0};
const SCALE_NAMES=["Ashgrove Dental","Beacon Freight","Cobalt Works","Dunmore Capital","Elmstead Clinics","Fairhaven Legal",
 "Granite Peak Software","Halcyon Robotics","Ironbridge Steel","Juniper Analytics","Kestrel Aviation","Larkspur Media",
 "Marlow Property","Nimbus Cloud","Oakridge Schools","Pennant Insurance","Quarry Lane Foods","Rosewood Care",
 "Saltmarsh Energy","Tamar Logistics","Umber Studios","Verity Payments","Westbrook Motors","Xenon Labs","Yarrow Health",
 "Zephyr Travel","Alder Consulting","Brackenfield Farms","Corwen Textiles","Dovetail Furniture","Ember Security",
 "Fenwick Books","Glasswater Marine","Hollins Recruitment","Isley Architects","Jarrow Tools","Kelso Optics"];
function scaleTo(n){
 const r=rng("scale");
 const pal=["#B45309","#0F766E","#C2410C","#6D28D9","#0E7490","#9333EA","#4B5563","#BE185D","#1D4ED8","#047857","#B91C1C","#7C3AED"];
 let i=0;
 while(CLIENTS.length<n&&i<SCALE_NAMES.length){
  const name=SCALE_NAMES[i++], id="s"+String(i).padStart(2,"0");
  if(byId[id]) continue;
  const slug=name.toLowerCase().replace(/[^a-z]+/g,"-").replace(/^-|-$/g,"");
  const sent=Math.round((1500+r()*14000)/100)*100, seq=1+Math.floor(r()*6);
  const c={id,name,company:name+" Ltd",email:"hello@"+slug+".com",colour:pal[i%pal.length],
   seq,mbx:Math.max(2,Math.round(sent/CYCLE.day/85)),prospects:Math.round(sent*0.2/10)*10,sent,
   reply:0,prev:0,pos:+(0.5+r()*3).toFixed(1),
   created:(1+Math.floor(r()*28))+" Aug, 2026",limitsReviewed:r()<.8,
   permission:r()<.3?"Limited Access":"Full Access",staff:[],users:[["hello@"+slug+".com","Full Access"]],mailboxes:[],synthetic:true};
  /* last cycle's rate moves with this cycle's, as it does in life; independent
     draws made half the book "Falling" and the flag meaningless */
  c.reply=+(2+r()*7).toFixed(1); c.prev=+(c.reply*(0.7+0.8*r())).toFixed(1);
  SEND_DOMAINS[id]=[slug+".com",slug+"-go.com",slug+"-reach.com"]; SEQ_SETS[id]=[];
  RK.forEach(k=>{const cap=k==="sends"?Math.round(sent*1.2/500)*500
    :k==="prospects"?Math.round(c.prospects*1.3/500)*500:500*(1+Math.floor(r()*4));
    RES[k].rows[id]={res:0,cap,used:Math.min(cap,Math.round(cap*(0.2+r()*0.75)))}});
  growMailboxes(c); growSequences(c);
  const pre=ACCESS_PRESETS[c.permission==="Limited Access"?"Read everything":"Reply and run"];
  c.access={mods:pre.mods.slice(),verbs:pre.verbs.slice()};
  CLIENTS.push(c); byId[id]=c;
  if(r()<.5){PEOPLE.priya.ws[id]="Everything";c.staff.push(["Priya Nair","Admin"])}
  if(r()<.25){PEOPLE.sam.ws[id]="Reply and run";c.staff.push(["Sam Doshi","Member"])}
 }
 LAST.clients=Math.max(LAST.clients,CLIENTS.length-2);
 SCALE.n=CLIENTS.length;
}

/* the client's own account, with the agency's request waiting. Redmere Studio

 if(AGY_MOD[k]&&!MASTER_MOD[k]){ctx="own";asClient=false;inMod=RAIL2MOD[k]||k;view={name:"clients"}}
 if(k==="client"&&byId[v]) view={name:"record",id:v};
 /* the client's own side, and the create modal, are otherwise several clicks

 if(k==="asclient"&&byId[v]){ctx=v;asClient=true;cView="workspace"}

 {k:"isolate", t:"A client sees only its own workspace",

  ask:"Is this the thing blocking you from letting clients in, or is it something else?",

  src:"07 objective, 01 §6a",
  go:()=>{solo=false;ctx="nw";asClient=true;cView="sequences";openProspect=null;view={name:"clients"}}},

const REACT=[["yes","Confirmed"],["no","Contradicted"],["meh","Did not care"],["new","New requirement"]];
const RDOT={yes:"d-yes",no:"d-no",meh:"d-meh",new:"d-new"};

/* switching person goes through the same path the person menu uses, so the rail
   and the dashboard guard both apply. An operator must not be dropped on a
   dashboard they cannot see. */
function T_become(who){me_=who;if(view.name==="dash"&&!canI("dashboard"))view={name:"queue"}}

const SKEY="sess.agency-workspaces.v1";
let sIdx=0, sOpen=false, sData={};
try{sData=JSON.parse(localStorage.getItem(SKEY)||"{}")}catch(e){sData={}}
const sSave=()=>{try{localStorage.setItem(SKEY,JSON.stringify(sData))}catch(e){}};
const sRec=k=>(sData[k]=sData[k]||{r:null,n:""});

function sessRender(){
 const S=el("sess"); if(!S||S.hidden) return;
 const T=TOPICS[sIdx], rec=sRec(T.k);
 const done=TOPICS.filter(x=>sData[x.k]&&(sData[x.k].r||sData[x.k].n)).length;
 el("sessCt").textContent=(sIdx+1)+" / "+TOPICS.length;
 el("sessNow").textContent=T.t;
 el("sessPrev").disabled=sIdx===0;
 el("sessNext").disabled=sIdx===TOPICS.length-1;
 el("sessTog").innerHTML=sOpen?"&#9660;":"&#9650;";
 el("sessTog").title=sOpen?"Collapse":"Expand";
 S.className=sOpen?"open":"collapsed";
 if(!sOpen) return;
 el("sessList").innerHTML=TOPICS.map((x,i)=>{const r=(sData[x.k]||{}).r;
  return `<button class="sess-li" role="listitem" data-si="${i}" aria-current="${i===sIdx}">
   <span class="sess-dot ${r?RDOT[r]:""}"></span>
   <span><b>${x.t}</b><i>${x.src}</i></span>
   <span></span></button>`}).join("");
 el("sessMain").innerHTML=`
  <p class="sess-h">${sIdx+1}. ${T.t}</p>
  <p class="sess-sub">Testing a claim from ${T.src}</p>
  <p class="sess-q">${T.ask}</p>
  <div class="sess-grid">
   <dl class="sess-cell"><dt>What this screen claims</dt><dd>${T.claim}</dd></dl>
   <dl class="sess-cell"><dt>What would change our mind</dt><dd>${T.watch}</dd></dl>
   ${T.open?`<dl class="sess-cell"><dt>Still open</dt><dd>${T.open}</dd></dl>`:""}
  </div>
  <div class="sess-react">${REACT.map(([k,l])=>
    `<button data-r="${k}" aria-pressed="${rec.r===k}">${l}</button>`).join("")}</div>
  <textarea id="sessNote" placeholder="What they actually said. Their words, not the summary.">${rec.n.replace(/</g,"&lt;")}</textarea>
  <div class="sess-foot">
   <button class="shd-button shd-button--tertiary shd-button--sm" id="sessCopy">Copy notes as Markdown</button>
   <button class="shd-button shd-button--tertiary shd-button--sm" id="sessDl">Download</button>
   <button class="shd-button shd-button--tertiary shd-button--sm" id="sessClear">Clear session</button>
   <span class="sub">${done} of ${TOPICS.length} recorded &middot; saved in this browser</span>
  </div>`;
 el("sessList").querySelectorAll("[data-si]").forEach(b=>b.onclick=()=>sessGo(+b.dataset.si));
 el("sessMain").querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{
   const r=b.dataset.r; rec.r=rec.r===r?null:r; sSave(); sessRender()});
 const n=el("sessNote");
 n.oninput=()=>{rec.n=n.value;sSave()};
 n.onblur=()=>sessRender();
 el("sessCopy").onclick=()=>sessExport("copy");
 el("sessDl").onclick=()=>sessExport("file");
 el("sessClear").onclick=()=>{if(confirm("Clear every reaction and note from this session?")){sData={};sSave();sessRender()}};
}

/* a topic navigates the prototype and then re-renders it. The panel is outside
   #page, so render() never touches it. */
function sessGo(i){
 sIdx=Math.max(0,Math.min(TOPICS.length-1,i));
 modal=null;drawer=null;popOpen=false;dq="";newOpen=false;newPick=null;
 TOPICS[sIdx].go();
 render();
 if(el("modalWrap"))renderModal();
 if(el("drawerWrap"))renderDrawer();
 sessRender();
}

function sessMd(){
 const stamp=new Date().toISOString().slice(0,10);
 const lab={yes:"Confirmed",no:"Contradicted",meh:"Did not care",new:"New requirement"};
 let out="# Validation session, "+stamp+"\n\n"
  +"Walked against the prototype at `prototype/agency-admin.html`.\n\n"
  +"| # | Topic | Reaction | What they said | Source |\n|---|---|---|---|---|\n";
 TOPICS.forEach((t,i)=>{const r=sData[t.k]||{};
  out+="| "+(i+1)+" | "+t.t+" | "+(r.r?"**"+lab[r.r]+"**":"–")+" | "
    +((r.n||"").replace(/\s*\n\s*/g," ").replace(/\|/g,"\\|")||"–")+" | `"+t.src+"` |\n"});
 const changed=TOPICS.filter(t=>["no","new"].indexOf(((sData[t.k]||{}).r))>-1);
 out+="\n## What has to change\n\n"+(changed.length
  ?changed.map(t=>"- **"+t.t+"** ("+lab[sData[t.k].r]+"). "+((sData[t.k].n||"").replace(/\s*\n\s*/g," ")||"No note taken.")
     +" Claim under test: "+t.claim).join("\n")
  :"Nothing was contradicted and no new requirement was raised. Record that as a result, not as a blank.")+"\n";
 return out;
}
function sessExport(how){
 const md=sessMd();
 if(how==="copy"){
  const done=()=>{const b=el("sessCopy");b.textContent="Copied";setTimeout(()=>{b.textContent="Copy notes as Markdown"},1400)};
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(md).then(done,()=>sessFallback(md));
  else sessFallback(md);
  return;
 }
 const a=document.createElement("a");
 a.href=URL.createObjectURL(new Blob([md],{type:"text/markdown"}));
 a.download="validation-session-"+new Date().toISOString().slice(0,10)+".md";
 document.body.appendChild(a);a.click();a.remove();
}
/* clipboard is blocked on file:// in some builds, and a demo is the worst place
   to discover that. Fall back to a selectable textarea. */
function sessFallback(md){
 const w=document.createElement("div");
 w.style.cssText="position:fixed;inset:0;z-index:200;background:rgba(17,24,39,.45);display:flex;align-items:center;justify-content:center;padding:24px";
 w.innerHTML='<div style="background:#fff;border-radius:8px;padding:16px;max-width:720px;width:100%">'
  +'<p style="margin:0 0 8px;font-size:14px;font-weight:600">Select and copy</p>'
  +'<textarea readonly style="width:100%;box-sizing:border-box;height:320px;font-family:ui-monospace,Menlo,monospace;font-size:12px;border:1px solid #e5e7eb;border-radius:6px;padding:10px"></textarea>'
  +'<div style="margin-top:10px;text-align:right"><button style="font:inherit;font-size:13px;padding:6px 12px;border-radius:6px;border:1px solid #e5e7eb;background:#fff;cursor:pointer">Close</button></div></div>';
 document.body.appendChild(w);
 const ta=w.querySelector("textarea");ta.value=md;ta.select();
 w.querySelector("button").onclick=()=>w.remove();
 w.onclick=e=>{if(e.target===w)w.remove()};
}

function sessShow(on){
 const S=el("sess");
 S.hidden=!on;
 el("sessReopen").hidden=on;
 document.body.style.paddingBottom=on?(sOpen?"min(340px,46vh)":"46px"):"0";
 if(on) sessRender();
}
el("sessPrev").onclick=()=>sessGo(sIdx-1);
el("sessNext").onclick=()=>sessGo(sIdx+1);
el("sessTog").onclick=()=>{sOpen=!sOpen;document.body.style.paddingBottom=sOpen?"min(340px,46vh)":"46px";sessRender()};
el("sessHide").onclick=()=>sessShow(false);
el("sessReopen").onclick=()=>sessShow(true);
/* Escape hides the panel, but only once nothing else is claiming Escape: the
   modal and the drawer both use it and they are on top. */
document.addEventListener("keydown",e=>{
 if(e.key==="Escape"&&!modal&&!drawer&&!popOpen&&!el("sess").hidden){sessShow(false)}
 if((e.metaKey||e.ctrlKey)&&e.key==="/"){e.preventDefault();sessShow(el("sess").hidden)}
 if(el("sess").hidden||document.activeElement===el("sessNote")) return;
 if(e.key==="["){e.preventDefault();sessGo(sIdx-1)}
 if(e.key==="]"){e.preventDefault();sessGo(sIdx+1)}
});
/* #present opens the session on topic 1. Without the hash the prototype boots
   exactly as it did, so every existing deep link and the whole harness are
   unaffected.                                                              */
if(/(^|[#&])present\b/.test(location.hash)){sOpen=true;sessShow(true);sessGo(0)}
else if(location.hash==="" ){sessShow(true)}
</script>
